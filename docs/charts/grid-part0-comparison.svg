<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">
<rect width="760" height="420" fill="#f8fafc" rx="6"/>
<text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Grid vs Buy-Hold vs DCA — เปรียบเทียบ Equity Curve</text>

<!-- Axes -->
<line x1="80" y1="50" x2="80" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="80" y1="360" x2="700" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
<text x="22" y="215" text-anchor="middle" font-size="12" fill="#64748b" transform="rotate(-90,22,215)">Portfolio Value (%)</text>
<text x="395" y="395" text-anchor="middle" font-size="12" fill="#64748b">เวลา →</text>

<!-- Y-axis labels -->
<text x="72" y="360" text-anchor="end" font-size="10" fill="#94a3b8">100%</text>
<text x="72" y="280" text-anchor="end" font-size="10" fill="#94a3b8">115%</text>
<text x="72" y="200" text-anchor="end" font-size="10" fill="#94a3b8">130%</text>
<text x="72" y="120" text-anchor="end" font-size="10" fill="#94a3b8">145%</text>
<line x1="78" y1="360" x2="82" y2="360" stroke="#94a3b8" stroke-width="1"/>
<line x1="78" y1="280" x2="82" y2="280" stroke="#94a3b8" stroke-width="1"/>
<line x1="78" y1="200" x2="82" y2="200" stroke="#94a3b8" stroke-width="1"/>
<line x1="78" y1="120" x2="82" y2="120" stroke="#94a3b8" stroke-width="1"/>
<line x1="80" y1="280" x2="700" y2="280" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="80" y1="200" x2="700" y2="200" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="80" y1="120" x2="700" y2="120" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Buy & Hold (blue — volatile, ends similar) -->
<polyline points="80,360 140,320 180,260 240,200 270,290 320,210 360,130 400,250 440,170 490,90 530,200 570,140 620,80 660,160 700,200"
          fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>

<!-- DCA (amber — steady, smoother) -->
<polyline points="80,360 140,340 200,320 260,305 320,288 380,270 420,252 460,240 500,224 540,210 580,196 620,184 660,170 700,160"
          fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/>

<!-- Grid (cyan — smoothest, lowest DD) -->
<polyline points="80,360 130,352 175,344 220,335 265,324 310,312 355,300 400,288 445,278 490,265 530,254 565,243 600,232 640,221 700,210"
          fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linejoin="round"/>

<!-- Shaded area below grid (very light) -->
<polygon points="80,360 130,352 175,344 220,335 265,324 310,312 355,300 400,288 445,278 490,265 530,254 565,243 600,232 640,221 700,210 700,360"
         fill="#06b6d4" fill-opacity="0.06"/>

<!-- Legend -->
<rect x="100" y="55" width="14" height="3" fill="#06b6d4" rx="1"/>
<text x="120" y="62" font-size="11" fill="#0f172a">Grid Trading (ราบเรียบ, DD น้อย)</text>
<rect x="100" y="75" width="14" height="3" fill="#2563eb" rx="1"/>
<text x="120" y="82" font-size="11" fill="#0f172a">Buy &amp; Hold (ผันผวนสูง)</text>
<rect x="100" y="95" width="14" height="3" fill="#d97706" rx="1"/>
<text x="120" y="102" font-size="11" fill="#0f172a">DCA (กลางๆ)</text>

<!-- Annotation: Grid has lowest DD -->
<text x="560" y="255" font-size="10" fill="#06b6d4">↑ Grid</text>
<text x="560" y="175" font-size="10" fill="#d97706">↑ DCA</text>
<text x="610" y="95" font-size="10" fill="#2563eb">↑ B&amp;H peak</text>

<!-- DD annotation for Buy & Hold -->
<line x1="490" y1="90" x2="490" y2="200" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
<text x="495" y="148" font-size="9" fill="#dc2626">DD ≈ 25%</text>

<!-- Caption -->
<text x="380" y="410" text-anchor="middle" font-size="11" fill="#94a3b8">Grid ให้ equity curve ราบเรียบกว่า แม้ total return ใกล้เคียงกัน — คุณภาพแตกต่าง ผลรวมคล้ายกัน</text>
</svg>
