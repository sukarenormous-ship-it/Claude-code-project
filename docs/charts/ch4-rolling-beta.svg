<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="260" fill="#f9fafb"/>
  <text x="380" y="20" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Rolling OLS β̂ (window 60d) — ตาม Regime ของตลาด</text>
  <rect x="40" y="30" width="690" height="190" fill="white" stroke="#e5e7eb"/>
  <line x1="60" y1="215" x2="710" y2="215" stroke="#374151" stroke-width="1.5"/>
  <line x1="60" y1="215" x2="60" y2="48" stroke="#374151" stroke-width="1.5"/>
  <text x="380" y="235" text-anchor="middle" font-size="10" fill="#64748b">วัน (rolling window ขนาด 60d)</text>
  <text x="52" y="75" text-anchor="end" font-size="10" fill="#64748b">1.15</text>
  <text x="52" y="132" text-anchor="end" font-size="10" fill="#64748b">1.00</text>
  <text x="52" y="190" text-anchor="end" font-size="10" fill="#64748b">0.85</text>
  <line x1="58" y1="132" x2="62" y2="132" stroke="#374151" stroke-width="1"/>
  <line x1="60" y1="132" x2="710" y2="132" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.5"/>
  <!-- Background regime coloring -->
  <rect x="60" y="48" width="165" height="167" fill="#f0fdf4" opacity="0.4"/>
  <rect x="225" y="48" width="130" height="167" fill="#fffbeb" opacity="0.4"/>
  <rect x="355" y="48" width="165" height="167" fill="#fef2f2" opacity="0.4"/>
  <rect x="520" y="48" width="190" height="167" fill="#f0fdf4" opacity="0.4"/>
  <text x="143" y="62" text-anchor="middle" font-size="9" fill="#16a34a">Normal</text>
  <text x="290" y="62" text-anchor="middle" font-size="9" fill="#d97706">Stressed</text>
  <text x="438" y="62" text-anchor="middle" font-size="9" fill="#dc2626">Regime Shift</text>
  <text x="615" y="62" text-anchor="middle" font-size="9" fill="#16a34a">Recovery</text>
  <!-- Rolling beta line -->
  <polyline points="60,130 80,128 100,126 120,128 140,130 160,132 180,128 200,125 225,122 245,115 265,108 285,102 305,98 325,96 355,95 375,98 395,105 415,115 435,125 455,130 475,135 500,138 520,140 540,138 560,135 580,132 600,130 625,130 650,130 680,130 710,130"
    fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <!-- +/-5% lines -->
  <line x1="60" y1="105" x2="710" y2="105" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  <line x1="60" y1="159" x2="710" y2="159" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  <text x="712" y="108" font-size="9" fill="#d97706">+5%</text>
  <text x="712" y="162" font-size="9" fill="#d97706">−5%</text>
  <text x="380" y="252" text-anchor="middle" font-size="11" fill="#64748b">ถ้า β เปลี่ยน &gt;5% จากวันก่อน — reduce position size ครึ่งหนึ่ง</text>
</svg>
