<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Sarabun',sans-serif">
  <!-- Background -->
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Grid Bloating Patterns — 3 รูปแบบ Inventory</text>

  <!-- Panel dividers -->
  <line x1="258" y1="42" x2="258" y2="340" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="505" y1="42" x2="505" y2="340" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- PANEL 1: บวมบน (Top-Heavy) x=30 to x=245 -->
  <!-- ============================================================ -->
  <text x="137" y="50" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">บวมบน</text>
  <text x="137" y="64" font-size="9" fill="#64748b" text-anchor="middle">Top-Heavy Inventory</text>

  <!-- Current price row highlight -->
  <rect x="30" y="168" width="215" height="44" fill="#ecfeff" opacity="0.5"/>

  <!-- Row separator dashed lines -->
  <line x1="30" y1="102" x2="245" y2="102" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="30" y1="146" x2="245" y2="146" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="30" y1="212" x2="245" y2="212" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="30" y1="256" x2="245" y2="256" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- Current price cyan line -->
  <line x1="30" y1="190" x2="245" y2="190" stroke="#06b6d4" stroke-width="2"/>

  <!-- Price labels — right-aligned at x=72 -->
  <text x="72" y="84" font-size="9" fill="#475569" text-anchor="end">$110k</text>
  <text x="72" y="128" font-size="9" fill="#475569" text-anchor="end">$105k</text>
  <text x="72" y="173" font-size="9" font-weight="700" fill="#06b6d4" text-anchor="end">$100k</text>
  <text x="72" y="217" font-size="9" fill="#475569" text-anchor="end">$95k</text>
  <text x="72" y="261" font-size="9" fill="#475569" text-anchor="end">$90k</text>

  <!-- Bars start at x=78 -->
  <!-- $110k row center y=80+11=91, bar h=20 so y=80 -->
  <rect x="78" y="72" width="110" height="20" rx="2" fill="#fca5a5" opacity="0.85"/>
  <text x="192" y="85" font-size="9" fill="#991b1b"> 8 BTC</text>
  <!-- $105k -->
  <rect x="78" y="116" width="80" height="20" rx="2" fill="#fca5a5" opacity="0.75"/>
  <text x="162" y="129" font-size="9" fill="#991b1b"> 6 BTC</text>
  <!-- $100k (current) -->
  <rect x="78" y="160" width="45" height="20" rx="2" fill="#fca5a5" opacity="0.60"/>
  <text x="127" y="173" font-size="9" fill="#991b1b"> 3 BTC</text>
  <!-- $95k -->
  <rect x="78" y="204" width="20" height="20" rx="2" fill="#fca5a5" opacity="0.40"/>
  <text x="102" y="217" font-size="9" fill="#991b1b"> 1 BTC</text>
  <!-- $90k -->
  <rect x="78" y="248" width="8" height="20" rx="2" fill="#fca5a5" opacity="0.25"/>

  <!-- Assessment box -->
  <rect x="33" y="276" width="210" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="138" y="292" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="600">⚑ ราคาลงต่อ</text>
  <text x="138" y="308" font-size="9" fill="#991b1b" text-anchor="middle">→ ต้องการ capital มาก</text>

  <!-- ============================================================ -->
  <!-- PANEL 2: บวมล่าง (Bottom-Heavy) x=275 to x=490 -->
  <!-- ============================================================ -->
  <text x="382" y="50" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">บวมล่าง</text>
  <text x="382" y="64" font-size="9" fill="#64748b" text-anchor="middle">Bottom-Heavy Inventory</text>

  <!-- Current price row highlight -->
  <rect x="275" y="168" width="215" height="44" fill="#ecfeff" opacity="0.5"/>

  <!-- Row separators -->
  <line x1="275" y1="102" x2="490" y2="102" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="275" y1="146" x2="490" y2="146" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="275" y1="212" x2="490" y2="212" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="275" y1="256" x2="490" y2="256" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="275" y1="190" x2="490" y2="190" stroke="#06b6d4" stroke-width="2"/>

  <!-- Price labels at x=317 -->
  <text x="317" y="84" font-size="9" fill="#475569" text-anchor="end">$110k</text>
  <text x="317" y="128" font-size="9" fill="#475569" text-anchor="end">$105k</text>
  <text x="317" y="173" font-size="9" font-weight="700" fill="#06b6d4" text-anchor="end">$100k</text>
  <text x="317" y="217" font-size="9" fill="#475569" text-anchor="end">$95k</text>
  <text x="317" y="261" font-size="9" fill="#475569" text-anchor="end">$90k</text>

  <!-- Bars start at x=323 -->
  <rect x="323" y="72" width="8" height="20" rx="2" fill="#93c5fd" opacity="0.25"/>
  <rect x="323" y="116" width="20" height="20" rx="2" fill="#93c5fd" opacity="0.40"/>
  <text x="347" y="129" font-size="9" fill="#1d4ed8"> 1 BTC</text>
  <rect x="323" y="160" width="35" height="20" rx="2" fill="#93c5fd" opacity="0.55"/>
  <text x="362" y="173" font-size="9" fill="#1d4ed8"> 2 BTC</text>
  <rect x="323" y="204" width="75" height="20" rx="2" fill="#93c5fd" opacity="0.75"/>
  <text x="402" y="217" font-size="9" fill="#1d4ed8"> 5 BTC</text>
  <rect x="323" y="248" width="110" height="20" rx="2" fill="#93c5fd" opacity="0.90"/>
  <text x="437" y="261" font-size="9" fill="#1d4ed8"> 8 BTC</text>

  <!-- Assessment box -->
  <rect x="278" y="276" width="210" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="383" y="292" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="600">⚑ cashflow น้อย</text>
  <text x="383" y="308" font-size="9" fill="#1d4ed8" text-anchor="middle">ถ้าราคาไม่ตก</text>

  <!-- ============================================================ -->
  <!-- PANEL 3: บวมกลาง (Bell) x=520 to x=735 -->
  <!-- ============================================================ -->
  <text x="627" y="50" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">บวมกลาง (Bell)</text>
  <text x="627" y="64" font-size="9" fill="#64748b" text-anchor="middle">Bell-Shaped Inventory</text>

  <!-- Current price row highlight -->
  <rect x="520" y="168" width="215" height="44" fill="#ecfeff" opacity="0.5"/>

  <!-- Row separators -->
  <line x1="520" y1="102" x2="735" y2="102" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="520" y1="146" x2="735" y2="146" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="520" y1="212" x2="735" y2="212" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="520" y1="256" x2="735" y2="256" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="520" y1="190" x2="735" y2="190" stroke="#06b6d4" stroke-width="2"/>

  <!-- Price labels at x=562 -->
  <text x="562" y="84" font-size="9" fill="#475569" text-anchor="end">$110k</text>
  <text x="562" y="128" font-size="9" fill="#475569" text-anchor="end">$105k</text>
  <text x="562" y="173" font-size="9" font-weight="700" fill="#06b6d4" text-anchor="end">$100k</text>
  <text x="562" y="217" font-size="9" fill="#475569" text-anchor="end">$95k</text>
  <text x="562" y="261" font-size="9" fill="#475569" text-anchor="end">$90k</text>

  <!-- Bars start at x=568 -->
  <rect x="568" y="72" width="25" height="20" rx="2" fill="#86efac" opacity="0.45"/>
  <text x="597" y="85" font-size="9" fill="#15803d"> 2 BTC</text>
  <rect x="568" y="116" width="75" height="20" rx="2" fill="#86efac" opacity="0.70"/>
  <text x="647" y="129" font-size="9" fill="#15803d"> 6 BTC</text>
  <rect x="568" y="160" width="110" height="20" rx="2" fill="#86efac" opacity="0.90"/>
  <text x="682" y="173" font-size="9" fill="#15803d"> 8 BTC ★</text>
  <rect x="568" y="204" width="75" height="20" rx="2" fill="#86efac" opacity="0.70"/>
  <text x="647" y="217" font-size="9" fill="#15803d"> 6 BTC</text>
  <rect x="568" y="248" width="25" height="20" rx="2" fill="#86efac" opacity="0.45"/>
  <text x="597" y="261" font-size="9" fill="#15803d"> 2 BTC</text>

  <!-- Assessment box -->
  <rect x="523" y="276" width="210" height="44" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="628" y="292" font-size="9" fill="#15803d" text-anchor="middle" font-weight="600">✓ สมดุล: cashflow ดี</text>
  <text x="628" y="308" font-size="9" fill="#15803d" text-anchor="middle">รอบ mean</text>

  <!-- ============================================================ -->
  <!-- LEGEND (current price indicator) -->
  <!-- ============================================================ -->
  <line x1="185" y1="340" x2="220" y2="340" stroke="#06b6d4" stroke-width="2"/>
  <text x="224" y="344" font-size="9" fill="#0e7490">= Current Price ($100k)</text>

  <!-- ============================================================ -->
  <!-- CAPTION -->
  <!-- ============================================================ -->
  <text x="380" y="430" font-size="10" fill="#94a3b8" text-anchor="middle">ทั้ง 3 แบบมี P&amp;L ใกล้เคียงกัน — ความต่างคือ risk distribution และ smoothness ของ cashflow</text>
</svg>
