<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">
<rect width="760" height="460" fill="#f8fafc" rx="6"/>
<text x="380" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Grid-Framework + Indicator Execution — แนวคิดหลัก</text>
<text x="380" y="42" text-anchor="middle" font-size="11" fill="#64748b">Grid framework คิดเรื่องทุน/risk/จำนวน order — Indicator ตัดสินใจ "เมื่อไหร่" เปิด order</text>

<!-- Left box: GRID FRAMEWORK -->
<rect x="40" y="70" width="280" height="260" fill="#ecfeff" rx="10" stroke="#06b6d4" stroke-width="2"/>
<text x="180" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">GRID FRAMEWORK</text>
<text x="180" y="110" text-anchor="middle" font-size="10" fill="#0891b2">(คำนวณก่อนเปิด order)</text>

<text x="60" y="135" font-size="11" fill="#0f172a" font-weight="600">📐 Zone [Low, High]</text>
<text x="65" y="150" font-size="10" fill="#475569">Donchian + Hurst filter</text>

<text x="60" y="170" font-size="11" fill="#0f172a" font-weight="600">📏 Step Size</text>
<text x="65" y="185" font-size="10" fill="#475569">ATR × k (Keltner)</text>

<text x="60" y="205" font-size="11" fill="#0f172a" font-weight="600">💰 Capital per Level</text>
<text x="65" y="220" font-size="10" fill="#475569">Kelly f* × capital / N</text>

<text x="60" y="240" font-size="11" fill="#0f172a" font-weight="600">🛡️ Risk Budget</text>
<text x="65" y="255" font-size="10" fill="#475569">Max DD = 5% total capital</text>

<text x="60" y="275" font-size="11" fill="#0f172a" font-weight="600">📊 N Orders (total)</text>
<text x="65" y="290" font-size="10" fill="#475569">= (High−Low) / Step</text>

<text x="180" y="320" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Framework พร้อมแล้ว — รอ signal</text>

<!-- Right box: INDICATOR EXECUTION -->
<rect x="440" y="70" width="280" height="260" fill="#f5f3ff" rx="10" stroke="#7c3aed" stroke-width="2"/>
<text x="580" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">INDICATOR EXECUTION</text>
<text x="580" y="110" text-anchor="middle" font-size="10" fill="#7c3aed">(ตัดสินใจ timing)</text>

<text x="460" y="135" font-size="11" fill="#0f172a" font-weight="600">Style 1: Mean-Reversion</text>
<text x="465" y="150" font-size="10" fill="#475569">Z-score &gt; 2 → open BUY batch</text>

<text x="460" y="170" font-size="11" fill="#0f172a" font-weight="600">Style 2: Trend Follow</text>
<text x="465" y="185" font-size="10" fill="#475569">ADX &gt; 25 → pause grid</text>

<text x="460" y="205" font-size="11" fill="#0f172a" font-weight="600">Style 3: Vol Confirm</text>
<text x="465" y="220" font-size="10" fill="#475569">IV rank &lt; 0.4 → full deploy</text>

<text x="460" y="240" font-size="11" fill="#0f172a" font-weight="600">Style 4: Composite Score</text>
<text x="465" y="255" font-size="10" fill="#475569">Score 0–100 → slot multiplier</text>
<text x="465" y="268" font-size="10" fill="#475569">0.5× / 1× / 1.5× / 2×</text>

<text x="580" y="320" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">Signal → slot multiplier → open</text>

<!-- Center arrow (framework → execution) -->
<text x="380" y="188" text-anchor="middle" font-size="12" fill="#d97706" font-weight="700">Grid math</text>
<text x="380" y="204" text-anchor="middle" font-size="10" fill="#d97706">defines WHAT</text>
<line x1="325" y1="195" x2="345" y2="195" stroke="#d97706" stroke-width="2"/>
<line x1="415" y1="195" x2="435" y2="195" stroke="#d97706" stroke-width="2"/>
<polygon points="335,190 345,195 335,200" fill="#d97706"/>
<polygon points="425,190 435,195 425,200" fill="#d97706"/>

<text x="380" y="228" text-anchor="middle" font-size="12" fill="#d97706" font-weight="700">Indicator</text>
<text x="380" y="244" text-anchor="middle" font-size="10" fill="#d97706">decides WHEN</text>

<!-- Bottom: result box -->
<rect x="180" y="355" width="400" height="70" fill="#f0fdf4" rx="8" stroke="#16a34a" stroke-width="1.5"/>
<text x="380" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">ผลลัพธ์ที่คาดหวัง</text>
<text x="380" y="396" text-anchor="middle" font-size="10" fill="#166534">Framework-only: Sharpe 0.65 · DD −4.2%</text>
<text x="380" y="410" text-anchor="middle" font-size="10" fill="#166534">Framework + ADX filter: Sharpe 0.72 · DD −2.8%  ← improvement</text>
<text x="380" y="424" text-anchor="middle" font-size="10" fill="#64748b">P&amp;L รวมใกล้เคียงกัน แต่ risk-adjusted return ดีขึ้น</text>

<!-- Arrows to result box -->
<line x1="180" y1="332" x2="280" y2="355" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="580" y1="332" x2="480" y2="355" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

<text x="380" y="448" text-anchor="middle" font-size="11" fill="#94a3b8">Grid framework = alpha หลัก · Indicator = ปรับ Sharpe · ไม่ใช่เพิ่ม P&amp;L 50%</text>
</svg>
