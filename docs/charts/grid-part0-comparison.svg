<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">

<!-- Background -->
<rect width="760" height="440" fill="#ffffff"/>

<!-- Title -->
<text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Grid vs Buy-Hold vs DCA — เปรียบเทียบ Equity Curve</text>

<!-- Chart area: x=70 to x=730, y=50 to y=385 -->

<!-- Y-axis line -->
<line x1="70" y1="50" x2="70" y2="385" stroke="#94a3b8" stroke-width="1.5"/>
<!-- X-axis line -->
<line x1="70" y1="385" x2="730" y2="385" stroke="#94a3b8" stroke-width="1.5"/>

<!--
  Y-axis: 100% (y=385) to 150% (y=50)
  Range = 50 percentage points over 335px => 6.7px per 1%
  y = 385 - (value - 100) * 6.7
  100% => 385
  110% => 385 - 67 = 318
  120% => 385 - 134 = 251
  130% => 385 - 201 = 184
  140% => 385 - 268 = 117
  150% => 385 - 335 = 50
-->

<!-- Y-axis gridlines (very light gray dashes) -->
<line x1="70" y1="318" x2="730" y2="318" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="70" y1="251" x2="730" y2="251" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="70" y1="184" x2="730" y2="184" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="70" y1="117" x2="730" y2="117" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

<!-- Y-axis labels -->
<text x="62" y="389" text-anchor="end" font-size="10" fill="#64748b">100%</text>
<text x="62" y="322" text-anchor="end" font-size="10" fill="#64748b">110%</text>
<text x="62" y="255" text-anchor="end" font-size="10" fill="#64748b">120%</text>
<text x="62" y="188" text-anchor="end" font-size="10" fill="#64748b">130%</text>
<text x="62" y="121" text-anchor="end" font-size="10" fill="#64748b">140%</text>
<text x="62" y="54" text-anchor="end" font-size="10" fill="#64748b">150%</text>

<!-- Y-axis title (rotated) -->
<text x="14" y="220" text-anchor="middle" font-size="10" fill="#64748b" transform="rotate(-90,14,220)">Portfolio Value (%)</text>

<!--
  X-axis: 12 months mapped from x=70 (M1) to x=730 (M12)
  Width = 660px over 11 intervals => 60px per month
  M1 = x=70, M2=130, M3=190, M4=250, M5=310, M6=370, M7=430, M8=490, M9=550, M10=610, M11=670, M12=730
-->

<!-- X-axis tick labels: M1, M3, M6, M9, M12 -->
<text x="70" y="398" text-anchor="middle" font-size="10" fill="#64748b">M1</text>
<text x="190" y="398" text-anchor="middle" font-size="10" fill="#64748b">M3</text>
<text x="370" y="398" text-anchor="middle" font-size="10" fill="#64748b">M6</text>
<text x="550" y="398" text-anchor="middle" font-size="10" fill="#64748b">M9</text>
<text x="730" y="398" text-anchor="middle" font-size="10" fill="#64748b">M12</text>

<!-- X-axis tick marks -->
<line x1="70" y1="385" x2="70" y2="390" stroke="#94a3b8" stroke-width="1"/>
<line x1="190" y1="385" x2="190" y2="390" stroke="#94a3b8" stroke-width="1"/>
<line x1="370" y1="385" x2="370" y2="390" stroke="#94a3b8" stroke-width="1"/>
<line x1="550" y1="385" x2="550" y2="390" stroke="#94a3b8" stroke-width="1"/>
<line x1="730" y1="385" x2="730" y2="390" stroke="#94a3b8" stroke-width="1"/>

<!--
  ============================================================
  LINE 1: GRID TRADING (cyan #06b6d4, stroke-width=3)
  Smooth upward, very small oscillations, ends ~138%
  138% => y = 385 - 38*6.7 = 385 - 254.6 = 130
  Points (monthly):
  M1(70,385), M2(130,372), M3(190,358), M4(250,344), M5(310,330),
  M6(370,316), M7(430,298), M8(490,283), M9(550,268), M10(610,250),
  M11(670,237), M12(730,224)
  Small oscillations: add ±3 to even months
  ============================================================
-->
<polyline
  points="70,385 130,370 190,357 250,341 310,329 370,315 430,297 490,281 550,267 610,248 670,235 730,224"
  fill="none" stroke="#06b6d4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

<!--
  ============================================================
  LINE 2: DCA (amber #d97706, stroke-width=2)
  Moderately smooth, ends ~132%
  132% => y = 385 - 32*6.7 = 385 - 214.4 = 171
  Slightly more variation than Grid but less than B&H
  ============================================================
-->
<polyline
  points="70,385 130,376 190,364 250,353 310,342 370,327 430,318 490,304 550,291 610,278 670,261 730,240"
  fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

<!--
  ============================================================
  LINE 3: BUY & HOLD (blue #2563eb, stroke-width=2)
  Volatile zigzag, big dip ~M7, ends ~135%
  135% => y = 385 - 35*6.7 = 385 - 234.5 = 151
  Big dip at M7: drops to ~72% below start => y=385+28*6.7=572 capped...
  Actually "DD ~28%" means from peak, not from 100%.
  Say peak was ~128% (y=193) and dip is 28% of that peak => drops to ~92% (y=305)
  Let's say: peak at M5 ~128% (y=193), dip at M7 ~100% (y=385)... too deep.
  Let's use: peak at M4 ~125% (y=217), dip at M7 ~97% (y=405)...
  Keep it within chart: peak at M4 y=218, dip at M7 y=318 (110%), which is 28% drawdown from peak
  125% peak, dip to 90% of 125% = ~90%...
  Use simpler: from a local high of 130% (y=184), drop to ~102% (y=371).
  That is (130-102)/130 ~ 21.5%... not quite 28%.
  Let peak=133% (y=174), dip=95.7% of 133 ~ 96% (y=318). (133-96)/133 = 27.8% ~ 28%.
  ============================================================
-->
<polyline
  points="70,385 130,367 190,345 250,320 310,295 370,278 430,318 490,350 550,290 610,248 670,215 730,200"
  fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

<!--
  Vertical red dashed line at dip (M7 = x=430)
  From y=50 to y=385
-->
<line x1="430" y1="50" x2="430" y2="385" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>

<!-- DD annotation near the dip -->
<rect x="434" y="290" width="68" height="22" rx="3" fill="#fff1f2" stroke="#fca5a5" stroke-width="1"/>
<text x="468" y="305" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="700">DD ~28%</text>

<!--
  ============================================================
  LEGEND BOX (top-left area, y=58 to y=112)
  x=78, three rows
  ============================================================
-->
<rect x="78" y="56" width="296" height="80" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

<!-- Legend row 1: Grid Trading (cyan) -->
<rect x="90" y="68" width="14" height="10" rx="2" fill="#06b6d4"/>
<text x="110" y="78" font-size="10" fill="#111827" font-weight="600">Grid Trading</text>
<text x="185" y="78" font-size="10" fill="#64748b"> — ราบเรียบ, cashflow ทุกวัน</text>

<!-- Legend row 2: DCA (amber) -->
<rect x="90" y="87" width="14" height="10" rx="2" fill="#d97706"/>
<text x="110" y="97" font-size="10" fill="#111827" font-weight="600">DCA</text>
<text x="136" y="97" font-size="10" fill="#64748b"> — สม่ำเสมอ</text>

<!-- Legend row 3: Buy & Hold (blue) -->
<rect x="90" y="106" width="14" height="10" rx="2" fill="#2563eb"/>
<text x="110" y="116" font-size="10" fill="#111827" font-weight="600">Buy &amp; Hold</text>
<text x="163" y="116" font-size="10" fill="#64748b"> — ผันผวนสูง</text>

<!-- Caption -->
<text x="380" y="430" text-anchor="middle" font-size="10" fill="#94a3b8">Grid ให้ equity curve ราบเรียบกว่า แม้ total return ใกล้เคียงกัน</text>

</svg>
