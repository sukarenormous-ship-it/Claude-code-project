<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="680" height="280" fill="#f9fafb"/>
  <text x="340" y="22" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Pair Selection Funnel — คัดจาก Universe สู่ Tradeable Pairs</text>
  <defs>
    <marker id="arrf" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Funnel levels -->
  <polygon points="120,40 560,40 520,85 160,85" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="67" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">1. Universe — ทุก pair (n²/2 pairs)</text>
  <line x1="340" y1="85" x2="340" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#arrf)"/>
  <polygon points="160,100 520,100 490,145 210,145" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="127" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="700">2. ρ &gt; 0.7 (Correlation filter)</text>
  <line x1="340" y1="145" x2="340" y2="160" stroke="#374151" stroke-width="1.5" marker-end="url(#arrf)"/>
  <polygon points="210,160 490,160 470,205 230,205" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="187" text-anchor="middle" font-size="12" fill="#d97706" font-weight="700">3. ADF p &lt; 0.05 (Cointegration)</text>
  <line x1="340" y1="205" x2="340" y2="220" stroke="#374151" stroke-width="1.5" marker-end="url(#arrf)"/>
  <polygon points="230,220 470,220 450,255 260,255" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="340" y="242" text-anchor="middle" font-size="12" fill="#0d9488" font-weight="700">4. Half-life &lt; target → Trade ✓</text>
  <!-- Side counts -->
  <text x="108" y="67" text-anchor="middle" font-size="11" fill="#64748b">N=1000</text>
  <text x="148" y="127" text-anchor="middle" font-size="11" fill="#64748b">~200</text>
  <text x="202" y="187" text-anchor="middle" font-size="11" fill="#64748b">~40</text>
  <text x="222" y="242" text-anchor="middle" font-size="11" fill="#0d9488">5–10</text>
  <text x="340" y="275" text-anchor="middle" font-size="11" fill="#64748b">คัดแบบ sequential — แต่ละด่านกรองออก ~80% ของที่เหลือ</text>
</svg>
