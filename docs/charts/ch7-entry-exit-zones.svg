<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="280" fill="#f9fafb"/>
  <text x="380" y="18" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">OU Path กับ Trading Zones (GARCH z-score)</text>
  <rect x="30" y="25" width="700" height="220" fill="white" stroke="#e5e7eb"/>
  <!-- Zone fills -->
  <rect x="50" y="35" width="660" height="32" fill="#fef2f2" opacity="0.7"/>
  <rect x="50" y="67" width="660" height="40" fill="#fffbeb" opacity="0.6"/>
  <rect x="50" y="107" width="660" height="50" fill="#f0fdf4" opacity="0.7"/>
  <rect x="50" y="157" width="660" height="40" fill="#fffbeb" opacity="0.6"/>
  <rect x="50" y="197" width="660" height="38" fill="#fef2f2" opacity="0.7"/>
  <!-- Axes -->
  <line x1="50" y1="235" x2="710" y2="235" stroke="#374151" stroke-width="1.5"/>
  <line x1="50" y1="235" x2="50" y2="35" stroke="#374151" stroke-width="1.5"/>
  <!-- Zone lines -->
  <line x1="50" y1="132" x2="710" y2="132" stroke="#0d9488" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="50" y1="107" x2="710" y2="107" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="50" y1="157" x2="710" y2="157" stroke="#16a34a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="50" y1="67" x2="710" y2="67" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="50" y1="197" x2="710" y2="197" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="50" y1="35" x2="710" y2="35" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="50" y1="235" x2="710" y2="235" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Labels right -->
  <text x="715" y="53" font-size="10" fill="#dc2626">STOP +3</text>
  <text x="715" y="91" font-size="10" fill="#d97706">ENTRY +2</text>
  <text x="715" y="136" font-size="10" fill="#0d9488">θ (mean)</text>
  <text x="715" y="181" font-size="10" fill="#d97706">ENTRY −2</text>
  <text x="715" y="220" font-size="10" fill="#dc2626">STOP −3</text>
  <!-- OU path -->
  <polyline points="50,132 75,125 100,112 125,95 145,82 165,72 180,82 200,100 220,118 240,130 260,132 280,135 300,130 320,120 340,108 360,98 375,90 390,100 410,115 428,130 448,138 468,150 488,160 508,168 522,178 538,185 552,193 565,182 580,170 595,155 610,140 625,132 645,130 665,130 685,132 700,132"
    fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <!-- Entry dots (orange) -->
  <circle cx="165" cy="72" r="5" fill="#d97706" stroke="white" stroke-width="1.5"/>
  <circle cx="360" cy="98" r="5" fill="#d97706" stroke="white" stroke-width="1.5"/>
  <circle cx="552" cy="193" r="5" fill="#d97706" stroke="white" stroke-width="1.5"/>
  <!-- Exit triangles (green) -->
  <polygon points="258,118 266,133 250,133" fill="#16a34a"/>
  <polygon points="626,118 634,133 618,133" fill="#16a34a"/>
  <!-- Caption -->
  <text x="380" y="262" text-anchor="middle" font-size="11" fill="#64748b">แดง●=entry (|z|&gt;2) · สามเหลี่ยมเขียว=exit (|z|&lt;0.5) · STOP ±3σ = หยุดทันที</text>
</svg>
