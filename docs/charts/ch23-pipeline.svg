<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs>
  <marker id="arwT" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0d9488"/>
  </marker>
</defs>
<rect x="2" y="2" width="756" height="266" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Pipeline: Kalman β_t + t-Distribution Signal (5 Steps)</text>

<!-- Step boxes: horizontal flow -->
<!-- Step 1 -->
<rect x="20" y="60" width="125" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="82" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">① Init</text>
<text x="82" y="98" text-anchor="middle" font-size="8.5" fill="#374151">OLS fit</text>
<text x="82" y="112" text-anchor="middle" font-size="8.5" fill="#374151">β₀, P₀</text>
<text x="82" y="126" text-anchor="middle" font-size="8.5" fill="#374151">Q, R tune</text>
<text x="82" y="140" text-anchor="middle" font-size="8.5" fill="#374151">ν MLE fit</text>
<text x="82" y="160" text-anchor="middle" font-size="7.5" fill="#6b7280">(training data)</text>

<!-- Arrow 1→2 -->
<line x1="145" y1="120" x2="160" y2="120" stroke="#0d9488" stroke-width="2" marker-end="url(#arwT)"/>

<!-- Step 2 -->
<rect x="160" y="60" width="125" height="120" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="222" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#0d9488">② Kalman</text>
<text x="222" y="98" text-anchor="middle" font-size="8.5" fill="#374151">Predict:</text>
<text x="222" y="112" text-anchor="middle" font-size="8.5" fill="#374151">P_prior = P+Q</text>
<text x="222" y="127" text-anchor="middle" font-size="8.5" fill="#374151">Update: K_t</text>
<text x="222" y="142" text-anchor="middle" font-size="8.5" fill="#374151">β_t, ε_t</text>
<text x="222" y="160" text-anchor="middle" font-size="7.5" fill="#6b7280">(every tick)</text>

<!-- Arrow 2→3 -->
<line x1="285" y1="120" x2="300" y2="120" stroke="#0d9488" stroke-width="2" marker-end="url(#arwT)"/>

<!-- Step 3 -->
<rect x="300" y="60" width="125" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="362" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">③ σ_t Estimate</text>
<text x="362" y="100" text-anchor="middle" font-size="8.5" fill="#374151">rolling std</text>
<text x="362" y="115" text-anchor="middle" font-size="8.5" fill="#374151">ε_t window</text>
<text x="362" y="130" text-anchor="middle" font-size="8.5" fill="#374151">(50–100 bars)</text>
<text x="362" y="148" text-anchor="middle" font-size="8.5" fill="#374151">z_t = ε_t / σ_t</text>
<text x="362" y="165" text-anchor="middle" font-size="7.5" fill="#6b7280">(rolling)</text>

<!-- Arrow 3→4 -->
<line x1="425" y1="120" x2="440" y2="120" stroke="#0d9488" stroke-width="2" marker-end="url(#arwT)"/>

<!-- Step 4 -->
<rect x="440" y="60" width="125" height="120" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="502" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#d97706">④ t-Threshold</text>
<text x="502" y="100" text-anchor="middle" font-size="8.5" fill="#374151">ν from MLE</text>
<text x="502" y="115" text-anchor="middle" font-size="8.5" fill="#374151">threshold =</text>
<text x="502" y="130" text-anchor="middle" font-size="8.5" fill="#374151">t_{α/2}(ν)</text>
<text x="502" y="147" text-anchor="middle" font-size="8.5" fill="#374151">e.g. 2.74 (ν=4)</text>
<text x="502" y="165" text-anchor="middle" font-size="7.5" fill="#6b7280">(not 1.96)</text>

<!-- Arrow 4→5 -->
<line x1="565" y1="120" x2="580" y2="120" stroke="#0d9488" stroke-width="2" marker-end="url(#arwT)"/>

<!-- Step 5 -->
<rect x="580" y="60" width="155" height="120" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<text x="657" y="82" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">⑤ Signal</text>
<text x="657" y="100" text-anchor="middle" font-size="8.5" fill="#374151">|z_t| ≥ thresh</text>
<text x="657" y="113" text-anchor="middle" font-size="8.5" fill="#374151">AND K_t &lt; 0.3</text>
<text x="657" y="128" text-anchor="middle" font-size="8.5" fill="#16a34a" font-weight="700">→ ENTRY</text>
<text x="657" y="143" text-anchor="middle" font-size="8.5" fill="#374151">|z_t| ≤ 0.5 → EXIT</text>
<text x="657" y="158" text-anchor="middle" font-size="8.5" fill="#dc2626">|z_t| ≥ 3× → STOP</text>

<!-- Output boxes below step 5 -->
<rect x="568" y="200" width="58" height="28" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="597" y="218" text-anchor="middle" font-size="9" font-weight="700" fill="#16a34a">LONG Y</text>
<rect x="632" y="200" width="58" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="661" y="218" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">SHORT Y</text>
<rect x="697" y="200" width="48" height="28" rx="5" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
<text x="721" y="218" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">STOP</text>
<line x1="657" y1="180" x2="657" y2="200" stroke="#374151" stroke-width="1.2" stroke-dasharray="3,2"/>

<!-- Bottom info bar -->
<rect x="20" y="243" width="730" height="18" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
<text x="385" y="256" text-anchor="middle" font-size="8.5" fill="#0369a1">Kalman ① แก้ dynamic β | σ_t ③ จับ volatility regime | t-distribution ④ ให้ threshold ที่สะท้อน fat tails จริง | guard K_t&lt;0.3 ป้องกัน trade ขณะ β กำลัง update</text>
</svg>
