<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="280" fill="#f9fafb"/>
  <text x="380" y="18" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Jump Detection ใน OU Path — ตรวจแยก Normal vs Jump</text>
  <rect x="30" y="25" width="700" height="215" fill="white" stroke="#e5e7eb"/>
  <line x1="55" y1="230" x2="710" y2="230" stroke="#374151" stroke-width="1.5"/>
  <line x1="55" y1="230" x2="55" y2="42" stroke="#374151" stroke-width="1.5"/>
  <line x1="55" y1="132" x2="710" y2="132" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="42" y="135" text-anchor="end" font-size="9" fill="#0d9488">θ</text>
  <!-- ±2σ and ±3σ bands -->
  <line x1="55" y1="92" x2="710" y2="92" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="55" y1="172" x2="710" y2="172" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="55" y1="62" x2="710" y2="62" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="55" y1="202" x2="710" y2="202" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- OU path (normal) - smooth -->
  <polyline points="55,132 80,128 105,120 130,112 155,118 180,128 205,134 228,130 252,122 275,115 298,108 320,100 340,108 362,120 385,130 408,135 432,130 455,124 478,118 500,125 522,132 545,136 568,132 590,128 612,125 635,130 660,132 685,132 710,130"
    fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <!-- Jump events (sudden vertical moves) -->
  <!-- Jump 1: upward at x=298 -->
  <line x1="298" y1="108" x2="298" y2="55" stroke="#dc2626" stroke-width="2"/>
  <circle cx="298" cy="55" r="6" fill="#dc2626"/>
  <text x="302" y="50" font-size="10" fill="#dc2626" font-weight="700">Jump +4.2σ</text>
  <polyline points="298,55 322,65 345,80 365,92 385,100 408,108 430,115 455,120"
    fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <!-- Jump 2: downward at x=590 -->
  <line x1="590" y1="128" x2="590" y2="195" stroke="#dc2626" stroke-width="2"/>
  <circle cx="590" cy="195" r="6" fill="#dc2626"/>
  <text x="594" y="215" font-size="10" fill="#dc2626" font-weight="700">Jump −3.8σ</text>
  <polyline points="590,195 610,188 630,180 650,170 670,160 690,152 710,148"
    fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <!-- Detection window shading -->
  <rect x="283" y="42" width="30" height="185" fill="#fef2f2" opacity="0.3"/>
  <rect x="575" y="42" width="30" height="185" fill="#fef2f2" opacity="0.3"/>
  <!-- Normal zone label -->
  <text x="175" y="55" font-size="10" fill="#16a34a">Normal OU diffusion</text>
  <!-- Legend -->
  <line x1="430" y1="45" x2="455" y2="45" stroke="#0d9488" stroke-width="2.5"/>
  <text x="460" y="49" font-size="11" fill="#0d9488">OU path (diffusion)</text>
  <circle cx="440" cy="62" r="5" fill="#dc2626"/>
  <text x="450" y="66" font-size="11" fill="#dc2626">Jump event (Poisson dN)</text>
  <text x="380" y="260" text-anchor="middle" font-size="11" fill="#64748b">Jump &gt; 3σ ใน 1 bar → ตรวจจับ → หยุด trade ชั่วคราว รอ λ ลดลง</text>
</svg>
