<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="220" fill="#f9fafb"/>
  <text x="380" y="22" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Beta Roadmap — เริ่มง่ายก่อน เพิ่มความซับซ้อนเมื่อจำเป็น</text>
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Step 1 -->
  <rect x="20" y="55" width="130" height="80" rx="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="85" y="82" text-anchor="middle" font-size="11" fill="#374151" font-weight="700">Step 1</text>
  <text x="85" y="99" text-anchor="middle" font-size="11" fill="#374151">β = 1.0</text>
  <text x="85" y="116" text-anchor="middle" font-size="10" fill="#64748b">Baseline</text>
  <text x="85" y="148" text-anchor="middle" font-size="10" fill="#64748b">เริ่มต้น</text>
  <line x1="150" y1="95" x2="175" y2="95" stroke="#374151" stroke-width="1.5" marker-end="url(#arr3)"/>
  <!-- Step 2 -->
  <rect x="177" y="55" width="140" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="247" y="82" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700">Step 2</text>
  <text x="247" y="99" text-anchor="middle" font-size="11" fill="#2563eb">OLS Static</text>
  <text x="247" y="116" text-anchor="middle" font-size="10" fill="#64748b">Fit once on</text>
  <text x="247" y="130" text-anchor="middle" font-size="10" fill="#64748b">full history</text>
  <text x="247" y="148" text-anchor="middle" font-size="10" fill="#64748b">Simple, fast</text>
  <line x1="317" y1="95" x2="342" y2="95" stroke="#374151" stroke-width="1.5" marker-end="url(#arr3)"/>
  <!-- Step 3 -->
  <rect x="344" y="55" width="150" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="419" y="82" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700">Step 3</text>
  <text x="419" y="99" text-anchor="middle" font-size="11" fill="#16a34a">Rolling OLS</text>
  <text x="419" y="116" text-anchor="middle" font-size="10" fill="#64748b">Re-fit every</text>
  <text x="419" y="130" text-anchor="middle" font-size="10" fill="#64748b">30d window</text>
  <text x="419" y="148" text-anchor="middle" font-size="10" fill="#64748b">Handles regime</text>
  <line x1="494" y1="95" x2="519" y2="95" stroke="#374151" stroke-width="1.5" marker-end="url(#arr3)"/>
  <!-- Step 4 -->
  <rect x="521" y="45" width="210" height="100" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
  <text x="626" y="72" text-anchor="middle" font-size="11" fill="#0d9488" font-weight="700">Step 4 (Advanced)</text>
  <text x="626" y="90" text-anchor="middle" font-size="11" fill="#0d9488">Kalman Filter</text>
  <text x="626" y="107" text-anchor="middle" font-size="10" fill="#64748b">β_t updates every bar</text>
  <text x="626" y="121" text-anchor="middle" font-size="10" fill="#64748b">Best accuracy, more complex</text>
  <text x="626" y="155" text-anchor="middle" font-size="10" fill="#d97706">⚠ overfitting risk if Q/R mis-tuned</text>
  <text x="380" y="200" text-anchor="middle" font-size="11" fill="#64748b">ใช้ step ต่ำสุดที่ผ่าน ADF + half-life — complexity เพิ่มความเสี่ยง overfitting</text>
</svg>
