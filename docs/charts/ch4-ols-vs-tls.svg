<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="300" fill="#f9fafb"/>
  <text x="380" y="22" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700">OLS vs TLS — Regression Methods</text>
  <!-- Left panel: OLS -->
  <rect x="30" y="35" width="320" height="230" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="190" y="55" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">OLS — Minimize Vertical Distance</text>
  <line x1="50" y1="245" x2="330" y2="245" stroke="#374151" stroke-width="1"/>
  <line x1="50" y1="245" x2="50" y2="65" stroke="#374151" stroke-width="1"/>
  <text x="190" y="258" text-anchor="middle" font-size="10" fill="#64748b">log(P_B)</text>
  <text x="36" y="160" text-anchor="middle" font-size="10" fill="#64748b" transform="rotate(-90,36,160)">log(P_A)</text>
  <!-- OLS regression line -->
  <line x1="60" y1="228" x2="310" y2="88" stroke="#2563eb" stroke-width="2"/>
  <!-- Data points -->
  <circle cx="80" cy="218" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="110" cy="200" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="145" cy="180" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="170" cy="162" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="200" cy="148" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="230" cy="132" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="260" cy="112" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="290" cy="100" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="155" cy="168" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="245" cy="120" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="125" cy="192" r="4" fill="#374151" opacity="0.7"/>
  <!-- Vertical residual lines (OLS minimizes these) -->
  <line x1="80" y1="218" x2="80" y2="224" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="200" y1="148" x2="200" y2="152" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="260" y1="112" x2="260" y2="118" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="190" y="278" text-anchor="middle" font-size="10" fill="#2563eb">β_OLS = Cov(rA,rB)/Var(rB)</text>
  <!-- Right panel: TLS -->
  <rect x="410" y="35" width="320" height="230" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="570" y="55" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="700">TLS — Minimize Perpendicular Distance</text>
  <line x1="430" y1="245" x2="710" y2="245" stroke="#374151" stroke-width="1"/>
  <line x1="430" y1="245" x2="430" y2="65" stroke="#374151" stroke-width="1"/>
  <text x="570" y="258" text-anchor="middle" font-size="10" fill="#64748b">log(P_B)</text>
  <!-- TLS regression line (slightly different slope) -->
  <line x1="440" y1="230" x2="690" y2="83" stroke="#16a34a" stroke-width="2"/>
  <!-- OLS line for comparison (dashed) -->
  <line x1="440" y1="228" x2="690" y2="88" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <!-- Data points same -->
  <circle cx="460" cy="218" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="490" cy="200" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="525" cy="180" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="550" cy="162" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="580" cy="148" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="610" cy="132" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="640" cy="112" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="670" cy="100" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="535" cy="168" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="625" cy="120" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="505" cy="192" r="4" fill="#374151" opacity="0.7"/>
  <!-- Perpendicular lines (TLS minimizes these) -->
  <line x1="460" y1="218" x2="452" y2="212" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="580" y1="148" x2="578" y2="143" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="570" y="278" text-anchor="middle" font-size="10" fill="#16a34a">β_TLS ≠ β_OLS เมื่อทั้งคู่ noisy</text>
  <!-- Legend bottom -->
  <line x1="320" y1="293" x2="345" y2="293" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="297" font-size="11" fill="#2563eb">OLS</text>
  <line x1="390" y1="293" x2="415" y2="293" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="297" font-size="11" fill="#16a34a">TLS</text>
  <line x1="455" y1="293" x2="480" y2="293" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="485" y="297" font-size="11" fill="#64748b">OLS (เทียบ)</text>
</svg>
