<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs>
  <marker id="arw" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#374151"/>
  </marker>
</defs>
<rect x="2" y="2" width="756" height="266" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Crypto Residuals vs Normal(0,1) — Fat Tails</text>

<!-- Axes -->
<line x1="60" y1="220" x2="710" y2="220" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>
<line x1="60" y1="220" x2="60" y2="40" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>
<text x="715" y="223" font-size="9" fill="#6b7280">z-score</text>
<text x="54" y="38" text-anchor="end" font-size="9" fill="#6b7280">freq</text>

<!-- X axis labels (z-scores from -5 to +5) -->
<line x1="60" y1="218" x2="60" y2="222" stroke="#94a3b8" stroke-width="1"/>
<text x="60" y="232" text-anchor="middle" font-size="8" fill="#6b7280">−5</text>
<line x1="125" y1="218" x2="125" y2="222" stroke="#94a3b8" stroke-width="1"/>
<text x="125" y="232" text-anchor="middle" font-size="8" fill="#6b7280">−4</text>
<line x1="190" y1="218" x2="190" y2="222" stroke="#94a3b8" stroke-width="1"/>
<text x="190" y="232" text-anchor="middle" font-size="8" fill="#6b7280">−3</text>
<line x1="255" y1="218" x2="255" y2="222" stroke="#94a3b8" stroke-width="1"/>
<text x="255" y="232" text-anchor="middle" font-size="8" fill="#6b7280">−2</text>
<line x1="320" y1="218" x2="320" y2="222" stroke="#94a3b8" stroke-width="1"/>
<text x="320" y="232" text-anchor="middle" font-size="8" fill="#6b7280">−1</text>
<line x1="385" y1="218" x2="385" y2="222" stroke="#94a3b8" stroke-width="1"/>
<text x="385" y="232" text-anchor="middle" font-size="8" fill="#6b7280">0</text>
<line x1="450" y1="218" x2="450" y2="222" stroke="#94a3b8" stroke-width="1"/>
<text x="450" y="232" text-anchor="middle" font-size="8" fill="#6b7280">+1</text>
<line x1="515" y1="218" x2="515" y2="222" stroke="#94a3b8" stroke-width="1"/>
<text x="515" y="232" text-anchor="middle" font-size="8" fill="#6b7280">+2</text>
<line x1="580" y1="218" x2="580" y2="222" stroke="#94a3b8" stroke-width="1"/>
<text x="580" y="232" text-anchor="middle" font-size="8" fill="#6b7280">+3</text>
<line x1="645" y1="218" x2="645" y2="222" stroke="#94a3b8" stroke-width="1"/>
<text x="645" y="232" text-anchor="middle" font-size="8" fill="#6b7280">+4</text>
<line x1="710" y1="218" x2="710" y2="222" stroke="#94a3b8" stroke-width="1"/>
<text x="710" y="232" text-anchor="middle" font-size="8" fill="#6b7280">+5</text>

<!-- Histogram bars: crypto residuals (fat tails — teal fill, red at extremes) -->
<!-- Center bars (within ±2σ) — slightly below Normal -->
<rect x="283" y="158" width="45" height="62" fill="#0d9488" opacity="0.5" rx="1"/>
<rect x="328" y="100" width="45" height="120" fill="#0d9488" opacity="0.5" rx="1"/>
<rect x="373" y="50" width="45" height="170" fill="#0d9488" opacity="0.6" rx="1"/>
<rect x="418" y="100" width="45" height="120" fill="#0d9488" opacity="0.5" rx="1"/>
<rect x="463" y="158" width="45" height="62" fill="#0d9488" opacity="0.5" rx="1"/>
<!-- ±2σ to ±3σ bars — slightly above Normal -->
<rect x="225" y="193" width="45" height="27" fill="#0d9488" opacity="0.5" rx="1"/>
<rect x="508" y="193" width="45" height="27" fill="#0d9488" opacity="0.5" rx="1"/>
<!-- Fat tail bars: ±3σ and beyond — red, much higher than Normal -->
<rect x="165" y="205" width="45" height="15" fill="#dc2626" opacity="0.7" rx="1"/>
<rect x="553" y="205" width="45" height="15" fill="#dc2626" opacity="0.7" rx="1"/>
<rect x="108" y="210" width="45" height="10" fill="#dc2626" opacity="0.7" rx="1"/>
<rect x="610" y="210" width="45" height="10" fill="#dc2626" opacity="0.7" rx="1"/>
<rect x="60" y="213" width="45" height="7" fill="#dc2626" opacity="0.7" rx="1"/>
<rect x="655" y="213" width="45" height="7" fill="#dc2626" opacity="0.7" rx="1"/>

<!-- Normal PDF curve (dashed blue) — approx bell shape -->
<polyline points="60,219 95,217 125,213 155,207 185,198 215,185 245,168 275,148 305,122 335,97 365,68 385,52 405,68 435,97 465,122 495,148 525,168 555,185 585,198 615,207 645,213 675,217 710,219"
          fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>

<!-- Fat tail annotations -->
<rect x="525" y="175" width="90" height="28" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="570" y="188" text-anchor="middle" font-size="8.5" fill="#dc2626" font-weight="700">5× เกิดบ่อยกว่า</text>
<text x="570" y="199" text-anchor="middle" font-size="8" fill="#dc2626">Normal ที่ ±4σ</text>
<line x1="601" y1="175" x2="650" y2="213" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>

<!-- Legend -->
<rect x="120" y="245" width="12" height="10" fill="#0d9488" opacity="0.6" rx="1"/>
<text x="136" y="254" font-size="9" fill="#374151">Crypto ε (fat tails)</text>
<rect x="270" y="245" width="12" height="10" fill="#dc2626" opacity="0.7" rx="1"/>
<text x="286" y="254" font-size="9" fill="#374151">Fat tail region (>±3σ)</text>
<line x1="420" y1="250" x2="445" y2="250" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
<text x="449" y="254" font-size="9" fill="#374151">Normal(0,1) PDF</text>
<text x="580" y="254" font-size="8.5" fill="#6b7280">Excess kurtosis ≈ 3–9</text>
</svg>
