<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Sarabun',sans-serif">
  <defs>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Grid Regime Detection — เมื่อไหร่เปิด/หยุด Grid</text>

  <!-- ===== UPPER SECTION: State Machine ===== -->

  <!-- Box 1: GRID ON -->
  <rect x="40" y="55" width="185" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="132" y="82" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">GRID ON</text>
  <text x="132" y="97" font-size="10" fill="#166534" text-anchor="middle">mean-reverting</text>
  <text x="58" y="114" font-size="9" fill="#166534">H &lt; 0.50 (Hurst)</text>
  <text x="58" y="127" font-size="9" fill="#166534">ADX &lt; 40 (BTC-calibrated)</text>
  <text x="58" y="140" font-size="9" fill="#166534">BB width ปกติ</text>
  <text x="132" y="162" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Full Deploy</text>

  <!-- Box 2: CAUTION -->
  <rect x="287" y="55" width="185" height="130" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="379" y="82" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">CAUTION</text>
  <text x="379" y="97" font-size="10" fill="#92400e" text-anchor="middle">borderline regime</text>
  <text x="305" y="114" font-size="9" fill="#92400e">H = 0.50–0.60</text>
  <text x="305" y="127" font-size="9" fill="#92400e">ADX = 40–50</text>
  <text x="305" y="140" font-size="9" fill="#92400e">Vol spike เริ่มขึ้น</text>
  <text x="379" y="162" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Reduce 50% size</text>

  <!-- Box 3: GRID OFF -->
  <rect x="534" y="55" width="185" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="626" y="82" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">GRID OFF</text>
  <text x="626" y="97" font-size="10" fill="#991b1b" text-anchor="middle">trending / breakout</text>
  <text x="552" y="114" font-size="9" fill="#991b1b">H &gt; 0.60</text>
  <text x="552" y="127" font-size="9" fill="#991b1b">ADX &gt; 50</text>
  <text x="552" y="140" font-size="9" fill="#991b1b">ราคาออกนอก Donchian</text>
  <text x="626" y="162" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Pause — Cancel all</text>

  <!-- Transition Arrows -->
  <!-- ON → CAUTION (right-pointing, amber) at y=115, label above -->
  <text x="238" y="110" font-size="9" fill="#d97706" text-anchor="middle">H rising</text>
  <line x1="228" y1="115" x2="283" y2="115" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- CAUTION → ON (left-pointing, green) at y=130, label below -->
  <line x1="284" y1="130" x2="229" y2="130" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="238" y="143" font-size="9" fill="#16a34a" text-anchor="middle">H drops</text>

  <!-- CAUTION → OFF (right-pointing, red) at y=115, label above -->
  <text x="484" y="110" font-size="9" fill="#dc2626" text-anchor="middle">ADX spike</text>
  <line x1="475" y1="115" x2="530" y2="115" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- OFF → CAUTION (left-pointing, amber) at y=130, label below -->
  <line x1="531" y1="130" x2="476" y2="130" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="484" y="143" font-size="9" fill="#d97706" text-anchor="middle">ADX drops</text>

  <!-- ===== LOWER SECTION: Hurst Timeline ===== -->
  <text x="380" y="240" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">ตัวอย่าง Hurst Exponent Rolling 30 วัน</text>

  <!-- Colored background bands -->
  <!-- Scale: H=0.40 → y=380, H=0.65 → y=255. range = 125px / 0.25H = 500px per unit H -->
  <!-- H=0.50 → y=380-(0.10*500)=380-50=330... wait: (H-0.40)/(0.65-0.40)*(385-255) + 255 -->
  <!-- y = 385 - (H-0.40)*500  but clip to [255,385] -->
  <!-- H=0.40 → y=385, H=0.50 → y=335... spec says 0.40=380, 0.50=343, 0.60=305, 0.65=255 -->
  <!-- Using spec y values: 0.40→380, 0.50→343, 0.60→305, 0.65→255 -->

  <!-- GRID ON band: x=75-230 -->
  <rect x="75" y="255" width="155" height="130" fill="#f0fdf4" opacity="0.5"/>
  <!-- CAUTION band: x=230-330 -->
  <rect x="230" y="255" width="100" height="130" fill="#fffbeb" opacity="0.7"/>
  <!-- GRID OFF band: x=330-445 -->
  <rect x="330" y="255" width="115" height="130" fill="#fef2f2" opacity="0.7"/>
  <!-- GRID ON band 2: x=445-700 -->
  <rect x="445" y="255" width="255" height="130" fill="#f0fdf4" opacity="0.5"/>

  <!-- Chart border -->
  <rect x="75" y="255" width="625" height="130" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Band labels at y=268 -->
  <text x="152" y="268" font-size="8" fill="#15803d" text-anchor="middle">GRID ON</text>
  <text x="280" y="268" font-size="8" fill="#b45309" text-anchor="middle">CAUTION</text>
  <text x="387" y="268" font-size="8" fill="#991b1b" text-anchor="middle">GRID OFF</text>
  <text x="572" y="268" font-size="8" fill="#15803d" text-anchor="middle">GRID ON</text>

  <!-- Y-axis labels (spec positions) -->
  <text x="65" y="383" font-size="9" fill="#475569" text-anchor="end">0.40</text>
  <text x="65" y="346" font-size="9" fill="#475569" text-anchor="end">0.50</text>
  <text x="65" y="308" font-size="9" fill="#475569" text-anchor="end">0.60</text>
  <text x="65" y="258" font-size="9" fill="#475569" text-anchor="end">0.65</text>

  <!-- Y-axis tick lines -->
  <line x1="72" y1="380" x2="75" y2="380" stroke="#94a3b8" stroke-width="1"/>
  <line x1="72" y1="343" x2="75" y2="343" stroke="#94a3b8" stroke-width="1"/>
  <line x1="72" y1="305" x2="75" y2="305" stroke="#94a3b8" stroke-width="1"/>
  <line x1="72" y1="255" x2="75" y2="255" stroke="#94a3b8" stroke-width="1"/>

  <!-- Threshold lines -->
  <!-- H=0.60 at y=305 -->
  <line x1="75" y1="305" x2="685" y2="305" stroke="#dc2626" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="690" y="301" font-size="8" fill="#dc2626">H=0.60</text>

  <!-- H=0.50 at y=343 -->
  <line x1="75" y1="343" x2="685" y2="343" stroke="#d97706" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="690" y="339" font-size="8" fill="#d97706">H=0.50</text>

  <!-- Hurst line: blue polyline -->
  <!-- GRID ON zone (x=75–230): H ~0.43–0.48, y ~355–368 -->
  <!-- CAUTION zone (x=230–330): H rising 0.50–0.59, y ~307–343 -->
  <!-- GRID OFF zone (x=330–445): H ~0.61–0.63, y ~275–300 -->
  <!-- GRID ON again (x=445–700): H drops back ~0.47–0.45, y ~343–362 -->
  <polyline
    points="75,368 100,362 130,357 160,352 190,348 215,345 230,343 250,335 270,323 295,312 315,306 330,305 350,296 370,288 390,283 410,288 430,297 445,305 465,325 490,338 515,346 545,349 580,345 615,342 650,344 680,347 700,348"
    fill="none" stroke="#1e40af" stroke-width="2" stroke-linejoin="round"/>

  <!-- Caption -->
  <text x="380" y="430" font-size="10" fill="#94a3b8" text-anchor="middle">H &lt; 0.50 = grid เต็ม · 0.50–0.60 = ลด size · H &gt; 0.60 = หยุด grid (BTC-calibrated)</text>
</svg>
