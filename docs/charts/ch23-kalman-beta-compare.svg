<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs>
  <marker id="arw" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#374151"/>
  </marker>
</defs>
<rect x="2" y="2" width="756" height="276" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Static OLS vs Rolling Window vs Kalman β_t — BTC/ETH</text>

<!-- Axes -->
<line x1="55" y1="230" x2="720" y2="230" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>
<line x1="55" y1="230" x2="55" y2="40" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>
<text x="725" y="233" font-size="9" fill="#6b7280">t (hours)</text>
<text x="49" y="38" text-anchor="end" font-size="9" fill="#6b7280">β</text>

<!-- Y axis ticks -->
<line x1="52" y1="180" x2="58" y2="180" stroke="#94a3b8" stroke-width="1"/>
<text x="50" y="183" text-anchor="end" font-size="8" fill="#6b7280">1.0</text>
<line x1="52" y1="140" x2="58" y2="140" stroke="#94a3b8" stroke-width="1"/>
<text x="50" y="143" text-anchor="end" font-size="8" fill="#6b7280">1.1</text>
<line x1="52" y1="100" x2="58" y2="100" stroke="#94a3b8" stroke-width="1"/>
<text x="50" y="103" text-anchor="end" font-size="8" fill="#6b7280">1.2</text>
<line x1="52" y1="60" x2="58" y2="60" stroke="#94a3b8" stroke-width="1"/>
<text x="50" y="63" text-anchor="end" font-size="8" fill="#6b7280">1.3</text>

<!-- X axis labels -->
<text x="55" y="243" text-anchor="middle" font-size="8" fill="#6b7280">0</text>
<text x="185" y="243" text-anchor="middle" font-size="8" fill="#6b7280">50</text>
<text x="315" y="243" text-anchor="middle" font-size="8" fill="#6b7280">100</text>
<text x="445" y="243" text-anchor="middle" font-size="8" fill="#6b7280">150</text>
<text x="575" y="243" text-anchor="middle" font-size="8" fill="#6b7280">200</text>
<text x="710" y="243" text-anchor="middle" font-size="8" fill="#6b7280">250</text>

<!-- Regime change marker -->
<line x1="315" y1="42" x2="315" y2="230" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<text x="317" y="54" font-size="8" fill="#dc2626">altcoin season</text>

<!-- Static OLS β (flat line at 1.10) — blue -->
<line x1="55" y1="140" x2="710" y2="140" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>

<!-- Rolling Window β (delayed response) — amber -->
<polyline points="55,140 100,140 130,138 160,137 185,140 200,140 230,140 260,140 290,140 310,138 330,120 345,100 360,88 375,80 390,82 405,85 420,95 435,108 455,120 470,130 490,138 510,140 530,140 545,140 560,140 580,140 600,140 630,140 660,140 690,140 710,140"
      fill="none" stroke="#d97706" stroke-width="2.2"/>

<!-- Kalman β (smooth, responsive) — green -->
<polyline points="55,140 75,139 95,137 115,136 135,138 155,140 175,139 195,140 215,140 240,138 265,130 285,118 305,100 315,88 325,78 335,72 345,70 355,72 365,78 375,86 390,94 405,106 420,116 435,125 450,132 465,137 480,139 500,140 520,140 540,139 560,140 580,139 600,140 620,140 640,140 660,140 685,140 710,140"
      fill="none" stroke="#16a34a" stroke-width="2.5"/>

<!-- Legend -->
<line x1="420" y1="255" x2="445" y2="255" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
<text x="449" y="259" font-size="9" fill="#374151">Static OLS (lag สูง)</text>
<line x1="540" y1="255" x2="565" y2="255" stroke="#d97706" stroke-width="2.2"/>
<text x="569" y="259" font-size="9" fill="#374151">Rolling (delayed)</text>
<line x1="635" y1="255" x2="660" y2="255" stroke="#16a34a" stroke-width="2.5"/>
<text x="664" y="259" font-size="9" fill="#374151">Kalman (responsive)</text>

<!-- Annotation: lag arrow -->
<text x="375" y="90" text-anchor="middle" font-size="8" fill="#d97706">↑ lag ~30h</text>
<text x="330" y="65" text-anchor="middle" font-size="8" fill="#16a34a">↑ Kalman cues faster</text>

<text x="65" y="258" font-size="9" fill="#6b7280">β แกน y: scale log-return (BTC return / ETH return)</text>
</svg>
