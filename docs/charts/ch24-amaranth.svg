<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs>
  <marker id="arw" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#374151"/>
  </marker>
</defs>
<rect x="2" y="2" width="756" height="296" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Amaranth 2006 — Nat Gas Price &amp; Fund NAV Collapse</text>

<!-- TOP PANEL: Natural Gas Price -->
<rect x="12" y="28" width="735" height="120" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
<text x="50" y="44" font-size="10" font-weight="700" fill="#374151">Nat Gas Price ($/MMBtu)</text>

<!-- Top axes -->
<line x1="60" y1="130" x2="735" y2="130" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>
<line x1="60" y1="130" x2="60" y2="40" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>

<!-- Y labels top -->
<text x="58" y="128" text-anchor="end" font-size="7.5" fill="#6b7280">$2</text>
<text x="58" y="108" text-anchor="end" font-size="7.5" fill="#6b7280">$4</text>
<text x="58" y="88" text-anchor="end" font-size="7.5" fill="#6b7280">$6</text>
<text x="58" y="68" text-anchor="end" font-size="7.5" fill="#6b7280">$8</text>
<text x="58" y="48" text-anchor="end" font-size="7.5" fill="#6b7280">$12</text>

<!-- X labels top (2004 to 2007) -->
<text x="80" y="142" text-anchor="middle" font-size="7.5" fill="#6b7280">Jan'04</text>
<text x="196" y="142" text-anchor="middle" font-size="7.5" fill="#6b7280">Jan'05</text>
<text x="312" y="142" text-anchor="middle" font-size="7.5" fill="#6b7280">Jan'06</text>
<text x="428" y="142" text-anchor="middle" font-size="7.5" fill="#6b7280">Jun'06</text>
<text x="544" y="142" text-anchor="middle" font-size="7.5" fill="#6b7280">Jan'07</text>
<text x="660" y="142" text-anchor="middle" font-size="7.5" fill="#6b7280">Jul'07</text>

<!-- Nat gas price curve: starts ~$6 in 2004, Hurricane Katrina spike to ~$15 Sep 2005, then crashes to ~$4 in 2006 -->
<!-- Scale: $2=128, $4=108, $6=88, $8=68, $12=48, $15=37 approx. y = 128 - (price-2)*10 -->
<polyline points="80,88 100,85 120,82 140,85 160,82 180,78 196,82 215,85 240,83 260,80 280,77 295,72 305,65 312,60 320,52 330,44 337,42 340,45 350,55 365,65 380,75 395,83 410,90 428,100 445,105 460,108 480,110 500,108 520,108 544,110 560,112 580,108 600,110 620,112 640,110 660,112 700,114 735,115"
          fill="none" stroke="#2563eb" stroke-width="2"/>

<!-- Hurricane Katrina spike annotation -->
<line x1="330" y1="32" x2="330" y2="130" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
<text x="333" y="44" font-size="7.5" fill="#dc2626">Hurricane</text>
<text x="333" y="53" font-size="7.5" fill="#dc2626">Katrina</text>
<text x="333" y="62" font-size="7.5" fill="#dc2626">Sep 2005</text>

<!-- Amaranth blow-up marker -->
<line x1="450" y1="32" x2="450" y2="130" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
<text x="453" y="44" font-size="7.5" fill="#dc2626" font-weight="700">Amaranth</text>
<text x="453" y="54" font-size="7.5" fill="#dc2626" font-weight="700">Sep 2006</text>

<!-- Fill area above $4 for context -->
<polygon points="80,88 100,85 120,82 140,85 160,82 180,78 196,82 215,85 240,83 260,80 280,77 295,72 305,65 312,60 320,52 330,44 337,42 340,45 350,55 365,65 380,75 395,83 410,90 428,100 445,105 460,108 480,110 500,108 520,108 544,110 560,112 580,108 600,110 620,112 640,110 660,112 700,114 735,115 735,108 660,108 428,108 80,108" fill="#2563eb" opacity="0.08"/>

<!-- BOTTOM PANEL: Amaranth Fund NAV -->
<rect x="12" y="160" width="735" height="128" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
<text x="50" y="176" font-size="10" font-weight="700" fill="#374151">Amaranth Fund NAV ($B)</text>

<!-- Bottom axes -->
<line x1="60" y1="272" x2="735" y2="272" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>
<line x1="60" y1="272" x2="60" y2="172" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>

<!-- Y labels bottom ($0 to $12B) -->
<text x="58" y="271" text-anchor="end" font-size="7.5" fill="#6b7280">$0B</text>
<text x="58" y="247" text-anchor="end" font-size="7.5" fill="#6b7280">$3B</text>
<text x="58" y="223" text-anchor="end" font-size="7.5" fill="#6b7280">$6B</text>
<text x="58" y="199" text-anchor="end" font-size="7.5" fill="#6b7280">$9B</text>
<text x="58" y="178" text-anchor="end" font-size="7.5" fill="#6b7280">$12B</text>

<!-- X labels bottom (same range) -->
<text x="80" y="284" text-anchor="middle" font-size="7.5" fill="#6b7280">Jan'04</text>
<text x="196" y="284" text-anchor="middle" font-size="7.5" fill="#6b7280">Jan'05</text>
<text x="312" y="284" text-anchor="middle" font-size="7.5" fill="#6b7280">Jan'06</text>
<text x="428" y="284" text-anchor="middle" font-size="7.5" fill="#6b7280">Jun'06</text>
<text x="544" y="284" text-anchor="middle" font-size="7.5" fill="#6b7280">Jan'07</text>

<!-- NAV curve: starts ~$5B 2004, rises to ~$9.7B 2006, spikes to ~$10.5B after Katrina, collapses to ~$3.1B in Sep 2006 -->
<!-- y scale: $0=271, $12=178; (12-0)/(271-178) = 12/93 per px → y = 271 - value*(93/12) = 271 - value*7.75 -->
<!-- $5B y=232; $7B y=217; $9.7B y=196; $10.5B y=190; $3.1B y=247 -->
<polyline points="80,235 100,231 120,228 140,226 160,223 196,220 215,218 240,217 260,216 280,215 295,215 310,213 320,211 330,209 337,207 340,204 350,198 365,196 380,195 395,196 410,197 420,196 428,196"
          fill="none" stroke="#16a34a" stroke-width="2.2"/>

<!-- Catastrophic collapse -->
<polyline points="428,196 438,210 448,228 458,245 465,255 470,258 480,261 490,264 500,265 510,265 520,265"
          fill="none" stroke="#dc2626" stroke-width="3"/>

<!-- Closed annotation -->
<text x="525" y="263" font-size="8" fill="#dc2626" font-weight="700">Fund closed</text>
<text x="525" y="273" font-size="8" fill="#dc2626">Oct 2006</text>

<!-- Red fill for collapse -->
<polygon points="428,196 438,210 448,228 458,245 465,255 470,258 480,261 490,264 500,265 510,265 520,265 520,272 428,272" fill="#dc2626" opacity="0.1"/>

<!-- Annotations -->
<text x="370" y="188" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="700">Peak $9.7B</text>
<text x="370" y="197" text-anchor="middle" font-size="8" fill="#16a34a">(2006)</text>
<text x="455" y="180" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="700">−$6.6B</text>
<text x="455" y="190" text-anchor="middle" font-size="8" fill="#dc2626">in 1 week</text>
<text x="455" y="200" text-anchor="middle" font-size="8" fill="#dc2626">= −68% AUM</text>
<line x1="455" y1="205" x2="455" y2="230" stroke="#dc2626" stroke-width="1"/>

<!-- Amaranth blow-up marker (bottom panel) -->
<line x1="450" y1="172" x2="450" y2="272" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
</svg>
