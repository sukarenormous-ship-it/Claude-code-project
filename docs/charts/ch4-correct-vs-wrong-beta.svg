<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="280" fill="#f9fafb"/>
  <text x="380" y="20" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">β ถูกต้อง vs β ผิด — ผลต่อ ε</text>
  <!-- Left: correct beta -->
  <rect x="20" y="30" width="340" height="210" fill="white" stroke="#e5e7eb"/>
  <text x="190" y="50" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="700">✓ β ถูกต้อง — ε Mean-Revert</text>
  <line x1="40" y1="235" x2="340" y2="235" stroke="#374151" stroke-width="1"/>
  <line x1="40" y1="235" x2="40" y2="65" stroke="#374151" stroke-width="1"/>
  <line x1="40" y1="148" x2="340" y2="148" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="40" y1="108" x2="340" y2="108" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="40" y1="188" x2="340" y2="188" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <polyline points="40,148 65,138 90,120 115,105 140,112 165,130 190,148 215,162 240,168 265,160 290,148 315,138 340,143"
    fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="190" y="260" text-anchor="middle" font-size="11" fill="#16a34a">ε วนรอบ θ — trade ได้</text>
  <!-- Right: wrong beta -->
  <rect x="400" y="30" width="340" height="210" fill="white" stroke="#fca5a5"/>
  <text x="570" y="50" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="700">✗ β ผิด — ε Drift ตาม BTC</text>
  <line x1="420" y1="235" x2="720" y2="235" stroke="#374151" stroke-width="1"/>
  <line x1="420" y1="235" x2="420" y2="65" stroke="#374151" stroke-width="1"/>
  <line x1="420" y1="148" x2="720" y2="148" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4"/>
  <!-- Drifting epsilon -->
  <polyline points="420,160 445,155 470,148 495,138 520,125 545,112 570,98 595,88 620,78 645,72 670,68 695,65 720,62"
    fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="570" y="260" text-anchor="middle" font-size="11" fill="#dc2626">ε drift — model เพิ่ม position ขาดทุน</text>
  <!-- Arrow showing trend -->
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <line x1="500" y1="130" x2="680" y2="72" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr2)" opacity="0.6"/>
  <text x="600" y="115" font-size="10" fill="#dc2626">drift ตาม BTC</text>
  <text x="380" y="275" text-anchor="middle" font-size="11" fill="#64748b">ε drift = signal ชัดที่สุดว่า β ผิด → re-calibrate ทันที</text>
</svg>
