<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="680" height="260" fill="#f9fafb"/>
  <text x="340" y="22" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">VECM — Error Correction: ใครปรับตัว?</text>
  <rect x="20" y="35" width="640" height="185" fill="white" stroke="#e5e7eb"/>
  <!-- Two time series + spread -->
  <line x1="50" y1="215" x2="640" y2="215" stroke="#374151" stroke-width="1"/>
  <line x1="50" y1="215" x2="50" y2="55" stroke="#374151" stroke-width="1"/>
  <text x="345" y="232" text-anchor="middle" font-size="10" fill="#64748b">Time</text>
  <!-- Series A (slow adjuster) -->
  <polyline points="50,160 90,155 130,148 170,140 180,130 190,118 210,108 230,105 270,100 310,95 350,95 390,98 430,105 470,110 510,115 550,120 590,122 630,124"
    fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="635" y="115" font-size="10" fill="#2563eb">A</text>
  <!-- Series B (fast adjuster) -->
  <polyline points="50,170 90,165 130,160 170,155 185,148 195,135 210,118 235,108 270,105 310,100 350,100 390,102 430,108 470,115 510,118 550,122 590,124 630,126"
    fill="none" stroke="#0d9488" stroke-width="2"/>
  <text x="635" y="141" font-size="10" fill="#0d9488">B</text>
  <!-- Divergence zone -->
  <rect x="170" y="90" width="80" height="70" fill="#fef2f2" opacity="0.4"/>
  <line x1="175" y1="85" x2="175" y2="215" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="255" y1="85" x2="255" y2="215" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="212" y="80" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">Divergence</text>
  <!-- Arrow showing B adjusts faster -->
  <line x1="215" y1="108" x2="215" y2="125" stroke="#0d9488" stroke-width="1.5"/>
  <text x="232" y="120" font-size="10" fill="#0d9488">B adjusts ↓</text>
  <!-- Legend -->
  <line x1="380" y1="65" x2="410" y2="65" stroke="#2563eb" stroke-width="2"/>
  <text x="415" y="69" font-size="11" fill="#2563eb">Asset A — α_A ต่ำ (ปรับช้า)</text>
  <line x1="380" y1="85" x2="410" y2="85" stroke="#0d9488" stroke-width="2"/>
  <text x="415" y="89" font-size="11" fill="#0d9488">Asset B — α_B สูง (ปรับเร็ว)</text>
  <text x="340" y="250" text-anchor="middle" font-size="11" fill="#64748b">VECM ค้นหาว่า A หรือ B ปรับตัวกลับ equilibrium — ช่วยเลือก hedge direction</text>
</svg>
