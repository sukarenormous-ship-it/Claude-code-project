<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs>
  <marker id="arw" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#374151"/>
  </marker>
</defs>
<rect x="2" y="2" width="756" height="266" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">PDF: Normal(0,1) vs t(ν=10) vs t(ν=4) — Fat Tails</text>

<!-- Axes -->
<line x1="60" y1="210" x2="710" y2="210" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>
<line x1="60" y1="210" x2="60" y2="38" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>
<text x="715" y="213" font-size="9" fill="#6b7280">t</text>
<text x="54" y="36" text-anchor="end" font-size="9" fill="#6b7280">f(t)</text>

<!-- X axis labels (-4 to +4) -->
<text x="60" y="222" text-anchor="middle" font-size="8" fill="#6b7280">−4</text>
<text x="141" y="222" text-anchor="middle" font-size="8" fill="#6b7280">−3</text>
<text x="222" y="222" text-anchor="middle" font-size="8" fill="#6b7280">−2</text>
<text x="303" y="222" text-anchor="middle" font-size="8" fill="#6b7280">−1</text>
<text x="385" y="222" text-anchor="middle" font-size="8" fill="#6b7280">0</text>
<text x="466" y="222" text-anchor="middle" font-size="8" fill="#6b7280">+1</text>
<text x="547" y="222" text-anchor="middle" font-size="8" fill="#6b7280">+2</text>
<text x="628" y="222" text-anchor="middle" font-size="8" fill="#6b7280">+3</text>
<text x="710" y="222" text-anchor="middle" font-size="8" fill="#6b7280">+4</text>

<!-- Grid lines -->
<line x1="222" y1="42" x2="222" y2="210" stroke="#e5e7eb" stroke-width="0.8" stroke-dasharray="3,3"/>
<line x1="547" y1="42" x2="547" y2="210" stroke="#e5e7eb" stroke-width="0.8" stroke-dasharray="3,3"/>
<line x1="385" y1="42" x2="385" y2="210" stroke="#e5e7eb" stroke-width="0.8"/>

<!-- Normal(0,1) PDF — blue dashed (tallest peak, thinnest tails) -->
<polyline points="60,209 100,208 141,206 160,204 180,200 200,194 222,185 240,173 260,157 280,137 300,112 320,85 340,61 360,46 370,42 385,40 400,42 415,46 435,61 455,85 475,112 495,137 515,157 535,173 555,185 575,194 595,200 615,204 628,206 660,208 710,209"
          fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8,4"/>

<!-- t(ν=10) PDF — amber (slightly thicker tails) -->
<polyline points="60,209 100,208 141,205 160,202 180,198 200,191 222,181 240,167 260,150 280,129 300,104 320,78 340,57 360,44 370,40 385,38 400,40 415,44 435,57 455,78 475,104 495,129 515,150 535,167 555,181 575,191 595,198 615,202 628,205 660,208 710,209"
          fill="none" stroke="#d97706" stroke-width="2.2"/>

<!-- t(ν=4) PDF — red (fattest tails, lower peak) -->
<!-- Lower peak, higher tails -->
<polyline points="60,207 100,205 141,200 160,196 180,189 200,179 222,165 240,147 260,126 280,104 300,81 320,61 340,48 360,42 370,40 385,38 400,40 415,42 435,48 455,61 475,81 495,104 515,126 535,147 555,165 575,179 595,189 615,196 628,200 660,205 710,207"
          fill="none" stroke="#dc2626" stroke-width="2.5"/>

<!-- Fill tails for t(ν=4) beyond ±1.96 to show excess -->
<path d="M 547 185 L 560 179 L 575 179 L 595 189 L 615 196 L 628 200 L 660 205 L 710 207 L 710 210 L 547 210 Z" fill="#dc2626" opacity="0.12"/>
<path d="M 60 207 L 100 205 L 141 200 L 160 196 L 175 189 L 195 181 L 222 165 L 222 210 L 60 210 Z" fill="#dc2626" opacity="0.12"/>

<!-- Threshold lines: Normal 1.96 vs t(ν=4) 2.78 -->
<line x1="547" y1="42" x2="547" y2="210" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7"/>
<line x1="222" y1="42" x2="222" y2="210" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7"/>
<text x="550" y="52" font-size="8" fill="#2563eb">z=1.96 (Normal)</text>

<line x1="628" y1="42" x2="628" y2="210" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7"/>
<line x1="141" y1="42" x2="141" y2="210" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7"/>
<text x="632" y="52" font-size="8" fill="#dc2626">t=2.78 (ν=4)</text>

<!-- Annotations -->
<rect x="330" y="125" width="115" height="35" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
<text x="388" y="140" text-anchor="middle" font-size="8.5" fill="#dc2626" font-weight="700">t(ν=4): more area</text>
<text x="388" y="153" text-anchor="middle" font-size="8.5" fill="#dc2626">beyond ±1.96 → 2×</text>

<!-- Legend -->
<line x1="70" y1="240" x2="95" y2="240" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8,4"/>
<text x="99" y="244" font-size="9" fill="#374151">Normal(0,1)</text>
<line x1="195" y1="240" x2="220" y2="240" stroke="#d97706" stroke-width="2.2"/>
<text x="224" y="244" font-size="9" fill="#374151">t(ν=10) ใกล้ Normal</text>
<line x1="360" y1="240" x2="385" y2="240" stroke="#dc2626" stroke-width="2.5"/>
<text x="389" y="244" font-size="9" fill="#374151">t(ν=4) fat tails — crypto</text>
<rect x="550" y="235" width="12" height="10" fill="#dc2626" opacity="0.2" rx="1"/>
<text x="566" y="244" font-size="9" fill="#374151">excess tail area (ν=4)</text>
</svg>
