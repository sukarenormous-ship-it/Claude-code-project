<svg viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="680" height="270" fill="#f9fafb"/>
  <text x="340" y="22" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Distribution Z-scores (OU simulated) vs Normal(0,1)</text>
  <rect x="30" y="35" width="620" height="185" fill="white" stroke="#e5e7eb"/>
  <line x1="55" y1="210" x2="630" y2="210" stroke="#374151" stroke-width="1.5"/>
  <line x1="55" y1="210" x2="55" y2="52" stroke="#374151" stroke-width="1.5"/>
  <text x="340" y="228" text-anchor="middle" font-size="10" fill="#64748b">Z-score</text>
  <text x="55" y="225" text-anchor="middle" font-size="9" fill="#64748b">−4</text>
  <text x="152" y="225" text-anchor="middle" font-size="9" fill="#64748b">−3</text>
  <text x="249" y="225" text-anchor="middle" font-size="9" fill="#64748b">−2</text>
  <text x="346" y="225" text-anchor="middle" font-size="9" fill="#64748b">0</text>
  <text x="443" y="225" text-anchor="middle" font-size="9" fill="#64748b">+2</text>
  <text x="540" y="225" text-anchor="middle" font-size="9" fill="#64748b">+3</text>
  <text x="625" y="225" text-anchor="middle" font-size="9" fill="#64748b">+4</text>
  <!-- Vertical dashed lines at ±2 -->
  <line x1="249" y1="52" x2="249" y2="210" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="443" y1="52" x2="443" y2="210" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="249" y="48" text-anchor="middle" font-size="10" fill="#d97706">−2σ</text>
  <text x="443" y="48" text-anchor="middle" font-size="10" fill="#d97706">+2σ</text>
  <!-- Histogram bars (teal) - OU simulated, slightly fat-tailed -->
  <!-- bins at -4,-3,-2,-1,0,1,2,3,4 with counts -->
  <rect x="62" y="198" width="80" height="12" fill="#0d9488" opacity="0.7"/>
  <rect x="152" y="185" width="80" height="25" fill="#0d9488" opacity="0.7"/>
  <rect x="249" y="148" width="87" height="62" fill="#dc2626" opacity="0.7"/>
  <rect x="262" y="148" width="74" height="62" fill="#dc2626" opacity="0.7"/>
  <rect x="300" y="72" width="40" height="138" fill="#0d9488" opacity="0.7"/>
  <rect x="340" y="65" width="40" height="145" fill="#0d9488" opacity="0.7"/>
  <rect x="380" y="72" width="40" height="138" fill="#0d9488" opacity="0.7"/>
  <rect x="443" y="148" width="80" height="62" fill="#dc2626" opacity="0.7"/>
  <rect x="540" y="187" width="80" height="23" fill="#0d9488" opacity="0.7"/>
  <rect x="550" y="198" width="70" height="12" fill="#0d9488" opacity="0.7"/>
  <!-- Normal(0,1) curve overlay (navy) -->
  <polyline points="55,208 90,205 130,198 175,182 220,160 249,142 280,100 310,72 340,62 370,72 400,100 430,142 460,160 510,182 555,198 600,205 630,208"
    fill="none" stroke="#1e3a5f" stroke-width="2.5"/>
  <!-- Red tail areas annotations -->
  <text x="105" y="175" text-anchor="middle" font-size="10" fill="#dc2626">fat tail</text>
  <text x="580" y="175" text-anchor="middle" font-size="10" fill="#dc2626">fat tail</text>
  <!-- Legend -->
  <rect x="430" y="62" width="14" height="12" fill="#0d9488" opacity="0.7"/>
  <text x="448" y="73" font-size="11" fill="#0d9488">OU simulated z-scores</text>
  <line x1="430" y1="90" x2="444" y2="90" stroke="#1e3a5f" stroke-width="2.5"/>
  <text x="448" y="94" font-size="11" fill="#1e3a5f">Normal(0,1) PDF</text>
  <text x="340" y="252" text-anchor="middle" font-size="11" fill="#64748b">P(|z|&gt;2) ≈ 4.6% ตาม Normal แต่ใน crypto spread จริง &gt;7% (fat tail)</text>
</svg>
