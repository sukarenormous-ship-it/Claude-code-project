<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payoff Chart - บทเรียน Interactive</title>
  <meta name="description" content="บทเรียนเรื่อง Payoff Chart สำหรับ Options ตั้งแต่พื้นฐานจนถึงขั้นสูง แบบ Interactive">

  <!-- Google Fonts: Sarabun (Thai-friendly) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <!-- Chart.js Annotation Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
</head>
<body>

  <div id="app">
    <!-- Mobile hamburger button -->
    <button id="hamburger" aria-label="เปิดเมนู">&#9776;</button>

    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <nav id="sidebar">
      <div id="sidebar-header">
        <h1>Payoff Chart</h1>
        <p>บทเรียน Interactive</p>
      </div>
      <div id="progress-bar-container">
        <div class="progress-text" id="progress-text">0 / 0 บทเรียน</div>
        <div id="progress-bar">
          <div class="fill" id="progress-fill" style="width: 0%"></div>
        </div>
      </div>
      <ul id="nav-list">
        <!-- Built dynamically by app.js -->
      </ul>
    </nav>

    <!-- Main Content Area -->
    <div id="main">
      <div id="content">
        <!-- Rendered dynamically by app.js -->
        <div style="display:flex;align-items:center;justify-content:center;min-height:60vh;color:#94a3b8;">
          <p>กำลังโหลดบทเรียน...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- App Scripts (order matters: dependencies first) -->
  <script src="js/payoff.js"></script>
  <script src="js/greeks.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
