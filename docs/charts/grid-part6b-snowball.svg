<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">
<rect width="760" height="440" fill="#f8fafc" rx="6"/>
<text x="380" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Grid Snowball 3 แบบ + Grid → DCA Stack</text>

<!-- Panel 1: Simple Compound -->
<rect x="30" y="45" width="215" height="170" fill="#ecfeff" rx="8" stroke="#06b6d4" stroke-width="1.5"/>
<text x="137" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7490">Type 1: Simple Compound</text>
<text x="137" y="80" text-anchor="middle" font-size="9" fill="#64748b">กำไรกลับเข้า capital</text>

<!-- Growing bars -->
<rect x="50" y="170" width="20" height="30" fill="#06b6d4" rx="2"/>
<rect x="80" y="158" width="20" height="42" fill="#06b6d4" rx="2"/>
<rect x="110" y="143" width="20" height="57" fill="#06b6d4" rx="2"/>
<rect x="140" y="124" width="20" height="76" fill="#06b6d4" rx="2"/>
<rect x="170" y="101" width="20" height="99" fill="#06b6d4" rx="2"/>
<rect x="200" y="74" width="20" height="126" fill="#06b6d4" rx="2"/>

<!-- Base line -->
<line x1="45" y1="200" x2="230" y2="200" stroke="#94a3b8" stroke-width="1"/>

<text x="137" y="218" text-anchor="middle" font-size="9" fill="#0891b2">กำไร → deploy เพิ่ม capital → รอบเพิ่ม</text>

<!-- Panel 2: Profit-Triggered Layer -->
<rect x="272" y="45" width="215" height="170" fill="#eff6ff" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Type 2: Profit-Triggered</text>
<text x="380" y="80" text-anchor="middle" font-size="9" fill="#64748b">กำไรทริกเปิด grid layer ใหม่</text>

<!-- Layer illustration -->
<rect x="290" y="145" width="180" height="30" fill="#dbeafe" rx="4" stroke="#93c5fd" stroke-width="1"/>
<text x="380" y="165" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="700">Grid Layer 1 (ต้นทุน $10k)</text>

<line x1="380" y1="143" x2="380" y2="133" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="380" y="128" text-anchor="middle" font-size="8" fill="#2563eb">profit ≥ $500</text>

<rect x="310" y="100" width="140" height="24" fill="#bfdbfe" rx="4" stroke="#93c5fd" stroke-width="1"/>
<text x="380" y="116" text-anchor="middle" font-size="9" fill="#1d4ed8">Layer 2 เปิดอัตโนมัติ</text>

<line x1="380" y1="98" x2="380" y2="88" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="380" y="83" text-anchor="middle" font-size="8" fill="#2563eb">profit ≥ $500 อีก</text>

<rect x="330" y="60" width="100" height="20" fill="#93c5fd" rx="4"/>
<text x="380" y="74" text-anchor="middle" font-size="9" fill="#1d4ed8">Layer 3</text>

<text x="380" y="218" text-anchor="middle" font-size="9" fill="#2563eb">กำไรซื้อ "layer ใหม่" → compound แบบ discrete</text>

<!-- Panel 3: Zone Upgrade -->
<rect x="514" y="45" width="215" height="170" fill="#f5f3ff" rx="8" stroke="#7c3aed" stroke-width="1.5"/>
<text x="621" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">Type 3: Zone Upgrade</text>
<text x="621" y="80" text-anchor="middle" font-size="9" fill="#64748b">กำไรขยาย zone ให้ใหญ่ขึ้น</text>

<!-- Zone expansion arrow -->
<rect x="540" y="165" width="160" height="20" fill="#ddd6fe" rx="4" stroke="#a78bfa" stroke-width="1"/>
<text x="620" y="178" text-anchor="middle" font-size="9" fill="#6d28d9">Zone เดิม: $90k–$110k</text>

<line x1="620" y1="163" x2="620" y2="148" stroke="#7c3aed" stroke-width="2" marker-end="url(#upArrow)"/>
<line x1="620" y1="163" x2="620" y2="183" stroke="#7c3aed" stroke-width="2" marker-end="url(#downArrow)"/>

<rect x="530" y="90" width="180" height="20" fill="#c4b5fd" rx="4" stroke="#7c3aed" stroke-width="1.5"/>
<text x="620" y="103" text-anchor="middle" font-size="9" fill="#4c1d95">Zone ใหม่: $85k–$115k (+$5k ทั้ง 2 ด้าน)</text>

<text x="620" y="130" text-anchor="middle" font-size="9" fill="#64748b">↑ N levels เพิ่ม 5 → coverage ดีขึ้น</text>
<text x="620" y="143" text-anchor="middle" font-size="9" fill="#64748b">↑ รอบ grid เพิ่ม → cashflow เพิ่ม</text>

<text x="621" y="218" text-anchor="middle" font-size="9" fill="#7c3aed">กำไรขยาย coverage → compound แบบ continuous</text>

<defs>
  <marker id="upArrow" markerWidth="6" markerHeight="6" refX="3" refY="0" orient="auto">
    <path d="M 3 0 L 6 6 L 0 6 z" fill="#7c3aed"/>
  </marker>
  <marker id="downArrow" markerWidth="6" markerHeight="6" refX="3" refY="6" orient="auto">
    <path d="M 0 0 L 6 0 L 3 6 z" fill="#7c3aed"/>
  </marker>
</defs>

<!-- Bottom: Grid → DCA Stack -->
<rect x="30" y="240" width="700" height="130" fill="#f0fdf4" rx="10" stroke="#16a34a" stroke-width="2"/>
<text x="380" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Grid → DCA Stack (กำไรจาก Trading → Wealth Portfolio)</text>

<!-- Grid cashflow arrow -->
<rect x="50" y="278" width="200" height="50" fill="#dcfce7" rx="6" stroke="#86efac" stroke-width="1.5"/>
<text x="150" y="299" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">Trading Portfolio</text>
<text x="150" y="315" text-anchor="middle" font-size="10" fill="#15803d">Grid cashflow $45/วัน</text>

<line x1="252" y1="303" x2="338" y2="303" stroke="#16a34a" stroke-width="2"/>
<polygon points="330,298 340,303 330,308" fill="#16a34a"/>

<rect x="340" y="278" width="130" height="50" fill="#dcfce7" rx="6" stroke="#86efac" stroke-width="1.5"/>
<text x="405" y="299" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Monthly</text>
<text x="405" y="313" text-anchor="middle" font-size="10" fill="#15803d">Transfer</text>
<text x="405" y="326" text-anchor="middle" font-size="10" fill="#15803d">~$1,350</text>

<line x1="472" y1="303" x2="558" y2="303" stroke="#16a34a" stroke-width="2"/>
<polygon points="550,298 560,303 550,308" fill="#16a34a"/>

<rect x="560" y="278" width="160" height="50" fill="#bbf7d0" rx="6" stroke="#4ade80" stroke-width="1.5"/>
<text x="640" y="299" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Wealth Portfolio</text>
<text x="640" y="313" text-anchor="middle" font-size="10" fill="#166534">BTC DCA accumulation</text>
<text x="640" y="326" text-anchor="middle" font-size="10" fill="#166534">+ yield/staking</text>

<text x="380" y="360" text-anchor="middle" font-size="10" fill="#64748b">กำไรจาก Grid (active) → สะสม BTC ระยะยาว (passive) = สองมิติของความมั่งคั่ง</text>

<text x="380" y="428" text-anchor="middle" font-size="11" fill="#94a3b8">Snowball ทั้ง 3 แบบ + DCA Stack: compound ผ่าน grid cashflow ไม่ใช่ capital gain เพียงอย่างเดียว</text>
</svg>
