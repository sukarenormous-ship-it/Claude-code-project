<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="270" fill="#f9fafb"/>
  <text x="380" y="18" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Fat Tail vs Normal — Spread Return Distribution</text>
  <rect x="30" y="25" width="700" height="205" fill="white" stroke="#e5e7eb"/>
  <line x1="55" y1="220" x2="710" y2="220" stroke="#374151" stroke-width="1.5"/>
  <line x1="55" y1="220" x2="55" y2="42" stroke="#374151" stroke-width="1.5"/>
  <text x="382" y="238" text-anchor="middle" font-size="10" fill="#64748b">Standard Deviations from Mean (σ)</text>
  <text x="55" y="235" text-anchor="middle" font-size="9" fill="#64748b">−5</text>
  <text x="160" y="235" text-anchor="middle" font-size="9" fill="#64748b">−3</text>
  <text x="248" y="235" text-anchor="middle" font-size="9" fill="#64748b">−2</text>
  <text x="382" y="235" text-anchor="middle" font-size="9" fill="#64748b">0</text>
  <text x="516" y="235" text-anchor="middle" font-size="9" fill="#64748b">+2</text>
  <text x="604" y="235" text-anchor="middle" font-size="9" fill="#64748b">+3</text>
  <text x="710" y="235" text-anchor="middle" font-size="9" fill="#64748b">+5</text>
  <!-- Bars: actual spread distribution (fat tails) -->
  <!-- Left tail fat bins -->
  <rect x="58" y="212" width="40" height="8" fill="#dc2626" opacity="0.8"/>
  <rect x="98" y="210" width="40" height="10" fill="#dc2626" opacity="0.8"/>
  <rect x="138" y="205" width="40" height="15" fill="#dc2626" opacity="0.8"/>
  <rect x="178" y="196" width="40" height="24" fill="#0d9488" opacity="0.8"/>
  <rect x="218" y="180" width="40" height="40" fill="#0d9488" opacity="0.8"/>
  <rect x="258" y="145" width="45" height="75" fill="#0d9488" opacity="0.8"/>
  <!-- Center bins -->
  <rect x="300" y="70" width="50" height="150" fill="#0d9488" opacity="0.8"/>
  <rect x="347" y="48" width="70" height="172" fill="#0d9488" opacity="0.8"/>
  <rect x="413" y="70" width="50" height="150" fill="#0d9488" opacity="0.8"/>
  <!-- Right bins -->
  <rect x="460" y="145" width="45" height="75" fill="#0d9488" opacity="0.8"/>
  <rect x="500" y="180" width="40" height="40" fill="#0d9488" opacity="0.8"/>
  <rect x="540" y="196" width="40" height="24" fill="#0d9488" opacity="0.8"/>
  <!-- Right tail fat bins -->
  <rect x="580" y="205" width="40" height="15" fill="#dc2626" opacity="0.8"/>
  <rect x="620" y="210" width="40" height="10" fill="#dc2626" opacity="0.8"/>
  <rect x="660" y="213" width="40" height="7" fill="#dc2626" opacity="0.8"/>
  <!-- Normal(0,1) curve (navy dashed) -->
  <polyline points="55,220 80,219 110,217 140,213 170,205 200,192 230,172 250,155 280,112 310,78 345,52 382,46 419,52 455,78 485,112 515,155 545,172 575,192 605,205 635,213 665,217 700,219 710,220"
    fill="none" stroke="#1e3a5f" stroke-width="2.5" stroke-dasharray="6,4"/>
  <!-- Fat tail annotations -->
  <text x="75" y="200" font-size="10" fill="#dc2626" text-anchor="middle">Fat</text>
  <text x="75" y="212" font-size="10" fill="#dc2626" text-anchor="middle">tail</text>
  <text x="675" y="200" font-size="10" fill="#dc2626" text-anchor="middle">Fat</text>
  <text x="675" y="212" font-size="10" fill="#dc2626" text-anchor="middle">tail</text>
  <!-- Legend -->
  <rect x="200" y="52" width="14" height="12" fill="#0d9488" opacity="0.8"/>
  <text x="218" y="63" font-size="11" fill="#0d9488">Spread Returns (actual)</text>
  <line x1="390" y1="58" x2="415" y2="58" stroke="#1e3a5f" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="420" y="63" font-size="11" fill="#1e3a5f">Normal(0,1)</text>
  <text x="382" y="255" text-anchor="middle" font-size="11" fill="#64748b">±3σ event เกิดบ่อยกว่า Normal คาดถึง 3–5× — ต้องใช้ Jump model</text>
</svg>
