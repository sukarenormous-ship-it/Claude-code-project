<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Sarabun',sans-serif">
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Grid = Framework · Indicator = Execution Engine</text>

  <!-- ===== LEFT BOX: GRID FRAMEWORK ===== -->
  <rect x="35" y="55" width="315" height="245" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="192" y="82" font-size="13" font-weight="700" fill="#0e7490" text-anchor="middle">GRID FRAMEWORK</text>
  <text x="192" y="97" font-size="10" fill="#0891b2" text-anchor="middle">(structure — คำนวณครั้งเดียว)</text>

  <!-- Item [Z] Zone -->
  <text x="58" y="120" font-size="11" font-weight="600" fill="#0f172a">[Z]  Zone [Low, High]</text>
  <text x="58" y="135" font-size="10" fill="#475569">     Donchian + Hurst filter</text>

  <!-- Item [S] Step Size -->
  <text x="58" y="158" font-size="11" font-weight="600" fill="#0f172a">[S]  Step Size</text>
  <text x="58" y="173" font-size="10" fill="#475569">     ATR x k (adaptive)</text>

  <!-- Item [K] Capital per Level -->
  <text x="58" y="196" font-size="11" font-weight="600" fill="#0f172a">[K]  Capital per Level</text>
  <text x="58" y="211" font-size="10" fill="#475569">     Kelly f* / N levels</text>

  <!-- Item [R] Risk Budget -->
  <text x="58" y="234" font-size="11" font-weight="600" fill="#0f172a">[R]  Risk Budget</text>
  <text x="58" y="249" font-size="10" fill="#475569">     Max DD = 8% total</text>

  <!-- Item [N] N Orders -->
  <text x="58" y="272" font-size="11" font-weight="600" fill="#0f172a">[N]  N Orders = Zone / Step</text>

  <!-- ===== RIGHT BOX: INDICATOR EXECUTION ===== -->
  <rect x="410" y="55" width="315" height="245" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="567" y="82" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="middle">INDICATOR EXECUTION</text>
  <text x="567" y="97" font-size="10" fill="#7c3aed" text-anchor="middle">(timing — เปลี่ยนตาม regime)</text>

  <!-- Style 1 -->
  <text x="430" y="120" font-size="11" font-weight="600" fill="#0f172a">Style 1: Mean-Reversion</text>
  <text x="430" y="135" font-size="10" fill="#475569">RSI extreme + BB near edge</text>

  <!-- Style 2 -->
  <text x="430" y="158" font-size="11" font-weight="600" fill="#0f172a">Style 2: Trend-Adaptive</text>
  <text x="430" y="173" font-size="10" fill="#475569">H rising → step ใหญ่ขึ้น, Q ลด</text>

  <!-- Style 3 -->
  <text x="430" y="196" font-size="11" font-weight="600" fill="#0f172a">Style 3: Volume-Adaptive</text>
  <text x="430" y="211" font-size="10" fill="#475569">Vol สูง → Q เพิ่ม 30%</text>

  <!-- Style 4 -->
  <text x="430" y="234" font-size="11" font-weight="600" fill="#0f172a">Style 4: Composite Score</text>
  <text x="430" y="249" font-size="10" fill="#475569">Score 0–100 → deploy %</text>

  <!-- ===== CENTER CONNECTING SECTION ===== -->
  <!-- Left arrow group: Grid math defines WHAT -->
  <text x="380" y="157" font-size="10" font-weight="600" fill="#d97706" text-anchor="middle">→</text>
  <text x="380" y="169" font-size="9" fill="#d97706" text-anchor="middle">Grid math</text>
  <text x="380" y="181" font-size="9" fill="#d97706" text-anchor="middle">defines WHAT</text>

  <!-- Right arrow group: Indicator decides WHEN -->
  <text x="380" y="217" font-size="10" font-weight="600" fill="#d97706" text-anchor="middle">→</text>
  <text x="380" y="229" font-size="9" fill="#d97706" text-anchor="middle">Indicator</text>
  <text x="380" y="241" font-size="9" fill="#d97706" text-anchor="middle">decides WHEN</text>

  <!-- ===== DASHED CONNECTING LINES FROM BOXES TO RESULT ===== -->
  <!-- Left box bottom-center to result box top -->
  <line x1="192" y1="300" x2="192" y2="313" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowGray)"/>
  <!-- Right box bottom-center to result box top -->
  <line x1="567" y1="300" x2="567" y2="313" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowGray)"/>

  <!-- ===== BOTTOM RESULT BOX ===== -->
  <rect x="120" y="315" width="520" height="83" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="337" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">ผลลัพธ์</text>
  <text x="380" y="356" font-size="10" fill="#166534" text-anchor="middle">Framework-only: Sharpe 0.65 / DD -4.2%</text>
  <text x="380" y="372" font-size="10" fill="#166534" text-anchor="middle">Framework + Indicator filter: Sharpe 0.72 / DD -2.8%  (+improvement)</text>
  <text x="380" y="387" font-size="9" fill="#64748b" text-anchor="middle">P&amp;L รวมใกล้เคียงกัน แต่ risk-adjusted return ดีขึ้น</text>

  <!-- Caption -->
  <text x="380" y="430" font-size="10" fill="#94a3b8" text-anchor="middle">Framework = alpha หลัก · Indicator = ปรับ Sharpe ratio — ไม่ใช่เพิ่ม P&amp;L 50%</text>
</svg>
