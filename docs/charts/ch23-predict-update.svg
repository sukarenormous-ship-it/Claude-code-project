<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs>
  <marker id="arwT" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#0d9488"/>
  </marker>
  <marker id="arwB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
  </marker>
  <marker id="arwG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
  </marker>
</defs>
<rect x="2" y="2" width="756" height="256" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">วงจร Predict-Update ของ Kalman Filter (ทำซ้ำทุก time step)</text>

<!-- Box 1: State at t-1 -->
<rect x="30" y="90" width="130" height="75" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="95" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#0d9488">State (t−1)</text>
<text x="95" y="133" text-anchor="middle" font-size="10" fill="#374151">β̂_{t-1|t-1}</text>
<text x="95" y="149" text-anchor="middle" font-size="10" fill="#374151">P_{t-1|t-1}</text>

<!-- Arrow 1→2 -->
<line x1="160" y1="127" x2="200" y2="127" stroke="#0d9488" stroke-width="2" marker-end="url(#arwT)"/>
<text x="180" y="119" text-anchor="middle" font-size="8" fill="#0d9488">β+Q</text>

<!-- Box 2: PREDICT -->
<rect x="200" y="70" width="150" height="115" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="275" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">① PREDICT</text>
<text x="275" y="114" text-anchor="middle" font-size="9.5" fill="#374151">β̂_{t|t-1} = β̂_{t-1}</text>
<text x="275" y="130" text-anchor="middle" font-size="9.5" fill="#374151">P_{t|t-1} = P_{t-1} + Q</text>
<text x="275" y="150" text-anchor="middle" font-size="8.5" fill="#6b7280">(Process noise Q</text>
<text x="275" y="164" text-anchor="middle" font-size="8.5" fill="#6b7280">เพิ่ม uncertainty)</text>

<!-- Arrow from observation -->
<line x1="380" y1="50" x2="380" y2="88" stroke="#d97706" stroke-width="2" marker-end="url(#arwB)"/>
<rect x="330" y="28" width="100" height="32" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="380" y="44" text-anchor="middle" font-size="10" fill="#92400e" font-weight="700">y_t, x_t</text>
<text x="380" y="56" text-anchor="middle" font-size="8" fill="#92400e">ข้อมูลใหม่</text>

<!-- Box 3: UPDATE -->
<rect x="355" y="60" width="180" height="155" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="445" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">② UPDATE</text>
<text x="445" y="105" text-anchor="middle" font-size="9" fill="#374151">ν_t = y_t − β̂_{t|t-1}·x_t</text>
<text x="445" y="121" text-anchor="middle" font-size="9" fill="#374151">S_t = x_t²·P_{t|t-1} + R</text>
<text x="445" y="137" text-anchor="middle" font-size="9" fill="#374151">K_t = P_{t|t-1}·x_t / S_t</text>
<text x="445" y="155" text-anchor="middle" font-size="9.5" font-weight="700" fill="#16a34a">β̂_t = β̂_{t|t-1} + K_t·ν_t</text>
<text x="445" y="172" text-anchor="middle" font-size="9" fill="#374151">P_t = (1−K_t·x_t)·P_{t|t-1}</text>
<text x="445" y="190" text-anchor="middle" font-size="8.5" fill="#6b7280">(Kalman gain K_t</text>
<text x="445" y="203" text-anchor="middle" font-size="8.5" fill="#6b7280">ถ่วงน้ำหนัก)</text>

<!-- Arrow 2→3 -->
<line x1="350" y1="127" x2="357" y2="127" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arwG)"/>

<!-- Box 4: Output -->
<rect x="565" y="90" width="155" height="75" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="642" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">Output</text>
<text x="642" y="133" text-anchor="middle" font-size="10" fill="#374151">β_t (updated)</text>
<text x="642" y="149" text-anchor="middle" font-size="10" fill="#374151">ε_t = y_t − β_t·x_t</text>

<!-- Arrow 3→4 -->
<line x1="535" y1="127" x2="565" y2="127" stroke="#7c3aed" stroke-width="2" marker-end="url(#arwB)"/>

<!-- Feedback loop arrow (output → next state t-1) -->
<path d="M 642 165 Q 642 230 95 230 Q 95 175 95 165" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arwT)"/>
<text x="370" y="246" text-anchor="middle" font-size="9" fill="#374151">loop ต่อ: state (t) กลายเป็น state (t−1) ในรอบถัดไป</text>

<!-- Kalman gain annotation -->
<text x="380" y="220" text-anchor="middle" font-size="8" fill="#16a34a">K_t → 1: เชื่อข้อมูลใหม่ | K_t → 0: เชื่อ model เก่า</text>
</svg>
