<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Sarabun',sans-serif">
  <defs>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowAmber2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Grid Regime Detection — เมื่อไหร่เปิด/หยุด Grid</text>

  <!-- ===== UPPER SECTION: State Machine ===== -->

  <!-- Box 1: GRID ON -->
  <rect x="40" y="55" width="185" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="132" y="82" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">GRID ON</text>
  <text x="132" y="97" font-size="10" fill="#166534" text-anchor="middle">mean-reverting</text>
  <text x="58" y="114" font-size="9" fill="#166534">H &lt; 0.50 (Hurst)</text>
  <text x="58" y="127" font-size="9" fill="#166534">ADX &lt; 40 (BTC-calibrated)</text>
  <text x="58" y="140" font-size="9" fill="#166534">BB width ปกติ</text>
  <text x="132" y="162" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Full Deploy</text>

  <!-- Box 2: CAUTION -->
  <rect x="287" y="55" width="185" height="130" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="379" y="82" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">CAUTION</text>
  <text x="379" y="97" font-size="10" fill="#92400e" text-anchor="middle">borderline regime</text>
  <text x="305" y="114" font-size="9" fill="#92400e">H = 0.50–0.60</text>
  <text x="305" y="127" font-size="9" fill="#92400e">ADX = 40–50</text>
  <text x="305" y="140" font-size="9" fill="#92400e">Vol spike เริ่มขึ้น</text>
  <text x="379" y="162" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Reduce 50% size</text>

  <!-- Box 3: GRID OFF -->
  <rect x="534" y="55" width="185" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="626" y="82" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">GRID OFF</text>
  <text x="626" y="97" font-size="10" fill="#991b1b" text-anchor="middle">trending / breakout</text>
  <text x="552" y="114" font-size="9" fill="#991b1b">H &gt; 0.60</text>
  <text x="552" y="127" font-size="9" fill="#991b1b">ADX &gt; 50</text>
  <text x="552" y="140" font-size="9" fill="#991b1b">ราคาออกนอก Donchian</text>
  <text x="626" y="162" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Pause — Cancel all</text>

  <!-- Arrows between Box 1 and Box 2 -->
  <!-- ON→CAUTION right arrow at y=115, label above -->
  <text x="238" y="108" font-size="9" fill="#d97706" text-anchor="middle">H rising</text>
  <line x1="228" y1="115" x2="281" y2="115" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <!-- CAUTION→ON left arrow at y=130, label below -->
  <line x1="281" y1="130" x2="228" y2="130" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="238" y="144" font-size="9" fill="#16a34a" text-anchor="middle">H drops</text>

  <!-- Arrows between Box 2 and Box 3 -->
  <!-- CAUTION→OFF right arrow at y=115, label above -->
  <text x="485" y="108" font-size="9" fill="#dc2626" text-anchor="middle">ADX spike</text>
  <line x1="475" y1="115" x2="528" y2="115" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <!-- OFF→CAUTION left arrow at y=130, label below -->
  <line x1="528" y1="130" x2="475" y2="130" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowAmber2)"/>
  <text x="485" y="144" font-size="9" fill="#d97706" text-anchor="middle">ADX drops</text>

  <!-- ===== LOWER SECTION: Hurst Timeline Chart ===== -->

  <!-- Sub-title -->
  <text x="380" y="240" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">ตัวอย่าง Hurst Exponent Rolling 30 วัน</text>

  <!-- Colored background bands (clipped to chart area x=75-700, y=255-385) -->
  <rect x="75"  y="255" width="155" height="130" fill="#f0fdf4" opacity="0.7"/>
  <rect x="230" y="255" width="100" height="130" fill="#fffbeb" opacity="0.8"/>
  <rect x="330" y="255" width="115" height="130" fill="#fef2f2" opacity="0.8"/>
  <rect x="445" y="255" width="255" height="130" fill="#f0fdf4" opacity="0.7"/>

  <!-- Band labels at y=268 -->
  <text x="152" y="268" font-size="8" fill="#15803d" text-anchor="middle">GRID ON</text>
  <text x="280" y="268" font-size="8" fill="#b45309" text-anchor="middle">CAUTION</text>
  <text x="387" y="268" font-size="8" fill="#991b1b" text-anchor="middle">GRID OFF</text>
  <text x="572" y="268" font-size="8" fill="#15803d" text-anchor="middle">GRID ON</text>

  <!-- Chart border -->
  <rect x="75" y="255" width="625" height="130" fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Y-axis labels -->
  <!-- Scale: y=255->H=0.65, y=305->H=0.60, y=343->H=0.50, y=380->H=0.40 -->
  <text x="65" y="384" font-size="9" fill="#64748b" text-anchor="end">0.40</text>
  <text x="65" y="347" font-size="9" fill="#64748b" text-anchor="end">0.50</text>
  <text x="65" y="309" font-size="9" fill="#64748b" text-anchor="end">0.60</text>
  <text x="65" y="259" font-size="9" fill="#64748b" text-anchor="end">0.65</text>

  <!-- Threshold line H=0.60 at y=305 -->
  <line x1="75" y1="305" x2="685" y2="305" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="688" y="301" font-size="8" fill="#dc2626" text-anchor="start">H=0.60</text>

  <!-- Threshold line H=0.50 at y=343 -->
  <line x1="75" y1="343" x2="685" y2="343" stroke="#d97706" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="688" y="339" font-size="8" fill="#d97706" text-anchor="start">H=0.50</text>

  <!-- Hurst line: blue polyline -->
  <!-- H=0.44->y=362, H=0.46->y=352, H=0.48->y=342, H=0.52->y=322, H=0.58->y=292, H=0.63->y=267, H=0.62->y=271, H=0.55->y=307, H=0.47->y=347, H=0.44->y=362 -->
  <polyline
    points="75,362 105,358 135,352 165,355 195,348 225,342 255,325 280,308 310,285 340,270 370,267 395,272 420,285 445,308 475,332 505,345 535,348 565,350 610,354 655,358 700,360"
    fill="none" stroke="#1e40af" stroke-width="2" stroke-linejoin="round"/>

  <!-- Caption -->
  <text x="380" y="430" font-size="10" fill="#94a3b8" text-anchor="middle">H &lt; 0.50 = grid เต็ม · 0.50–0.60 = ลด size · H &gt; 0.60 = หยุด grid (BTC-calibrated)</text>
</svg>
