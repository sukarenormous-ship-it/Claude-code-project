<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Sarabun',sans-serif">

  <!-- Background -->
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Donchian Channel (Zone) + ATR-Based Step สำหรับ Grid</text>

  <!-- ===================================================== -->
  <!-- AXES -->
  <!-- Chart area: x=75 to x=695, y=60 to y=365 -->
  <!-- ===================================================== -->

  <!-- Y-axis -->
  <line x1="75" y1="60" x2="75" y2="365" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- X-axis -->
  <line x1="75" y1="365" x2="695" y2="365" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Y-axis label (rotated) -->
  <text x="18" y="213" font-size="10" fill="#475569" text-anchor="middle" transform="rotate(-90,18,213)">ราคา</text>

  <!-- X-axis label -->
  <text x="385" y="390" font-size="10" fill="#475569" text-anchor="middle">เวลา (N วัน)</text>

  <!-- ===================================================== -->
  <!-- DONCHIAN CHANNEL (violet #7c3aed) -->
  <!-- Upper band wavy around y=90, Lower band wavy around y=300 -->
  <!-- ===================================================== -->

  <!-- Donchian fill polygon -->
  <polygon
    points="75,92 120,88 180,94 240,86 300,92 360,88 420,94 480,90 540,86 600,92 660,88 695,90
            695,298 660,304 600,296 540,302 480,298 420,304 360,298 300,304 240,298 180,304 120,298 75,300"
    fill="#7c3aed" fill-opacity="0.06"/>

  <!-- Donchian upper band (dashed) -->
  <polyline
    points="75,92 120,88 180,94 240,86 300,92 360,88 420,94 480,90 540,86 600,92 660,88 695,90"
    fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Donchian lower band (dashed) -->
  <polyline
    points="75,300 120,298 180,304 240,298 300,304 360,298 420,304 480,298 540,302 600,296 660,304 695,298"
    fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Donchian High label pill at x=500, y=85 -->
  <rect x="422" y="73" width="196" height="17" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="520" y="85" font-size="9" fill="#7c3aed" text-anchor="middle">Donchian High = Zone บน</text>

  <!-- Donchian Low label pill at x=500, y=295 -->
  <rect x="422" y="283" width="196" height="17" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="520" y="295" font-size="9" fill="#7c3aed" text-anchor="middle">Donchian Low = Zone ล่าง</text>

  <!-- ===================================================== -->
  <!-- ATR / KELTNER CHANNEL (cyan #06b6d4) -->
  <!-- Upper step line around y=155, Lower around y=215, EMA at y=185 -->
  <!-- ===================================================== -->

  <!-- ATR fill -->
  <polygon
    points="75,158 130,153 200,157 280,152 360,156 440,153 520,157 600,154 660,156 695,155
            695,217 660,213 600,216 520,214 440,217 360,213 280,216 200,214 130,218 75,215"
    fill="#06b6d4" fill-opacity="0.08"/>

  <!-- ATR upper line (solid) -->
  <polyline
    points="75,158 130,153 200,157 280,152 360,156 440,153 520,157 600,154 660,156 695,155"
    fill="none" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- ATR lower line (solid) -->
  <polyline
    points="75,215 130,218 200,214 280,216 360,213 440,217 520,214 600,216 660,213 695,217"
    fill="none" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- EMA middle line (dashed) -->
  <polyline
    points="75,186 130,184 200,186 280,183 360,185 440,184 520,186 600,184 660,185 695,186"
    fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ATR Upper label box -->
  <rect x="78" y="139" width="192" height="16" rx="3" fill="#ecfeff" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="174" y="151" font-size="9" fill="#0e7490" text-anchor="middle">Keltner Upper (EMA+k×ATR)</text>

  <!-- ATR Lower label box -->
  <rect x="78" y="200" width="110" height="15" rx="3" fill="#ecfeff" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="133" y="212" font-size="9" fill="#0e7490" text-anchor="middle">Keltner Lower</text>

  <!-- EMA mid label box -->
  <rect x="78" y="173" width="75" height="15" rx="3" fill="#ecfeff" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="115" y="185" font-size="9" fill="#0e7490" text-anchor="middle">EMA (mid)</text>

  <!-- ===================================================== -->
  <!-- PRICE PATH (bold blue #1e40af) -->
  <!-- Zigzag bouncing within ATR bands roughly -->
  <!-- ===================================================== -->
  <polyline
    points="75,186 100,170 125,198 155,162 185,200 215,172 245,194 275,158 305,210 335,178
             365,196 395,163 425,207 455,175 485,200 515,165 545,205 575,180 610,195 645,170 675,188 695,176"
    fill="none" stroke="#1e40af" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ===================================================== -->
  <!-- STEP SIZE ANNOTATION (left between ATR lines) -->
  <!-- Double-headed arrow at x=52, y=155 to y=215 -->
  <!-- ===================================================== -->
  <!-- Arrow shaft -->
  <line x1="52" y1="160" x2="52" y2="213" stroke="#0e7490" stroke-width="1.5"/>
  <!-- Arrow heads -->
  <polygon points="52,155 48,165 56,165" fill="#0e7490"/>
  <polygon points="52,218 48,208 56,208" fill="#0e7490"/>
  <!-- Step label (two lines) -->
  <text x="46" y="180" font-size="9" fill="#0e7490" text-anchor="middle">Step</text>
  <text x="46" y="192" font-size="9" fill="#0e7490" text-anchor="middle">= ATR×k</text>

  <!-- ===================================================== -->
  <!-- ZONE WIDTH ANNOTATION (left between Donchian bands) -->
  <!-- Bracket at x=40, y=90 to y=300 -->
  <!-- ===================================================== -->
  <!-- Vertical bracket line -->
  <line x1="40" y1="95" x2="40" y2="298" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Bracket ticks -->
  <line x1="40" y1="95"  x2="46" y2="95"  stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="40" y1="298" x2="46" y2="298" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Zone label rotated -->
  <text x="30" y="197" font-size="9" fill="#7c3aed" text-anchor="middle" transform="rotate(-90,30,197)">Zone = Donchian</text>

  <!-- ===================================================== -->
  <!-- LEGEND (y=380-400) -->
  <!-- ===================================================== -->
  <!-- Violet swatch -->
  <rect x="75" y="403" width="12" height="12" fill="#7c3aed" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1.2" rx="1"/>
  <text x="92" y="413" font-size="9" fill="#374151">Donchian Channel (20d) — กำหนด Zone (High/Low)</text>

  <!-- Cyan swatch -->
  <rect x="395" y="403" width="12" height="12" fill="#06b6d4" fill-opacity="0.25" stroke="#06b6d4" stroke-width="1.2" rx="1"/>
  <text x="412" y="413" font-size="9" fill="#374151">ATR Channel — กำหนด Step Size</text>

  <!-- Caption -->
  <text x="380" y="430" font-size="10" fill="#94a3b8" text-anchor="middle">Donchian = ช่วง price-based (dynamic zone) · ATR = ความผันผวน-based (dynamic step)</text>

</svg>
