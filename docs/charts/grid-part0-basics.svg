<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">

<!-- Background -->
<rect width="760" height="440" fill="#ffffff"/>

<!-- Title -->
<text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Grid Trading — กลไกพื้นฐาน (Buy Low, Sell High ซ้ำๆ)</text>

<!-- Chart area: x=70 to x=730, y=50 to y=385 -->

<!-- Y-axis line -->
<line x1="70" y1="50" x2="70" y2="385" stroke="#94a3b8" stroke-width="1.5"/>
<!-- X-axis line -->
<line x1="70" y1="385" x2="700" y2="385" stroke="#94a3b8" stroke-width="1.5"/>

<!--
  Price mapping: $90k→y=350, $95k→y=283, $100k→y=217 (mid), $105k→y=150, $110k→y=83
  Step = ($350-$83)/4 = 66.75 per $5k
  y = 350 - (price-90)*13.35
  $90k → 350, $95k → 350-66.75=283, $100k → 217, $105k → 150, $110k → 83
-->

<!-- Horizontal dashed grid lines -->
<!-- $110k -->
<line x1="70" y1="83" x2="700" y2="83" stroke="#fca5a5" stroke-width="1" stroke-dasharray="5,4"/>
<!-- $105k -->
<line x1="70" y1="150" x2="700" y2="150" stroke="#fca5a5" stroke-width="1" stroke-dasharray="5,4"/>
<!-- $100k (current, bold cyan) -->
<line x1="70" y1="217" x2="700" y2="217" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6,3"/>
<!-- $95k -->
<line x1="70" y1="283" x2="700" y2="283" stroke="#86efac" stroke-width="1" stroke-dasharray="5,4"/>
<!-- $90k -->
<line x1="70" y1="350" x2="700" y2="350" stroke="#4ade80" stroke-width="1" stroke-dasharray="5,4"/>

<!-- Y-axis labels (left side, x=62) -->
<text x="62" y="87" text-anchor="end" font-size="10" fill="#ef4444" font-weight="600">$110k</text>
<text x="62" y="154" text-anchor="end" font-size="10" fill="#f87171">$105k</text>
<text x="62" y="221" text-anchor="end" font-size="10" fill="#06b6d4" font-weight="700">$100k</text>
<text x="62" y="287" text-anchor="end" font-size="10" fill="#22c55e">$95k</text>
<text x="62" y="354" text-anchor="end" font-size="10" fill="#16a34a" font-weight="600">$90k</text>

<!-- X-axis label -->
<text x="385" y="398" text-anchor="middle" font-size="10" fill="#64748b">เวลา (Time)</text>

<!--
  Zigzag price path — every leg is exactly ONE step ($5k). No leg skips a level.
  P1 BUY $95k (100,283) -> P2 SELL $100k (180,217): closes P1, +$5k
  P3 BUY $95k (260,283) -> P4 BUY $90k (340,350): price drops 2 steps in a row,
    so it opens TWO separate buys (P3 then P4) — it does NOT jump straight to $90k
    with only one order. This is the fix: multi-level moves open one order per level.
  P4's buy is closed first (its target is one step up, $95k) at P5 (420,283): +$5k
  P3's buy is closed next (its target is $100k) at P6 (500,217): +$5k
  P7 BUY $95k (580,283) -> P8 SELL $100k (660,217): closes P7, +$5k
-->
<polyline
  points="100,283 180,217 260,283 340,350 420,283 500,217 580,283 660,217"
  fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

<!-- BUY point 1: (100, 283) = $95k -->
<circle cx="100" cy="283" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
<text x="100" y="297" text-anchor="middle" font-size="9" fill="#15803d" font-weight="700">BUY</text>

<!-- SELL point 1: (180, 217) = $100k -->
<circle cx="180" cy="217" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
<text x="180" y="208" text-anchor="middle" font-size="9" fill="#b91c1c" font-weight="700">SELL</text>

<!-- BUY point 2: (260, 283) = $95k -->
<circle cx="260" cy="283" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
<text x="260" y="297" text-anchor="middle" font-size="9" fill="#15803d" font-weight="700">BUY</text>

<!-- BUY point 3: (340, 350) = $90k — second buy in a row, price kept falling -->
<circle cx="340" cy="350" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
<text x="340" y="364" text-anchor="middle" font-size="9" fill="#15803d" font-weight="700">BUY</text>

<!-- SELL point 2: (420, 283) = $95k — closes the $90k buy -->
<circle cx="420" cy="283" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
<text x="420" y="274" text-anchor="middle" font-size="9" fill="#b91c1c" font-weight="700">SELL</text>

<!-- SELL point 3: (500, 217) = $100k — closes the $95k buy -->
<circle cx="500" cy="217" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
<text x="500" y="208" text-anchor="middle" font-size="9" fill="#b91c1c" font-weight="700">SELL</text>

<!-- BUY point 4: (580, 283) = $95k -->
<circle cx="580" cy="283" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
<text x="580" y="297" text-anchor="middle" font-size="9" fill="#15803d" font-weight="700">BUY</text>

<!-- SELL point 4: (660, 217) = $100k -->
<circle cx="660" cy="217" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
<text x="660" y="208" text-anchor="middle" font-size="9" fill="#b91c1c" font-weight="700">SELL</text>

<!--
  Profit arrows (amber dashed curved paths) — every arrow now spans exactly ONE step ($5k),
  connecting each BUY to the specific SELL that closes it. Arcs B and C nest (B spans
  over C) instead of crossing, showing the $95k-buy and $90k-buy are two independent,
  overlapping positions — each closed by its own one-step target, not skipped over.
-->

<!-- Arrow A: P1(100,283) -> P2(180,217), +$5k -->
<path d="M 100,276 Q 140,240 180,224"
  fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"
  marker-end="url(#arrowAmber)"/>
<text x="140" y="238" text-anchor="middle" font-size="9" fill="#b45309" font-weight="700">+$5k</text>

<!-- Arrow B (outer): P3(260,283) -> P6(500,217), +$5k — the $95k buy's own 1-step target -->
<path d="M 260,276 Q 380,120 500,224"
  fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"
  marker-end="url(#arrowAmber)"/>
<text x="380" y="130" text-anchor="middle" font-size="9" fill="#b45309" font-weight="700">+$5k</text>

<!-- Arrow C (inner): P4(340,350) -> P5(420,283), +$5k — the $90k buy's own 1-step target -->
<path d="M 340,343 Q 380,308 420,291"
  fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"
  marker-end="url(#arrowAmber)"/>
<text x="380" y="322" text-anchor="middle" font-size="9" fill="#b45309" font-weight="700">+$5k</text>

<!-- Arrow D: P7(580,283) -> P8(660,217), +$5k -->
<path d="M 580,276 Q 620,240 660,224"
  fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"
  marker-end="url(#arrowAmber)"/>
<text x="620" y="238" text-anchor="middle" font-size="9" fill="#b45309" font-weight="700">+$5k</text>

<!-- Arrow marker definition -->
<defs>
  <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
  </marker>
  <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
  </marker>
  <marker id="arrowGrayRev" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
    <path d="M8,0 L8,6 L0,3 z" fill="#64748b"/>
  </marker>
</defs>

<!-- SELL zone box (top-right corner) -->
<rect x="610" y="56" width="82" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
<text x="651" y="73" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="700">SELL Zone</text>

<!-- BUY zone box (bottom area, but above x-axis labels) -->
<rect x="610" y="323" width="82" height="26" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
<text x="651" y="340" text-anchor="middle" font-size="10" fill="#15803d" font-weight="700">BUY Zone</text>

<!--
  Step annotation: double-headed arrow on far right between $100k (y=217) and $105k (y=150).
  We place it at x=715 (but must stay <= 730).
  Arrow from y=220 to y=147.
-->
<line x1="710" y1="150" x2="710" y2="217" stroke="#64748b" stroke-width="1.5"
  marker-start="url(#arrowGrayRev)" marker-end="url(#arrowGray)"/>
<!-- Tick marks -->
<line x1="705" y1="150" x2="715" y2="150" stroke="#64748b" stroke-width="1.5"/>
<line x1="705" y1="217" x2="715" y2="217" stroke="#64748b" stroke-width="1.5"/>
<!-- Label -->
<text x="722" y="187" text-anchor="start" font-size="9" fill="#475569" font-weight="700">Step</text>
<text x="722" y="199" text-anchor="start" font-size="9" fill="#475569">=$5k</text>

<!-- Caption -->
<text x="380" y="430" text-anchor="middle" font-size="10" fill="#94a3b8">แต่ละคู่ level ปิดกำไร 1 step อิสระ — ข้าม 2 levels รวดเดียว = เปิด BUY 2 ครั้งแยกกัน ไม่ใช่กำไรก้อนเดียว</text>

</svg>
