<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">
<rect width="760" height="440" fill="#f8fafc" rx="6"/>
<text x="380" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Grid Bloating Patterns — 3 รูปแบบ</text>

<!-- Panel 1: บวมบน (Top-Heavy) -->
<text x="127" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">บวมบน (Top-Heavy)</text>
<text x="127" y="68" text-anchor="middle" font-size="10" fill="#64748b">inventory สะสมบนสูง</text>

<!-- Price levels (y: 80=top, 320=bottom) for panel 1 -->
<line x1="60" y1="80" x2="195" y2="80" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="60" y1="128" x2="195" y2="128" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="60" y1="176" x2="195" y2="176" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="60" y1="224" x2="195" y2="224" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="60" y1="272" x2="195" y2="272" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="60" y1="320" x2="195" y2="320" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Inventory bars (left side, wider=more inventory) -->
<!-- Level 1 (top) — lots of inventory -->
<rect x="60" y="82" width="80" height="42" fill="#fca5a5" rx="2" fill-opacity="0.8"/>
<text x="105" y="107" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="700">8 BTC</text>
<!-- Level 2 -->
<rect x="60" y="130" width="60" height="42" fill="#fca5a5" rx="2" fill-opacity="0.7"/>
<text x="95" y="155" text-anchor="middle" font-size="10" fill="#991b1b">6 BTC</text>
<!-- Level 3 (current zone) -->
<rect x="60" y="178" width="30" height="42" fill="#fca5a5" rx="2" fill-opacity="0.5"/>
<text x="80" y="203" text-anchor="middle" font-size="9" fill="#991b1b">3</text>
<!-- Level 4 -->
<rect x="60" y="226" width="15" height="42" fill="#fca5a5" rx="2" fill-opacity="0.3"/>
<text x="72" y="251" text-anchor="middle" font-size="9" fill="#991b1b">1</text>
<!-- Level 5 -->
<rect x="60" y="274" width="8" height="42" fill="#fca5a5" rx="2" fill-opacity="0.2"/>
<!-- Level 6 (floor) -->

<!-- Price label -->
<text x="48" y="84" text-anchor="end" font-size="9" fill="#94a3b8">$110k</text>
<text x="48" y="180" text-anchor="end" font-size="9" fill="#06b6d4">$100k</text>
<text x="48" y="322" text-anchor="end" font-size="9" fill="#94a3b8">$90k</text>

<line x1="60" y1="176" x2="195" y2="176" stroke="#06b6d4" stroke-width="2"/>
<text x="130" y="172" font-size="9" fill="#06b6d4">current price</text>

<!-- Panel 2: บวมล่าง (Bottom-Heavy) -->
<text x="383" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">บวมล่าง (Bottom-Heavy)</text>
<text x="383" y="68" text-anchor="middle" font-size="10" fill="#64748b">inventory สะสมล่างมาก</text>

<line x1="316" y1="80" x2="451" y2="80" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="316" y1="128" x2="451" y2="128" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="316" y1="176" x2="451" y2="176" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="316" y1="224" x2="451" y2="224" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="316" y1="272" x2="451" y2="272" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="316" y1="320" x2="451" y2="320" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Bottom heavy: little at top, lots at bottom -->
<rect x="316" y="82" width="8" height="42" fill="#93c5fd" rx="2" fill-opacity="0.3"/>
<rect x="316" y="130" width="15" height="42" fill="#93c5fd" rx="2" fill-opacity="0.4"/>
<rect x="316" y="178" width="25" height="42" fill="#93c5fd" rx="2" fill-opacity="0.5"/>
<text x="332" y="203" text-anchor="middle" font-size="9" fill="#1d4ed8">2</text>
<rect x="316" y="226" width="55" height="42" fill="#93c5fd" rx="2" fill-opacity="0.7"/>
<text x="349" y="251" text-anchor="middle" font-size="10" fill="#1d4ed8">5 BTC</text>
<rect x="316" y="274" width="80" height="42" fill="#93c5fd" rx="2" fill-opacity="0.8"/>
<text x="361" y="299" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="700">8 BTC</text>

<line x1="316" y1="176" x2="451" y2="176" stroke="#06b6d4" stroke-width="2"/>
<text x="390" y="172" font-size="9" fill="#06b6d4">current price</text>
<text x="304" y="84" text-anchor="end" font-size="9" fill="#94a3b8">$110k</text>
<text x="304" y="180" text-anchor="end" font-size="9" fill="#06b6d4">$100k</text>
<text x="304" y="322" text-anchor="end" font-size="9" fill="#94a3b8">$90k</text>

<!-- Panel 3: บวมกลาง (Center-Heavy / Bell) -->
<text x="637" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">บวมกลาง (Bell Curve)</text>
<text x="637" y="68" text-anchor="middle" font-size="10" fill="#64748b">inventory หนาแน่นกลาง</text>

<line x1="570" y1="80" x2="705" y2="80" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="570" y1="128" x2="705" y2="128" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="570" y1="176" x2="705" y2="176" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="570" y1="224" x2="705" y2="224" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="570" y1="272" x2="705" y2="272" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="570" y1="320" x2="705" y2="320" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Bell: few at extremes, lots in middle -->
<rect x="570" y="82" width="20" height="42" fill="#86efac" rx="2" fill-opacity="0.5"/>
<text x="585" y="107" text-anchor="middle" font-size="9" fill="#15803d">2</text>
<rect x="570" y="130" width="60" height="42" fill="#86efac" rx="2" fill-opacity="0.7"/>
<text x="605" y="155" text-anchor="middle" font-size="10" fill="#15803d">6 BTC</text>
<rect x="570" y="178" width="80" height="42" fill="#86efac" rx="2" fill-opacity="0.9"/>
<text x="615" y="203" text-anchor="middle" font-size="10" fill="#14532d" font-weight="700">8 BTC ★</text>
<rect x="570" y="226" width="60" height="42" fill="#86efac" rx="2" fill-opacity="0.7"/>
<text x="605" y="251" text-anchor="middle" font-size="10" fill="#15803d">6 BTC</text>
<rect x="570" y="274" width="20" height="42" fill="#86efac" rx="2" fill-opacity="0.5"/>
<text x="585" y="299" text-anchor="middle" font-size="9" fill="#15803d">2</text>

<line x1="570" y1="176" x2="705" y2="176" stroke="#06b6d4" stroke-width="2"/>
<text x="644" y="172" font-size="9" fill="#06b6d4">current = max density</text>
<text x="558" y="84" text-anchor="end" font-size="9" fill="#94a3b8">$110k</text>
<text x="558" y="180" text-anchor="end" font-size="9" fill="#06b6d4">$100k</text>
<text x="558" y="322" text-anchor="end" font-size="9" fill="#94a3b8">$90k</text>

<!-- Dividers -->
<line x1="253" y1="50" x2="253" y2="340" stroke="#e2e8f0" stroke-width="2"/>
<line x1="507" y1="50" x2="507" y2="340" stroke="#e2e8f0" stroke-width="2"/>

<!-- Bottom annotations -->
<text x="127" y="360" text-anchor="middle" font-size="10" fill="#dc2626">⚠️ ราคาลงมากต้องการ capital มาก</text>
<text x="127" y="374" text-anchor="middle" font-size="10" fill="#dc2626">— เสี่ยง bust ถ้า SL บน</text>

<text x="383" y="360" text-anchor="middle" font-size="10" fill="#2563eb">⚠️ ราคาลงเยอะมากต่อ BTC</text>
<text x="383" y="374" text-anchor="middle" font-size="10" fill="#2563eb">— cashflow น้อยถ้าราคาไม่ตก</text>

<text x="637" y="360" text-anchor="middle" font-size="10" fill="#16a34a">✓ สมดุล: cashflow ดีรอบ mean</text>
<text x="637" y="374" text-anchor="middle" font-size="10" fill="#16a34a">— capital ไม่เสีย extremes</text>

<text x="380" y="410" text-anchor="middle" font-size="11" fill="#94a3b8">ทั้ง 3 แบบมี P&amp;L ใกล้เคียงกัน — ความต่างคือ risk distribution และ cashflow smoothness</text>
</svg>
