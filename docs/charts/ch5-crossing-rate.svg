<svg viewBox="-40 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="-40" width="720" height="260" fill="#f9fafb"/>
  <text x="340" y="22" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Crossing Rate — ยิ่ง φ ต่ำ ยิ่งตัดผ่านค่ากลางบ่อย</text>
  <rect x="30" y="35" width="620" height="185" fill="white" stroke="#e5e7eb"/>
  <line x1="55" y1="220" x2="630" y2="220" stroke="#374151" stroke-width="1.5"/>
  <line x1="55" y1="220" x2="55" y2="55" stroke="#374151" stroke-width="1.5"/>
  <text x="340" y="238" text-anchor="middle" font-size="10" fill="#64748b">φ (AR1 coefficient)</text>
  <text x="45" y="240" text-anchor="end" font-size="10" fill="#64748b">0</text>
  <text x="635" y="240" text-anchor="start" font-size="10" fill="#64748b">1.0</text>
  <text x="42" y="65" text-anchor="end" font-size="10" fill="#64748b">E[Crossings]</text>
  <!-- Crossing rate curve: E[C] = (1/π)·arccos(φ) scaled for display -->
  <!-- φ=0: arccos(0)=π/2 → (1/π)·(π/2) = 0.5 → high -->
  <!-- φ=0.5: arccos(0.5)=π/3 → 1/3 -->
  <!-- φ=0.9: arccos(0.9)=0.451 → 0.144 -->
  <!-- φ→1: arccos(1)=0 → 0 -->
  <polyline points="55,85 100,90 145,98 190,108 235,120 280,135 325,150 370,165 415,178 460,190 505,200 550,208 595,215 630,220"
    fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <!-- Shaded tradeable zone (φ < 0.97) -->
  <rect x="55" y="55" width="480" height="165" fill="#f0fdf4" opacity="0.3"/>
  <line x1="535" y1="55" x2="535" y2="220" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="535" y="52" text-anchor="middle" font-size="10" fill="#dc2626">φ=0.97</text>
  <text x="295" y="72" text-anchor="middle" font-size="10" fill="#16a34a">Tradeable zone — crossing บ่อย</text>
  <text x="590" y="72" text-anchor="middle" font-size="10" fill="#dc2626">Half-life &gt; 1 month</text>
  <!-- Annotate some values -->
  <circle cx="55" cy="85" r="4" fill="#0d9488"/>
  <text x="58" y="82" font-size="10" fill="#0d9488">φ=0: 0.5</text>
  <circle cx="325" cy="150" r="4" fill="#0d9488"/>
  <text x="333" y="133" font-size="10" fill="#0d9488">φ=0.5: 0.33</text>
  <circle cx="480" cy="193" r="4" fill="#d97706"/>
  <text x="450" y="168" font-size="10" fill="#d97706">φ=0.93: 0.10</text>
  <text x="340" y="252" text-anchor="middle" font-size="11" fill="#64748b">E[Crossings] = (1/π)·arccos(φ) — ใช้ประเมินความถี่ trade ต่อ period</text>
</svg>
