<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Sarabun',sans-serif">
  <!-- Background -->
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Zone Waterfall — Active / Standby / Floor</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LEFT SIDE: Three stacked zone boxes        -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- ACTIVE ZONE (y=70-155) -->
  <rect x="60" y="70" width="340" height="85" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="240" y="98" font-size="13" font-weight="700" fill="#0e7490" text-anchor="middle">ACTIVE ZONE</text>
  <text x="240" y="115" font-size="11" fill="#0891b2" text-anchor="middle">Deploy เป็น Grid Orders</text>
  <text x="385" y="128" font-size="24" font-weight="700" fill="#06b6d4" text-anchor="end">50%</text>

  <!-- Arrow between ACTIVE and STANDBY -->
  <line x1="240" y1="157" x2="240" y2="162" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="240,165 236,158 244,158" fill="#94a3b8"/>

  <!-- STANDBY ZONE (y=168-253) -->
  <rect x="60" y="168" width="340" height="85" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="240" y="196" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">STANDBY ZONE</text>
  <text x="240" y="213" font-size="11" fill="#2563eb" text-anchor="middle">ฝาก lending / T-bill รอ</text>
  <text x="385" y="226" font-size="24" font-weight="700" fill="#3b82f6" text-anchor="end">30%</text>

  <!-- Arrow between STANDBY and FLOOR -->
  <line x1="240" y1="255" x2="240" y2="260" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="240,263 236,256 244,256" fill="#94a3b8"/>

  <!-- FLOOR ZONE (y=266-351) -->
  <rect x="60" y="266" width="340" height="85" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="294" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">FLOOR ZONE</text>
  <text x="240" y="311" font-size="11" fill="#64748b" text-anchor="middle">สำรองกรณีฉุกเฉิน ไม่แตะ</text>
  <text x="385" y="324" font-size="24" font-weight="700" fill="#94a3b8" text-anchor="end">20%</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- RIGHT SIDE: Capital flow diagram           -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Section label -->
  <text x="575" y="60" font-size="11" font-weight="700" fill="#374151" text-anchor="middle">การไหลของทุน</text>

  <!-- Top flow box (mirrors ACTIVE) -->
  <rect x="430" y="70" width="285" height="85" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="572" y="96" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">Active Zone</text>
  <text x="572" y="112" font-size="10" fill="#0891b2" text-anchor="middle">Grid fill → คืนทุน + กำไร</text>
  <text x="572" y="127" font-size="10" fill="#0891b2" text-anchor="middle">กำไรส่วนเกิน → ย้ายไป Standby</text>

  <!-- Dashed arrow from top to middle flow box -->
  <line x1="572" y1="157" x2="572" y2="165" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="572,168 568,161 576,161" fill="#06b6d4"/>

  <!-- Middle flow box (mirrors STANDBY) -->
  <rect x="430" y="168" width="285" height="85" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="572" y="194" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Standby Zone</text>
  <text x="572" y="210" font-size="10" fill="#2563eb" text-anchor="middle">กำไรส่วนเกิน → Standby</text>
  <text x="572" y="225" font-size="10" fill="#2563eb" text-anchor="middle">ฝากรับดอกเบี้ยระหว่างรอ</text>

  <!-- Dashed arrow from middle to bottom flow box -->
  <line x1="572" y1="255" x2="572" y2="263" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="572,266 568,259 576,259" fill="#3b82f6"/>

  <!-- Bottom flow box (mirrors FLOOR) -->
  <rect x="430" y="266" width="285" height="85" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="572" y="292" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Floor Zone</text>
  <text x="572" y="308" font-size="10" fill="#64748b" text-anchor="middle">Floor: ไม่แตะจนถึง give-up point</text>
  <text x="572" y="323" font-size="10" fill="#64748b" text-anchor="middle">ป้องกันการ liquidate ฉุกเฉิน</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- BOTTOM SUMMARY BAR                         -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="60" y="358" width="640" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="375" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">Active (50%) + Standby (30%) + Floor (20%) = 100% ทุนทั้งหมด</text>

  <!-- Caption -->
  <text x="380" y="430" font-size="10" fill="#94a3b8" text-anchor="middle">ไม่ต้องใช้ทุนทั้งหมดเป็น grid — Standby หาดอกเบี้ยระหว่างรอ</text>
</svg>
