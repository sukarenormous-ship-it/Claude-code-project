<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Sarabun',sans-serif">
  <!-- Background -->
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Donchian Channel (Zone) + ATR-Based Step สำหรับ Grid</text>

  <!-- ============================================================ -->
  <!-- CHART AREA: x=75..695, y=60..365 -->
  <!-- ============================================================ -->

  <!-- Y-axis -->
  <line x1="75" y1="60" x2="75" y2="365" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- X-axis -->
  <line x1="75" y1="365" x2="695" y2="365" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Y-axis label (rotated) -->
  <text x="20" y="215" font-size="10" fill="#64748b" text-anchor="middle" transform="rotate(-90,20,215)">ราคา</text>
  <!-- X-axis label -->
  <text x="385" y="390" font-size="10" fill="#64748b" text-anchor="middle">เวลา (N วัน)</text>

  <!-- ============================================================ -->
  <!-- DONCHIAN CHANNEL (violet #7c3aed) -->
  <!-- Upper band ~y=90, Lower band ~y=300 -->
  <!-- ============================================================ -->

  <!-- Fill between Donchian bands -->
  <path d="M75,93 C120,88 165,96 210,90 C255,84 300,95 345,89 C390,83 435,94 480,88 C525,82 570,93 615,87 C645,83 670,91 695,88
           L695,302 C670,307 645,299 615,305 C570,311 525,299 480,305 C435,311 390,300 345,306 C300,312 255,301 210,307 C165,313 120,302 75,308 Z"
        fill="#7c3aed" fill-opacity="0.06"/>

  <!-- Upper Donchian band -->
  <polyline points="75,93 120,88 165,96 210,90 255,84 300,95 345,89 390,83 435,94 480,88 525,82 570,93 615,87 645,83 695,88"
            fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- Lower Donchian band -->
  <polyline points="75,308 120,302 165,313 210,307 255,301 300,312 345,306 390,300 435,311 480,305 525,299 570,311 615,305 645,299 695,302"
            fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Donchian inline label boxes -->
  <!-- Upper label at x=490, y~88 -->
  <rect x="430" y="74" width="185" height="16" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="522" y="85" font-size="9" fill="#7c3aed" text-anchor="middle">Donchian High = Zone บน</text>

  <!-- Lower label at x=490, y~305 -->
  <rect x="430" y="297" width="185" height="16" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="522" y="308" font-size="9" fill="#7c3aed" text-anchor="middle">Donchian Low = Zone ล่าง</text>

  <!-- ============================================================ -->
  <!-- ATR / KELTNER CHANNEL (cyan #06b6d4) -->
  <!-- Upper step ~y=155, Lower step ~y=215, EMA ~y=185 -->
  <!-- ============================================================ -->

  <!-- Fill between ATR bands -->
  <path d="M75,158 C120,153 165,160 210,155 C255,150 300,158 345,153 C390,148 435,157 480,152 C525,147 570,156 615,151 C645,147 670,154 695,150
           L695,218 C670,222 645,215 615,219 C570,224 525,213 480,217 C435,222 390,211 345,216 C300,221 255,210 210,215 C165,220 120,212 75,216 Z"
        fill="#06b6d4" fill-opacity="0.08"/>

  <!-- Upper ATR line -->
  <polyline points="75,158 120,153 165,160 210,155 255,150 300,158 345,153 390,148 435,157 480,152 525,147 570,156 615,151 645,147 695,150"
            fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- Lower ATR line -->
  <polyline points="75,216 120,212 165,220 210,215 255,210 300,221 345,216 390,211 435,222 480,217 525,213 570,224 615,219 645,215 695,218"
            fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- EMA middle line (dashed) -->
  <polyline points="75,187 120,183 165,190 210,185 255,180 300,189 345,184 390,180 435,189 480,184 525,180 570,188 615,183 645,180 695,183"
            fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ATR inline label boxes -->
  <!-- Keltner Upper label at x=190, y=155 -->
  <rect x="88" y="140" width="192" height="16" rx="3" fill="#ecfeff" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="184" y="151" font-size="9" fill="#0e7490" text-anchor="middle">Keltner Upper (EMA+k×ATR)</text>

  <!-- Keltner Lower label at x=190, y=215 -->
  <rect x="88" y="207" width="110" height="16" rx="3" fill="#ecfeff" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="143" y="218" font-size="9" fill="#0e7490" text-anchor="middle">Keltner Lower</text>

  <!-- EMA (mid) label at x=140, y=185 -->
  <rect x="208" y="173" width="72" height="14" rx="3" fill="#f0fdff" stroke="#06b6d4" stroke-width="0.8"/>
  <text x="244" y="183" font-size="9" fill="#0e7490" text-anchor="middle">EMA (mid)</text>

  <!-- ============================================================ -->
  <!-- PRICE PATH (bold blue #1e40af) -->
  <!-- Zigzag mostly within ATR band (~y=148..220) -->
  <!-- ============================================================ -->
  <polyline points="75,182 100,160 130,195 160,158 195,210 230,165 265,205 300,155 335,215 370,170 405,208 440,162 475,218 510,168 545,205 575,160 605,210 635,172 665,202 695,175"
            fill="none" stroke="#1e40af" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ============================================================ -->
  <!-- ANNOTATIONS — LEFT SIDE -->
  <!-- ============================================================ -->

  <!-- Step size annotation: double-headed arrow x=52, y=150 to y=218 -->
  <!-- Arrow line -->
  <line x1="52" y1="153" x2="52" y2="213" stroke="#0e7490" stroke-width="1.2"/>
  <!-- Arrow heads -->
  <polygon points="52,150 49,157 55,157" fill="#0e7490"/>
  <polygon points="52,216 49,209 55,209" fill="#0e7490"/>
  <!-- Step label (two lines) -->
  <text x="47" y="178" font-size="9" fill="#0e7490" text-anchor="middle">Step</text>
  <text x="47" y="190" font-size="9" fill="#0e7490" text-anchor="middle">=ATR×k</text>

  <!-- Zone width annotation: bracket at x=40, y=90 to y=305 -->
  <line x1="40" y1="92" x2="40" y2="303" stroke="#7c3aed" stroke-width="1.2"/>
  <!-- tick marks -->
  <line x1="40" y1="92" x2="46" y2="92" stroke="#7c3aed" stroke-width="1.2"/>
  <line x1="40" y1="303" x2="46" y2="303" stroke="#7c3aed" stroke-width="1.2"/>
  <!-- Rotated label -->
  <text x="28" y="197" font-size="9" fill="#7c3aed" text-anchor="middle" transform="rotate(-90,28,197)">Zone = Donchian</text>

  <!-- ============================================================ -->
  <!-- LEGEND — y=380..400 -->
  <!-- ============================================================ -->
  <!-- Violet square + label -->
  <rect x="90" y="406" width="12" height="12" rx="2" fill="#7c3aed" opacity="0.5"/>
  <text x="107" y="416" font-size="9.5" fill="#374151">Donchian Channel (20d) — กำหนด Zone (High/Low)</text>

  <!-- Cyan square + label -->
  <rect x="430" y="406" width="12" height="12" rx="2" fill="#06b6d4" opacity="0.6"/>
  <text x="447" y="416" font-size="9.5" fill="#374151">ATR Channel — กำหนด Step Size</text>

  <!-- ============================================================ -->
  <!-- CAPTION -->
  <!-- ============================================================ -->
  <text x="380" y="435" font-size="10" fill="#94a3b8" text-anchor="middle">Donchian = ช่วง price-based (dynamic zone) · ATR = ความผันผวน-based (dynamic step)</text>
</svg>
