<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Sarabun',sans-serif">
  <!-- Background -->
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Bell Curve Grid Density — step เล็กตรงกลาง, step ใหญ่ที่ขอบ</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Horizontal baseline                        -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="70" y1="350" x2="680" y2="350" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SPARSE OUTER GRID LINES — left (x=110-270) -->
  <!-- ═══════════════════════════════════════════ -->
  <!-- Left sparse: 3 lines at ~x=130, x=180, x=240 -->
  <line x1="130" y1="105" x2="130" y2="350" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="185" y1="76" x2="185" y2="350" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="240" y1="63" x2="240" y2="350" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>

  <!-- Right sparse: 3 lines at ~x=510, x=565, x=620 -->
  <line x1="510" y1="63" x2="510" y2="350" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="565" y1="76" x2="565" y2="350" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="620" y1="105" x2="620" y2="350" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- DENSE CENTER GRID LINES (x=270 to x=480)  -->
  <!-- 10 evenly spaced: step = (480-270)/9 ≈ 23 -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="270" y1="58" x2="270" y2="350" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="293" y1="57" x2="293" y2="350" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="316" y1="57" x2="316" y2="350" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="339" y1="56" x2="339" y2="350" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="362" y1="56" x2="362" y2="350" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="375" y1="56" x2="375" y2="350" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="388" y1="56" x2="388" y2="350" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="411" y1="56" x2="411" y2="350" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="434" y1="57" x2="434" y2="350" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="457" y1="57" x2="457" y2="350" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  <line x1="480" y1="58" x2="480" y2="350" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- BELL CURVE (filled, then stroked on top)   -->
  <!-- Normal dist: peak at x=375, y=65           -->
  <!-- Baseline y=350, edges at x=110, x=640      -->
  <!-- ═══════════════════════════════════════════ -->
  <path d="
    M 110,350
    C 120,350 135,348 155,342
    C 170,337 185,325 205,308
    C 220,294 235,275 255,255
    C 270,238 285,218 305,196
    C 320,178 338,158 360,130
    C 366,122 370,114 375,105
    C 376,102 376,99 375,97
    C 374,93 373,88 372,84
    C 371,78 372,72 375,65
    C 378,72 379,78 378,84
    C 377,88 376,93 375,97
    C 374,99 374,102 375,105
    C 380,114 384,122 390,130
    C 412,158 430,178 445,196
    C 465,218 480,238 495,255
    C 515,275 530,294 545,308
    C 565,325 580,337 595,342
    C 615,348 630,350 640,350
    Z"
    fill="rgba(6,182,212,0.10)" stroke="#06b6d4" stroke-width="2" stroke-linejoin="round"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- X-AXIS LABELS (y=368)                      -->
  <!-- -2σ≈130, -1σ≈240, μ≈375, +1σ≈510, +2σ≈620 -->
  <!-- ═══════════════════════════════════════════ -->
  <text x="130" y="368" font-size="11" fill="#64748b" text-anchor="middle">-2σ</text>
  <text x="240" y="368" font-size="11" fill="#64748b" text-anchor="middle">-1σ</text>
  <text x="375" y="368" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">μ (ราคากลาง)</text>
  <text x="510" y="368" font-size="11" fill="#64748b" text-anchor="middle">+1σ</text>
  <text x="620" y="368" font-size="11" fill="#64748b" text-anchor="middle">+2σ</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ANNOTATION BOXES                           -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Center box above peak -->
  <rect x="300" y="55" width="150" height="42" rx="6" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="375" y="72" font-size="10" font-weight="700" fill="#0e7490" text-anchor="middle">Dense Zone (±1σ)</text>
  <text x="375" y="88" font-size="9" fill="#0891b2" text-anchor="middle">step เล็ก → fill บ่อย</text>

  <!-- Left sparse annotation -->
  <rect x="72" y="195" width="105" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="124" y="210" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">Sparse Zone (-2σ)</text>
  <text x="124" y="223" font-size="9" fill="#64748b" text-anchor="middle">step ใหญ่</text>

  <!-- Right sparse annotation -->
  <rect x="578" y="195" width="105" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="630" y="210" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">Sparse Zone (+2σ)</text>
  <text x="630" y="223" font-size="9" fill="#64748b" text-anchor="middle">step ใหญ่</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- STEP SIZE COMPARISON (y=385-415)           -->
  <!-- ═══════════════════════════════════════════ -->
  <!-- Outer step arrow (gray, long) -->
  <line x1="130" y1="390" x2="620" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="130,390 140,386 140,394" fill="#94a3b8"/>
  <polygon points="620,390 610,386 610,394" fill="#94a3b8"/>
  <text x="375" y="387" font-size="9" fill="#64748b" text-anchor="middle">Step ±2σ (ขอบ)</text>

  <!-- Inner step arrow (amber, short) -->
  <line x1="240" y1="408" x2="510" y2="408" stroke="#d97706" stroke-width="2"/>
  <polygon points="240,408 250,404 250,412" fill="#d97706"/>
  <polygon points="510,408 500,404 500,412" fill="#d97706"/>
  <text x="375" y="405" font-size="9" fill="#92400e" text-anchor="middle">Step ±1σ (กลาง) — 2× แคบกว่า</text>

  <!-- Caption -->
  <text x="380" y="430" font-size="10" fill="#94a3b8" text-anchor="middle">ราคาใช้เวลาในโซนกลางมากที่สุด — วาง order หนาแน่นตรงนั้น</text>
</svg>
