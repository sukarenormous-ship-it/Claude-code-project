<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Sarabun',sans-serif">
  <defs>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arrowUpBlue" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto">
      <polygon points="0 6, 4 0, 8 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowExpandL" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#7c3aed"/>
    </marker>
    <marker id="arrowExpandR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Grid Snowball 3 แบบ + DCA Stack</text>

  <!-- ===== UPPER SECTION: 3 Snowball type panels ===== -->

  <!-- Panel 1: Type 1 Simple Compound (x=30–228, cyan) -->
  <rect x="30" y="45" width="198" height="185" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="129" y="65" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">Type 1: Simple Compound</text>
  <text x="129" y="79" font-size="9" fill="#64748b" text-anchor="middle">Q เพิ่มทุก 7 วัน</text>

  <!-- Growing bars (6 bars), heights 25,35,48,65,88,119, bottom-aligned at y=200 -->
  <!-- bar x positions: 46,70,94,118,142,166, width=18 -->
  <rect x="46"  y="175" width="18" height="25"  rx="2" fill="#06b6d4"/>
  <rect x="70"  y="165" width="18" height="35"  rx="2" fill="#06b6d4"/>
  <rect x="94"  y="152" width="18" height="48"  rx="2" fill="#06b6d4"/>
  <rect x="118" y="135" width="18" height="65"  rx="2" fill="#06b6d4"/>
  <rect x="142" y="112" width="18" height="88"  rx="2" fill="#06b6d4"/>
  <rect x="166" y="81"  width="18" height="119" rx="2" fill="#06b6d4"/>
  <!-- Baseline -->
  <line x1="40" y1="200" x2="192" y2="200" stroke="#0e7490" stroke-width="1"/>
  <!-- Exponential growth curve (dashed) through bar tops -->
  <polyline points="55,175 79,165 103,152 127,135 151,112 175,81"
            fill="none" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="129" y="218" font-size="9" fill="#0891b2" text-anchor="middle">compound ราบเรียบ</text>

  <!-- Panel 2: Type 2 Profit-Triggered (x=246–514, blue) -->
  <rect x="246" y="45" width="268" height="185" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="65" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Type 2: Profit-Triggered</text>
  <text x="380" y="79" font-size="9" fill="#64748b" text-anchor="middle">Layer ใหม่เปิดเมื่อกำไรถึง threshold</text>

  <!-- Layer bars (horizontal, stacked) -->
  <!-- Layer 1 (widest): y=185-200, x=268-492 -->
  <rect x="268" y="185" width="224" height="15" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="380" y="196" font-size="8" fill="#1d4ed8" text-anchor="middle">Layer 1</text>
  <!-- Layer 2: y=165-180, x=290-472 -->
  <rect x="290" y="165" width="180" height="15" rx="3" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
  <text x="380" y="176" font-size="8" fill="#1d4ed8" text-anchor="middle">Layer 2</text>
  <!-- Layer 3: y=145-160, x=312-448 -->
  <rect x="312" y="145" width="136" height="15" rx="3" fill="#93c5fd" stroke="#3b82f6" stroke-width="1"/>
  <text x="380" y="156" font-size="8" fill="#1d4ed8" text-anchor="middle">Layer 3</text>

  <!-- Dashed arrow going up between layers -->
  <line x1="380" y1="183" x2="380" y2="162" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowUpBlue)"/>
  <text x="390" y="175" font-size="8" fill="#2563eb">profit &gt;= $500</text>

  <!-- Arrow between layer 2 and 3 -->
  <line x1="380" y1="163" x2="380" y2="142" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowUpBlue)"/>

  <text x="380" y="218" font-size="9" fill="#1d4ed8" text-anchor="middle">compound แบบ discrete (step function)</text>

  <!-- Panel 3: Type 3 Zone Upgrade (x=532–730, violet) -->
  <rect x="532" y="45" width="198" height="185" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="631" y="65" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">Type 3: Zone Upgrade</text>
  <text x="631" y="79" font-size="9" fill="#64748b" text-anchor="middle">กำไรขยาย zone coverage</text>

  <!-- Inner box (small): centered around x=631, y=155 -->
  <rect x="566" y="140" width="130" height="40" rx="4" fill="#ddd6fe" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="631" y="156" font-size="8" fill="#5b21b6" text-anchor="middle">$90k – $110k</text>
  <text x="631" y="169" font-size="7" fill="#6d28d9" text-anchor="middle">(inner zone)</text>

  <!-- Outer box (larger, dashed): x=548, y=125, w=166, h=70 -->
  <rect x="548" y="122" width="166" height="76" rx="6" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="631" y="136" font-size="7" fill="#7c3aed" text-anchor="middle">$85k – $115k</text>

  <!-- Expanding arrows left and right -->
  <line x1="564" y1="160" x2="550" y2="160" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowExpandL)"/>
  <line x1="698" y1="160" x2="712" y2="160" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowExpandR)"/>

  <text x="631" y="218" font-size="9" fill="#6d28d9" text-anchor="middle">compound แบบ expanded coverage</text>

  <!-- ===== LOWER SECTION: DCA Stack flow ===== -->
  <rect x="30" y="235" width="700" height="160" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="258" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Grid → DCA Stack</text>

  <!-- Box 1: Trading Portfolio -->
  <rect x="50" y="272" width="165" height="63" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="132" y="294" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Trading Portfolio</text>
  <text x="132" y="310" font-size="10" fill="#166534" text-anchor="middle">Grid ~$45/day</text>
  <text x="132" y="325" font-size="9" fill="#166534" text-anchor="middle">(active trading)</text>

  <!-- Arrow 1 → 2 -->
  <line x1="218" y1="303" x2="297" y2="303" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- Box 2: 70/30 split -->
  <rect x="300" y="272" width="160" height="63" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="380" y="291" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">70% Compound</text>
  <text x="380" y="306" font-size="10" fill="#166534" text-anchor="middle">30% Transfer</text>
  <text x="380" y="321" font-size="9" fill="#166534" text-anchor="middle">(split allocation)</text>

  <!-- Arrow 2 → 3 -->
  <line x1="463" y1="303" x2="542" y2="303" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- Box 3: Wealth Portfolio -->
  <rect x="545" y="272" width="165" height="63" rx="6" fill="#bbf7d0" stroke="#4ade80" stroke-width="1.5"/>
  <text x="627" y="291" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Wealth Portfolio</text>
  <text x="627" y="307" font-size="10" fill="#166534" text-anchor="middle">BTC accumulation</text>
  <text x="627" y="323" font-size="9" fill="#166534" text-anchor="middle">(passive long-term)</text>

  <!-- Bottom note inside DCA box -->
  <text x="380" y="365" font-size="9" fill="#166534" text-anchor="middle">reinvest 70% → ขยาย Grid size ·  โอน 30% → สะสม BTC ทุกเดือน</text>
  <text x="380" y="382" font-size="9" fill="#374151" text-anchor="middle">compound สองมิติ: active (grid) + passive (BTC hodl)</text>

  <!-- Caption -->
  <text x="380" y="430" font-size="10" fill="#94a3b8" text-anchor="middle">กำไรจาก Grid (active) → สะสม BTC ระยะยาว (passive) = compound สองมิติ</text>
</svg>
