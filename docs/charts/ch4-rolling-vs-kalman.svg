<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="280" fill="#f9fafb"/>
  <text x="380" y="20" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Rolling OLS β vs Kalman Filter β — ตามเวลา</text>
  <rect x="30" y="30" width="700" height="210" fill="white" stroke="#e5e7eb"/>
  <line x1="50" y1="230" x2="710" y2="230" stroke="#374151" stroke-width="1.5"/>
  <line x1="50" y1="230" x2="50" y2="50" stroke="#374151" stroke-width="1.5"/>
  <text x="380" y="248" text-anchor="middle" font-size="10" fill="#64748b">Time (bars)</text>
  <!-- β labels -->
  <text x="42" y="100" text-anchor="end" font-size="10" fill="#64748b">1.10</text>
  <text x="42" y="140" text-anchor="end" font-size="10" fill="#64748b">1.00</text>
  <text x="42" y="180" text-anchor="end" font-size="10" fill="#64748b">0.90</text>
  <line x1="48" y1="140" x2="52" y2="140" stroke="#374151" stroke-width="1"/>
  <!-- Rolling OLS β (jagged) -->
  <polyline points="50,140 80,138 110,135 120,128 130,118 140,112 150,110 160,115 170,122 180,130 190,135 200,140 210,142 220,145 230,148 240,145 250,140 260,135 270,125 280,112 290,105 300,100 310,102 320,108 330,115 340,122 350,128 360,132 370,135 380,138 390,140 400,143 410,148 420,155 430,160 440,158 450,152 460,145 470,140 480,138 490,140 500,142 510,138 520,132 530,125 540,118 550,115 560,118 570,124 580,130 590,135 600,138 610,140 620,142 630,143 640,145 650,143 660,141 670,140 680,140 695,140 710,140"
    fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Kalman β (smooth) -->
  <polyline points="50,140 80,139 110,137 140,133 170,128 200,134 230,138 260,136 290,128 320,122 350,126 380,132 410,137 440,145 470,143 500,140 530,133 560,122 590,130 620,136 650,140 680,140 710,140"
    fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <!-- Window boundary jumps for Rolling OLS (vertical marks) -->
  <line x1="150" y1="50" x2="150" y2="230" stroke="#2563eb" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="300" y1="50" x2="300" y2="230" stroke="#2563eb" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="450" y1="50" x2="450" y2="230" stroke="#2563eb" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="600" y1="50" x2="600" y2="230" stroke="#2563eb" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.3"/>
  <text x="155" y="60" font-size="9" fill="#2563eb" opacity="0.7">window</text>
  <text x="305" y="60" font-size="9" fill="#2563eb" opacity="0.7">boundary</text>
  <!-- Legend -->
  <line x1="430" y1="62" x2="460" y2="62" stroke="#2563eb" stroke-width="1.5"/>
  <text x="465" y="66" font-size="11" fill="#2563eb">Rolling OLS (window 30d) — กระโดดที่ window boundary</text>
  <line x1="430" y1="80" x2="460" y2="80" stroke="#0d9488" stroke-width="2.5"/>
  <text x="465" y="84" font-size="11" fill="#0d9488">Kalman Filter — smooth, อัปเดตทุก bar</text>
  <text x="380" y="272" text-anchor="middle" font-size="11" fill="#64748b">Kalman ลด position adjustment เพราะ β เปลี่ยนแบบค่อยเป็นค่อยไป</text>
</svg>
