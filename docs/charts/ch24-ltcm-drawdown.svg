<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs>
  <marker id="arw" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#374151"/>
  </marker>
</defs>
<rect x="2" y="2" width="756" height="276" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">LTCM — NAV (Indexed Jan 1997 = 100)</text>

<!-- Axes -->
<line x1="65" y1="235" x2="720" y2="235" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>
<line x1="65" y1="235" x2="65" y2="38" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw)"/>
<text x="725" y="238" font-size="9" fill="#6b7280">Year</text>
<text x="59" y="36" text-anchor="end" font-size="9" fill="#6b7280">NAV</text>

<!-- Y grid lines and labels -->
<line x1="63" y1="215" x2="715" y2="215" stroke="#e5e7eb" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="61" y="218" text-anchor="end" font-size="8" fill="#6b7280">50</text>
<line x1="63" y1="195" x2="715" y2="195" stroke="#e5e7eb" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="61" y="198" text-anchor="end" font-size="8" fill="#6b7280">100</text>
<line x1="63" y1="155" x2="715" y2="155" stroke="#e5e7eb" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="61" y="158" text-anchor="end" font-size="8" fill="#6b7280">150</text>
<line x1="63" y1="115" x2="715" y2="115" stroke="#e5e7eb" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="61" y="118" text-anchor="end" font-size="8" fill="#6b7280">200</text>
<line x1="63" y1="75" x2="715" y2="75" stroke="#e5e7eb" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="61" y="78" text-anchor="end" font-size="8" fill="#6b7280">250</text>

<!-- X axis labels -->
<text x="65" y="247" text-anchor="middle" font-size="8.5" fill="#6b7280">Jan'97</text>
<text x="178" y="247" text-anchor="middle" font-size="8.5" fill="#6b7280">Jul'97</text>
<text x="290" y="247" text-anchor="middle" font-size="8.5" fill="#6b7280">Jan'98</text>
<text x="403" y="247" text-anchor="middle" font-size="8.5" fill="#6b7280">Jul'98</text>
<text x="516" y="247" text-anchor="middle" font-size="8.5" fill="#6b7280">Jan'99</text>
<text x="628" y="247" text-anchor="middle" font-size="8.5" fill="#6b7280">Jul'99</text>
<text x="715" y="247" text-anchor="middle" font-size="8.5" fill="#6b7280">Jan'00</text>

<!-- Russia default marker -->
<line x1="403" y1="42" x2="403" y2="235" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.7"/>
<text x="406" y="54" font-size="8" fill="#dc2626" font-weight="700">Russia default</text>
<text x="406" y="64" font-size="8" fill="#dc2626">Aug 1998</text>

<!-- NAV trajectory (Jan 1997=100, peak~210 early 1998, crash to ~17 by year end) -->
<!-- Phase 1: Rising 1994-early 1998 -->
<polyline points="65,195 90,188 115,183 140,175 165,165 178,155 200,145 225,135 250,122 275,113 290,109"
          fill="none" stroke="#16a34a" stroke-width="2.5"/>
<!-- Phase 2: peak early 1998 ~210 → NAV=210, y = 195 - (210-100)*0.8 = 195-88 = 107 → but chart goes 50-250 range in 235-75 y space, so scale: (250-50)/(235-75)=200/160=1.25 per unit, y=235-(NAV-50)*160/200 -->
<!-- y = 235 - (NAV - 50) * 0.8 -->
<!-- NAV=100 → y=195; NAV=150 → y=155; NAV=200 → y=115; NAV=210 → y=107; NAV=50 → y=215; NAV=17 → y=228.6 -->
<polyline points="290,109 305,110 320,108 335,107 340,107"
          fill="none" stroke="#16a34a" stroke-width="2.5"/>
<!-- Crash begins -->
<polyline points="340,107 360,115 380,130 403,152 420,175 440,200 460,215 480,222 500,226 516,228"
          fill="none" stroke="#dc2626" stroke-width="2.8"/>

<!-- Red fill under crash -->
<polygon points="340,107 360,115 380,130 403,152 420,175 440,200 460,215 480,222 500,226 516,228 516,235 340,235" fill="#dc2626" opacity="0.1"/>

<!-- Recovery attempt then closure -->
<polyline points="516,228 540,225 560,227 580,229 600,228 628,227 650,228 680,229 715,229"
          fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5,3"/>

<!-- Peak annotation -->
<text x="340" y="100" text-anchor="middle" font-size="8.5" fill="#16a34a" font-weight="700">Peak ≈ 210 (Mar 1998)</text>
<!-- Crash annotation -->
<text x="530" y="222" font-size="8.5" fill="#dc2626" font-weight="700">NAV ≈ 17 (Oct 1998)</text>
<text x="530" y="232" font-size="8" fill="#dc2626">−44% in Aug alone</text>

<!-- Leverage annotation -->
<rect x="70" y="43" width="155" height="40" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="147" y="57" text-anchor="middle" font-size="8.5" fill="#dc2626" font-weight="700">Leverage: ~25:1</text>
<text x="147" y="69" text-anchor="middle" font-size="8" fill="#dc2626">4% move → wipes equity</text>
<text x="147" y="79" text-anchor="middle" font-size="8" fill="#dc2626">VaR: $35M → Actual: $553M</text>

<!-- Legend -->
<line x1="560" y1="262" x2="580" y2="262" stroke="#16a34a" stroke-width="2.5"/>
<text x="584" y="266" font-size="9" fill="#374151">Growth 1997–early 1998</text>
<line x1="390" y1="262" x2="410" y2="262" stroke="#dc2626" stroke-width="2.8"/>
<text x="414" y="266" font-size="9" fill="#374151">Collapse (Russia default)</text>
<line x1="200" y1="262" x2="220" y2="262" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5,3"/>
<text x="224" y="266" font-size="9" fill="#374151">Managed liquidation</text>
</svg>
