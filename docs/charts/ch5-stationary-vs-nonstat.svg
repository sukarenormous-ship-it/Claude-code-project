<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="280" fill="#f9fafb"/>
  <text x="380" y="20" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Stationary vs Non-Stationary Time Series</text>
  <!-- Panel 1: I(1) random walk -->
  <rect x="10" y="30" width="230" height="200" fill="white" stroke="#e5e7eb"/>
  <text x="125" y="50" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">I(1) Random Walk</text>
  <line x1="25" y1="220" x2="225" y2="220" stroke="#374151" stroke-width="1"/>
  <line x1="25" y1="220" x2="25" y2="60" stroke="#374151" stroke-width="1"/>
  <polyline points="25,150 40,148 55,140 70,128 85,112 100,95 115,88 130,80 145,92 160,100 175,112 190,105 205,92 220,85"
    fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="125" y="245" text-anchor="middle" font-size="10" fill="#dc2626">Drift, ไม่กลับค่ากลาง</text>
  <text x="125" y="260" text-anchor="middle" font-size="10" fill="#64748b">ADF: fail (p&gt;0.10)</text>
  <!-- Panel 2: I(1)+drift -->
  <rect x="265" y="30" width="230" height="200" fill="white" stroke="#e5e7eb"/>
  <text x="380" y="50" text-anchor="middle" font-size="11" fill="#d97706" font-weight="700">I(1) + Drift</text>
  <line x1="280" y1="220" x2="475" y2="220" stroke="#374151" stroke-width="1"/>
  <line x1="280" y1="220" x2="280" y2="60" stroke="#374151" stroke-width="1"/>
  <polyline points="280,200 300,190 320,178 340,165 360,155 380,140 400,130 420,118 440,105 460,95 480,84"
    fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="245" text-anchor="middle" font-size="10" fill="#d97706">Trend ขึ้นต่อเนื่อง</text>
  <text x="380" y="260" text-anchor="middle" font-size="10" fill="#64748b">ADF: fail (p&gt;0.10)</text>
  <!-- Panel 3: I(0) OU stationary -->
  <rect x="520" y="30" width="230" height="200" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="635" y="50" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700">I(0) OU Process ✓</text>
  <line x1="535" y1="220" x2="735" y2="220" stroke="#374151" stroke-width="1"/>
  <line x1="535" y1="220" x2="535" y2="60" stroke="#374151" stroke-width="1"/>
  <line x1="535" y1="140" x2="735" y2="140" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polyline points="535,140 555,128 575,112 595,100 615,108 635,122 655,138 675,148 695,140 715,130 735,136"
    fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="635" y="245" text-anchor="middle" font-size="10" fill="#16a34a">กลับค่ากลาง θ เสมอ</text>
  <text x="635" y="260" text-anchor="middle" font-size="10" fill="#16a34a">ADF: pass (p&lt;0.05) ✓</text>
  <text x="380" y="278" text-anchor="middle" font-size="11" fill="#64748b">เฉพาะ I(0) เท่านั้นที่ trade ได้อย่างมีระบบ</text>
</svg>
