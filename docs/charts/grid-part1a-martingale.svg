<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">
<rect width="760" height="420" fill="#f8fafc" rx="6"/>
<text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Soft Martingale vs Hard Martingale vs Equal Weight</text>

<!-- Y-axis -->
<line x1="60" y1="50" x2="60" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
<!-- X-axis -->
<line x1="60" y1="340" x2="720" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
<text x="25" y="200" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90,25,200)">ขนาด Position</text>
<text x="390" y="375" text-anchor="middle" font-size="11" fill="#64748b">Grid Level (ยิ่งลึก = ราคายิ่งต่ำ)</text>

<!-- Y gridlines -->
<line x1="58" y1="260" x2="720" y2="260" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="58" y1="180" x2="720" y2="180" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="58" y1="100" x2="720" y2="100" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Y labels -->
<text x="52" y="344" text-anchor="end" font-size="10" fill="#94a3b8">1×</text>
<text x="52" y="264" text-anchor="end" font-size="10" fill="#94a3b8">2×</text>
<text x="52" y="184" text-anchor="end" font-size="10" fill="#94a3b8">4×</text>
<text x="52" y="104" text-anchor="end" font-size="10" fill="#94a3b8">8×</text>

<!-- X labels (4 levels) -->
<text x="160" y="358" text-anchor="middle" font-size="11" fill="#64748b">Level 1</text>
<text x="300" y="358" text-anchor="middle" font-size="11" fill="#64748b">Level 2</text>
<text x="440" y="358" text-anchor="middle" font-size="11" fill="#64748b">Level 3</text>
<text x="580" y="358" text-anchor="middle" font-size="11" fill="#64748b">Level 4</text>

<!-- Hard Martingale bars (red) — 1x, 2x, 4x, 8x -->
<rect x="100" y="260" width="40" height="80" fill="#dc2626" rx="2" fill-opacity="0.8"/>
<rect x="240" y="180" width="40" height="160" fill="#dc2626" rx="2" fill-opacity="0.8"/>
<rect x="380" y="100" width="40" height="240" fill="#dc2626" rx="2" fill-opacity="0.8"/>
<rect x="520" y="60" width="40" height="280" fill="#dc2626" rx="2" fill-opacity="0.8"/>

<!-- Soft Martingale bars (cyan) — 1x, 1.4x, 2x, 2.8x (r≈1.4) -->
<rect x="150" y="262" width="40" height="78" fill="#06b6d4" rx="2" fill-opacity="0.9"/>
<rect x="290" y="227" width="40" height="113" fill="#06b6d4" rx="2" fill-opacity="0.9"/>
<rect x="430" y="180" width="40" height="160" fill="#06b6d4" rx="2" fill-opacity="0.9"/>
<rect x="570" y="118" width="40" height="222" fill="#06b6d4" rx="2" fill-opacity="0.9"/>

<!-- Equal Weight bars (gray) — 1x, 1x, 1x, 1x -->
<rect x="200" y="302" width="30" height="38" fill="#94a3b8" rx="2"/>
<rect x="340" y="302" width="30" height="38" fill="#94a3b8" rx="2"/>
<rect x="480" y="302" width="30" height="38" fill="#94a3b8" rx="2"/>
<rect x="620" y="302" width="30" height="38" fill="#94a3b8" rx="2"/>

<!-- Sizes labels on top of bars -->
<text x="120" y="254" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="700">1×</text>
<text x="260" y="174" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="700">2×</text>
<text x="400" y="94" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="700">4×</text>
<text x="540" y="54" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="700">8×</text>

<text x="170" y="256" text-anchor="middle" font-size="10" fill="#0891b2" font-weight="700">1×</text>
<text x="310" y="220" text-anchor="middle" font-size="10" fill="#0891b2" font-weight="700">1.4×</text>
<text x="450" y="174" text-anchor="middle" font-size="10" fill="#0891b2" font-weight="700">2×</text>
<text x="590" y="112" text-anchor="middle" font-size="10" fill="#0891b2" font-weight="700">2.8×</text>

<text x="215" y="296" text-anchor="middle" font-size="10" fill="#475569" font-weight="700">1×</text>
<text x="355" y="296" text-anchor="middle" font-size="10" fill="#475569" font-weight="700">1×</text>
<text x="495" y="296" text-anchor="middle" font-size="10" fill="#475569" font-weight="700">1×</text>
<text x="635" y="296" text-anchor="middle" font-size="10" fill="#475569" font-weight="700">1×</text>

<!-- Legend -->
<rect x="90" y="385" width="16" height="12" fill="#dc2626" rx="2"/>
<text x="112" y="395" font-size="10" fill="#0f172a">Hard Martingale (r=2) — 1,2,4,8× — Capital เพิ่มแบบ exponential ⚠️</text>
<rect x="340" y="385" width="16" height="12" fill="#06b6d4" rx="2"/>
<text x="362" y="395" font-size="10" fill="#0f172a">Soft Martingale (r=1.4) — ค่อยๆ เพิ่ม ✓</text>
<rect x="570" y="385" width="16" height="12" fill="#94a3b8" rx="2"/>
<text x="592" y="395" font-size="10" fill="#0f172a">Equal Weight — safe baseline</text>
</svg>
