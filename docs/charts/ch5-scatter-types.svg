<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="300" fill="#f9fafb"/>
  <text x="380" y="20" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Scatter Types — อ่านก่อน Run Test</text>
  <!-- Panel 1: Good linear tight -->
  <rect x="10" y="30" width="170" height="180" fill="white" stroke="#16a34a" stroke-width="2"/>
  <text x="95" y="50" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700">✓ เส้นตรงแน่น</text>
  <line x1="25" y1="200" x2="165" y2="200" stroke="#374151" stroke-width="1"/>
  <line x1="25" y1="200" x2="25" y2="65" stroke="#374151" stroke-width="1"/>
  <line x1="30" y1="185" x2="155" y2="75" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="40" cy="178" r="3" fill="#0d9488" opacity="0.8"/>
  <circle cx="55" cy="165" r="3" fill="#0d9488" opacity="0.8"/>
  <circle cx="70" cy="155" r="3" fill="#0d9488" opacity="0.8"/>
  <circle cx="85" cy="143" r="3" fill="#0d9488" opacity="0.8"/>
  <circle cx="100" cy="132" r="3" fill="#0d9488" opacity="0.8"/>
  <circle cx="115" cy="118" r="3" fill="#0d9488" opacity="0.8"/>
  <circle cx="130" cy="108" r="3" fill="#0d9488" opacity="0.8"/>
  <circle cx="145" cy="95" r="3" fill="#0d9488" opacity="0.8"/>
  <circle cx="62" cy="160" r="3" fill="#0d9488" opacity="0.8"/>
  <circle cx="108" cy="125" r="3" fill="#0d9488" opacity="0.8"/>
  <text x="95" y="228" text-anchor="middle" font-size="10" fill="#16a34a">พร้อม trade</text>
  <text x="95" y="242" text-anchor="middle" font-size="10" fill="#64748b">ρ สูง, R² &gt; 0.85</text>
  <!-- Panel 2: Fan / heteroskedastic -->
  <rect x="200" y="30" width="170" height="180" fill="white" stroke="#d97706" stroke-width="2"/>
  <text x="285" y="50" text-anchor="middle" font-size="11" fill="#d97706" font-weight="700">⚠ Fan shape</text>
  <line x1="215" y1="200" x2="355" y2="200" stroke="#374151" stroke-width="1"/>
  <line x1="215" y1="200" x2="215" y2="65" stroke="#374151" stroke-width="1"/>
  <line x1="220" y1="185" x2="345" y2="80" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="225" cy="180" r="3" fill="#374151" opacity="0.7"/>
  <circle cx="240" cy="172" r="3" fill="#374151" opacity="0.7"/>
  <circle cx="260" cy="160" r="3.5" fill="#374151" opacity="0.7"/>
  <circle cx="275" cy="148" r="4" fill="#374151" opacity="0.7"/>
  <circle cx="295" cy="132" r="4.5" fill="#374151" opacity="0.7"/>
  <circle cx="315" cy="110" r="5" fill="#374151" opacity="0.7"/>
  <circle cx="335" cy="92" r="5.5" fill="#374151" opacity="0.7"/>
  <text x="285" y="228" text-anchor="middle" font-size="10" fill="#d97706">Heteroskedastic</text>
  <text x="285" y="242" text-anchor="middle" font-size="10" fill="#64748b">Var(ε) เปลี่ยนตามระดับ</text>
  <!-- Panel 3: Non-linear curve -->
  <rect x="390" y="30" width="170" height="180" fill="white" stroke="#dc2626" stroke-width="2"/>
  <text x="475" y="50" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">✗ Non-linear</text>
  <line x1="405" y1="200" x2="545" y2="200" stroke="#374151" stroke-width="1"/>
  <line x1="405" y1="200" x2="405" y2="65" stroke="#374151" stroke-width="1"/>
  <circle cx="415" cy="185" r="3" fill="#374151" opacity="0.7"/>
  <circle cx="430" cy="175" r="3" fill="#374151" opacity="0.7"/>
  <circle cx="445" cy="162" r="3" fill="#374151" opacity="0.7"/>
  <circle cx="462" cy="145" r="3" fill="#374151" opacity="0.7"/>
  <circle cx="478" cy="132" r="3" fill="#374151" opacity="0.7"/>
  <circle cx="495" cy="122" r="3" fill="#374151" opacity="0.7"/>
  <circle cx="512" cy="118" r="3" fill="#374151" opacity="0.7"/>
  <circle cx="528" cy="118" r="3" fill="#374151" opacity="0.7"/>
  <circle cx="540" cy="120" r="3" fill="#374151" opacity="0.7"/>
  <path d="M415,185 Q478,120 542,120" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="475" y="228" text-anchor="middle" font-size="10" fill="#dc2626">Relationship ไม่ใช่เส้นตรง</text>
  <text x="475" y="242" text-anchor="middle" font-size="10" fill="#64748b">OLS β ผิดพลาด</text>
  <!-- Panel 4: Scattered cloud -->
  <rect x="580" y="30" width="170" height="180" fill="white" stroke="#dc2626" stroke-width="2"/>
  <text x="665" y="50" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">✗ Cloud ฟุ้ง</text>
  <line x1="595" y1="200" x2="735" y2="200" stroke="#374151" stroke-width="1"/>
  <line x1="595" y1="200" x2="595" y2="65" stroke="#374151" stroke-width="1"/>
  <circle cx="610" cy="180" r="3" fill="#374151" opacity="0.6"/>
  <circle cx="625" cy="98" r="3" fill="#374151" opacity="0.6"/>
  <circle cx="645" cy="162" r="3" fill="#374151" opacity="0.6"/>
  <circle cx="658" cy="125" r="3" fill="#374151" opacity="0.6"/>
  <circle cx="670" cy="145" r="3" fill="#374151" opacity="0.6"/>
  <circle cx="685" cy="88" r="3" fill="#374151" opacity="0.6"/>
  <circle cx="698" cy="170" r="3" fill="#374151" opacity="0.6"/>
  <circle cx="714" cy="112" r="3" fill="#374151" opacity="0.6"/>
  <circle cx="726" cy="148" r="3" fill="#374151" opacity="0.6"/>
  <text x="665" y="228" text-anchor="middle" font-size="10" fill="#dc2626">ρ ต่ำ — ไม่มี relationship</text>
  <text x="665" y="242" text-anchor="middle" font-size="10" fill="#64748b">ทิ้ง pair นี้</text>
  <text x="380" y="285" text-anchor="middle" font-size="11" fill="#64748b">เฉพาะ "เส้นตรงแน่น" เท่านั้นที่ควรเข้า cointegration test ต่อ</text>
</svg>
