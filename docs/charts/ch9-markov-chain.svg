<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs>
  <marker id="arw" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
  </marker>
  <marker id="arwG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
  </marker>
  <marker id="arwA" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
  </marker>
  <marker id="arwR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
  </marker>
</defs>

<rect x="2" y="2" width="756" height="296" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="380" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3-State Markov Chain: Regime Transitions</text>

<!-- Normal circle -->
<circle cx="150" cy="155" r="55" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="150" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Normal</text>
<text x="150" y="167" text-anchor="middle" font-size="10" fill="#166534">κ=2.0, σ=0.002</text>
<text x="150" y="180" text-anchor="middle" font-size="10" fill="#166534">half-life ~8h</text>

<!-- Stressed circle -->
<circle cx="380" cy="155" r="55" fill="#fef9c3" stroke="#d97706" stroke-width="2.5"/>
<text x="380" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Stressed</text>
<text x="380" y="167" text-anchor="middle" font-size="10" fill="#92400e">κ=0.8, σ=0.006</text>
<text x="380" y="180" text-anchor="middle" font-size="10" fill="#92400e">half-life ~21h</text>

<!-- Broken circle -->
<circle cx="610" cy="155" r="55" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="610" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Broken</text>
<text x="610" y="167" text-anchor="middle" font-size="10" fill="#991b1b">κ≈0, σ=0.010</text>
<text x="610" y="180" text-anchor="middle" font-size="10" fill="#991b1b">half-life = ∞</text>

<!-- Self-loops -->
<!-- Normal self-loop (top) -->
<path d="M 130 100 Q 150 55 170 100" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arwG)"/>
<text x="150" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">0.94</text>

<!-- Stressed self-loop (top) -->
<path d="M 360 100 Q 380 55 400 100" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arwA)"/>
<text x="380" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#d97706">0.50</text>

<!-- Broken self-loop (top) -->
<path d="M 590 100 Q 610 55 630 100" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arwR)"/>
<text x="610" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">0.75</text>

<!-- Normal → Stressed (right arrow, upper path) -->
<path d="M 204 140 Q 280 115 325 140" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arwA)"/>
<text x="263" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#d97706">0.05</text>

<!-- Stressed → Normal (left arrow, lower path) -->
<path d="M 325 168 Q 280 195 204 170" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arwG)"/>
<text x="263" y="198" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">0.40</text>

<!-- Stressed → Broken (right arrow, upper path) -->
<path d="M 434 140 Q 510 115 555 140" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arwR)"/>
<text x="493" y="118" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">0.10</text>

<!-- Broken → Stressed (left arrow, lower path) -->
<path d="M 555 168 Q 510 195 434 170" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arwA)"/>
<text x="493" y="198" text-anchor="middle" font-size="10" font-weight="700" fill="#d97706">0.20</text>

<!-- Normal → Broken (curved arc below) -->
<path d="M 200 185 Q 380 255 560 185" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arwR)"/>
<text x="380" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">0.01</text>

<!-- Broken → Normal (curved arc, slightly different) -->
<path d="M 560 175 Q 380 238 200 178" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arwG)"/>
<text x="380" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">0.05</text>

<!-- Legend at bottom -->
<rect x="30" y="272" width="12" height="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="46" y="281" font-size="9" fill="#374151">Normal: เทรดเต็ม size</text>
<rect x="195" y="272" width="12" height="10" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/>
<text x="211" y="281" font-size="9" fill="#374151">Stressed: ลด size 50%</text>
<rect x="360" y="272" width="12" height="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="376" y="281" font-size="9" fill="#374151">Broken: หยุดเทรดทันที</text>
<text x="520" y="281" font-size="9" fill="#374151">ตัวเลข = P(transition ต่อวัน)</text>
</svg>
