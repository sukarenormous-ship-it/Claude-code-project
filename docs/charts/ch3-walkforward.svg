<svg viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="260" fill="#f9fafb"/>
  <text x="380" y="22" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700">Walk-Forward Calibration — Rolling Windows</text>
  <line x1="50" y1="215" x2="740" y2="215" stroke="#374151" stroke-width="2"/>
  <text x="50" y="232" text-anchor="middle" font-size="10" fill="#64748b">Day 1</text>
  <text x="230" y="232" text-anchor="middle" font-size="10" fill="#64748b">Day 90</text>
  <text x="300" y="232" text-anchor="middle" font-size="10" fill="#64748b">Day 120</text>
  <text x="415" y="232" text-anchor="middle" font-size="10" fill="#64748b">Day 180</text>
  <text x="485" y="232" text-anchor="middle" font-size="10" fill="#64748b">Day 210</text>
  <text x="600" y="232" text-anchor="middle" font-size="10" fill="#64748b">Day 270</text>
  <text x="670" y="232" text-anchor="middle" font-size="10" fill="#64748b">Day 300</text>
  <line x1="230" y1="213" x2="230" y2="218" stroke="#374151" stroke-width="1"/>
  <line x1="300" y1="213" x2="300" y2="218" stroke="#374151" stroke-width="1"/>
  <line x1="415" y1="213" x2="415" y2="218" stroke="#374151" stroke-width="1"/>
  <line x1="485" y1="213" x2="485" y2="218" stroke="#374151" stroke-width="1"/>
  <line x1="600" y1="213" x2="600" y2="218" stroke="#374151" stroke-width="1"/>
  <line x1="670" y1="213" x2="670" y2="218" stroke="#374151" stroke-width="1"/>
  <!-- Window 1 -->
  <rect x="50" y="40" width="180" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="140" y="62" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700">Train 1 (day 1–90)</text>
  <rect x="230" y="40" width="70" height="34" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="3"/>
  <text x="265" y="62" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700">Test 1</text>
  <!-- Window 2 -->
  <rect x="120" y="88" width="180" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="210" y="110" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700">Train 2 (day 31–120)</text>
  <rect x="300" y="88" width="70" height="34" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="3"/>
  <text x="335" y="110" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700">Test 2</text>
  <!-- Window 3 -->
  <rect x="235" y="136" width="180" height="34" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="3"/>
  <text x="325" y="158" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="700">Train 3 (day 61–150)</text>
  <rect x="415" y="136" width="70" height="34" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="3"/>
  <text x="450" y="158" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="700">Test 3</text>
  <!-- Slide arrows -->
  <text x="115" y="36" text-anchor="middle" font-size="10" fill="#64748b">← slide 30d →</text>
  <text x="230" y="84" text-anchor="middle" font-size="10" fill="#64748b">← slide 30d →</text>
  <!-- Legend -->
  <rect x="500" y="80" width="14" height="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="2"/>
  <text x="520" y="91" font-size="11" fill="#374151">Train (90d) — fit OU parameters</text>
  <rect x="500" y="105" width="14" height="13" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="2"/>
  <text x="520" y="116" font-size="11" fill="#374151">Test (30d) — apply &amp; record PnL</text>
  <text x="380" y="250" text-anchor="middle" font-size="11" fill="#64748b">เลื่อน slide ทีละ test_days — ลำดับเวลาต้องเรียงเสมอ ห้าม shuffle</text>
</svg>
