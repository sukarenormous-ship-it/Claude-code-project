<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">
<rect width="760" height="440" fill="#f8fafc" rx="6"/>

<!-- Title -->
<text x="380" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Grid Trading — กลไกพื้นฐาน (Buy Low, Sell High ซ้ำๆ)</text>

<!-- Y-axis -->
<line x1="90" y1="50" x2="90" y2="370" stroke="#94a3b8" stroke-width="1.5"/>
<!-- X-axis -->
<line x1="90" y1="370" x2="700" y2="370" stroke="#94a3b8" stroke-width="1.5"/>
<!-- Y label -->
<text x="22" y="215" text-anchor="middle" font-size="12" fill="#64748b" transform="rotate(-90,22,215)">ราคา (Price)</text>
<!-- X label -->
<text x="395" y="405" text-anchor="middle" font-size="12" fill="#64748b">เวลา (Time)</text>

<!-- Grid level lines (5 levels) -->
<line x1="90" y1="100" x2="700" y2="100" stroke="#fca5a5" stroke-width="1" stroke-dasharray="6,4"/>
<line x1="90" y1="160" x2="700" y2="160" stroke="#fca5a5" stroke-width="1" stroke-dasharray="6,4"/>
<line x1="90" y1="220" x2="700" y2="220" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,4"/>
<line x1="90" y1="280" x2="700" y2="280" stroke="#86efac" stroke-width="1" stroke-dasharray="6,4"/>
<line x1="90" y1="340" x2="700" y2="340" stroke="#86efac" stroke-width="1" stroke-dasharray="6,4"/>

<!-- Y labels -->
<text x="82" y="104" text-anchor="end" font-size="11" fill="#dc2626">$110</text>
<text x="82" y="164" text-anchor="end" font-size="11" fill="#dc2626">$105</text>
<text x="82" y="224" text-anchor="end" font-size="11" fill="#06b6d4" font-weight="700">$100</text>
<text x="82" y="284" text-anchor="end" font-size="11" fill="#16a34a">$95</text>
<text x="82" y="344" text-anchor="end" font-size="11" fill="#16a34a">$90</text>

<!-- SELL zone label -->
<rect x="660" y="80" width="80" height="60" fill="#fef2f2" rx="4" stroke="#fca5a5" stroke-width="1"/>
<text x="700" y="106" text-anchor="middle" font-size="10" fill="#dc2626" font-weight="700">SELL</text>
<text x="700" y="120" text-anchor="middle" font-size="9" fill="#dc2626">zone</text>

<!-- BUY zone label -->
<rect x="660" y="260" width="80" height="60" fill="#f0fdf4" rx="4" stroke="#86efac" stroke-width="1"/>
<text x="700" y="285" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="700">BUY</text>
<text x="700" y="299" text-anchor="middle" font-size="9" fill="#16a34a">zone</text>

<!-- Current price label -->
<text x="95" y="215" font-size="10" fill="#06b6d4" font-weight="700">ราคาปัจจุบัน</text>

<!-- Price path (zigzag) -->
<polyline points="90,220 155,280 220,160 305,340 390,100 470,280 545,160 620,280 680,220"
          fill="none" stroke="#1e40af" stroke-width="2.5" stroke-linejoin="round"/>

<!-- BUY fills (green circles) -->
<circle cx="155" cy="280" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
<circle cx="305" cy="340" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
<circle cx="470" cy="280" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
<circle cx="620" cy="280" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>

<!-- SELL fills (red circles) -->
<circle cx="220" cy="160" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<circle cx="390" cy="100" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<circle cx="545" cy="160" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>

<!-- Profit arrows (BUY→SELL pair) -->
<path d="M 162,278 C 200,220 215,170 213,165" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
<text x="205" y="222" font-size="10" fill="#d97706" font-weight="700">+$10</text>

<path d="M 312,338 C 355,250 380,115 383,108" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
<text x="360" y="222" font-size="10" fill="#d97706" font-weight="700">+$20</text>

<!-- Buy/Sell labels -->
<text x="155" y="302" text-anchor="middle" font-size="9" fill="#16a34a" font-weight="600">BUY</text>
<text x="305" y="362" text-anchor="middle" font-size="9" fill="#16a34a" font-weight="600">BUY</text>
<text x="220" y="150" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="600">SELL</text>
<text x="390" y="90" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="600">SELL</text>

<!-- Step annotation -->
<line x1="700" y1="160" x2="700" y2="220" stroke="#06b6d4" stroke-width="2" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
<text x="745" y="195" text-anchor="middle" font-size="10" fill="#06b6d4" font-weight="700">Step</text>
<text x="745" y="207" text-anchor="middle" font-size="10" fill="#06b6d4">= $5</text>

<defs>
  <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
    <path d="M 0 0 L 6 3 L 0 6 z" fill="#06b6d4"/>
  </marker>
</defs>

<!-- Caption -->
<text x="380" y="430" text-anchor="middle" font-size="11" fill="#94a3b8">แต่ละรอบ: ซื้อที่ grid level ล่าง → ขายที่ grid level บน = กำไร 1 step ต่อรอบ</text>
</svg>
