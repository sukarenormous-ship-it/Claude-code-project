<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Sarabun',sans-serif">
  <!-- Background -->
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Position Size เปรียบเทียบ — Hard vs Soft Martingale vs Equal Weight</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CHART AREA: x=80-700, y=55-330            -->
  <!-- Y-axis: 0× at y=330, 8× at y=330-224=106  -->
  <!-- Scale: 1× = 28px                           -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Y-axis -->
  <line x1="80" y1="55" x2="80" y2="330" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- X-axis baseline -->
  <line x1="80" y1="330" x2="700" y2="330" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Horizontal gridlines (dashed, very light) -->
  <!-- 2× → y=330-56=274 -->
  <line x1="80" y1="274" x2="700" y2="274" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 4× → y=330-112=218 -->
  <line x1="80" y1="218" x2="700" y2="218" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 6× → y=330-168=162 -->
  <line x1="80" y1="162" x2="700" y2="162" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 8× → y=330-224=106 -->
  <line x1="80" y1="106" x2="700" y2="106" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Y-axis labels -->
  <text x="74" y="334" font-size="9" fill="#64748b" text-anchor="end">0×</text>
  <text x="74" y="278" font-size="9" fill="#64748b" text-anchor="end">2×</text>
  <text x="74" y="222" font-size="9" fill="#64748b" text-anchor="end">4×</text>
  <text x="74" y="166" font-size="9" fill="#64748b" text-anchor="end">6×</text>
  <text x="74" y="110" font-size="9" fill="#64748b" text-anchor="end">8×</text>
  <!-- Y-axis title -->
  <text x="20" y="195" font-size="10" fill="#374151" text-anchor="middle" transform="rotate(-90,20,195)">Position Size (×)</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- GROUP LAYOUT                               -->
  <!-- 4 groups, each group = 3 bars×28 + 2×4gap -->
  <!-- Group width = 84+8 = 92px                 -->
  <!-- Total groups span = 4×92 = 368            -->
  <!-- Center: x=80 + (620-368)/2 = 80+126 = 206 -->
  <!-- Group centers at x=206+46, 206+138, 206+230, 206+322 -->
  <!--  = 252, 344, 436, 528                     -->
  <!-- Group left edges: 252-46=206, 344-46=298, 436-46=390, 528-46=482 -->
  <!-- Bar order: Hard(red), Soft(cyan), Equal(gray) -->
  <!-- Bar positions within group (left edge):    -->
  <!--  Bar1: +0, Bar2: +32, Bar3: +64           -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Scale: 1× = 28px, bars start at y=330     -->
  <!-- GROUP 1 — Level 1 -->
  <!-- Hard: 1× = 28px tall → top y=302 -->
  <rect x="152" y="302" width="28" height="28" fill="#dc2626" rx="2"/>
  <text x="166" y="299" font-size="9" fill="#dc2626" text-anchor="middle">1×</text>
  <!-- Soft: 1× = 28px -->
  <rect x="184" y="302" width="28" height="28" fill="#06b6d4" rx="2"/>
  <text x="198" y="299" font-size="9" fill="#06b6d4" text-anchor="middle">1×</text>
  <!-- Equal: 1× = 28px -->
  <rect x="216" y="302" width="28" height="28" fill="#94a3b8" rx="2"/>
  <text x="230" y="299" font-size="9" fill="#94a3b8" text-anchor="middle">1×</text>

  <!-- GROUP 2 — Level 2 -->
  <!-- Hard: 2× = 56px → top y=274 -->
  <rect x="277" y="274" width="28" height="56" fill="#dc2626" rx="2"/>
  <text x="291" y="271" font-size="9" fill="#dc2626" text-anchor="middle">2×</text>
  <!-- Soft: 1.4× = 39px → top y=291 -->
  <rect x="309" y="291" width="28" height="39" fill="#06b6d4" rx="2"/>
  <text x="323" y="288" font-size="9" fill="#06b6d4" text-anchor="middle">1.4×</text>
  <!-- Equal: 1× = 28px -->
  <rect x="341" y="302" width="28" height="28" fill="#94a3b8" rx="2"/>
  <text x="355" y="299" font-size="9" fill="#94a3b8" text-anchor="middle">1×</text>

  <!-- GROUP 3 — Level 3 -->
  <!-- Hard: 4× = 112px → top y=218 -->
  <rect x="402" y="218" width="28" height="112" fill="#dc2626" rx="2"/>
  <text x="416" y="215" font-size="9" fill="#dc2626" text-anchor="middle">4×</text>
  <!-- Soft: 2× = 56px → top y=274 -->
  <rect x="434" y="274" width="28" height="56" fill="#06b6d4" rx="2"/>
  <text x="448" y="271" font-size="9" fill="#06b6d4" text-anchor="middle">2×</text>
  <!-- Equal: 1× = 28px -->
  <rect x="466" y="302" width="28" height="28" fill="#94a3b8" rx="2"/>
  <text x="480" y="299" font-size="9" fill="#94a3b8" text-anchor="middle">1×</text>

  <!-- GROUP 4 — Level 4 -->
  <!-- Hard: 8× = 224px → top y=106 -->
  <rect x="527" y="106" width="28" height="224" fill="#dc2626" rx="2"/>
  <text x="541" y="103" font-size="9" fill="#dc2626" text-anchor="middle">8×</text>
  <!-- Soft: 2.8× = 78px → top y=252 -->
  <rect x="559" y="252" width="28" height="78" fill="#06b6d4" rx="2"/>
  <text x="573" y="249" font-size="9" fill="#06b6d4" text-anchor="middle">2.8×</text>
  <!-- Equal: 1× = 28px -->
  <rect x="591" y="302" width="28" height="28" fill="#94a3b8" rx="2"/>
  <text x="605" y="299" font-size="9" fill="#94a3b8" text-anchor="middle">1×</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- X-AXIS LEVEL LABELS                        -->
  <!-- Group centers: 184, 309, 434, 559          -->
  <!-- ═══════════════════════════════════════════ -->
  <text x="198" y="344" font-size="10" fill="#374151" text-anchor="middle" font-weight="600">Level 1</text>
  <text x="198" y="356" font-size="9" fill="#64748b" text-anchor="middle">($100k)</text>
  <text x="323" y="344" font-size="10" fill="#374151" text-anchor="middle" font-weight="600">Level 2</text>
  <text x="323" y="356" font-size="9" fill="#64748b" text-anchor="middle">($95k)</text>
  <text x="448" y="344" font-size="10" fill="#374151" text-anchor="middle" font-weight="600">Level 3</text>
  <text x="448" y="356" font-size="9" fill="#64748b" text-anchor="middle">($90k)</text>
  <text x="573" y="344" font-size="10" fill="#374151" text-anchor="middle" font-weight="600">Level 4</text>
  <text x="573" y="356" font-size="9" fill="#64748b" text-anchor="middle">($85k)</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LEGEND (y=372-390)                         -->
  <!-- ═══════════════════════════════════════════ -->
  <!-- Hard Martingale -->
  <rect x="80" y="372" width="12" height="12" fill="#dc2626" rx="2"/>
  <text x="97" y="383" font-size="9" fill="#374151">Hard Martingale (r=2) — exponential risk ⚠</text>
  <!-- Soft Martingale -->
  <rect x="310" y="372" width="12" height="12" fill="#06b6d4" rx="2"/>
  <text x="327" y="383" font-size="9" fill="#374151">Soft Martingale (r=1.4) — แนะนำ ✓</text>
  <!-- Equal Weight -->
  <rect x="535" y="372" width="12" height="12" fill="#94a3b8" rx="2"/>
  <text x="552" y="383" font-size="9" fill="#374151">Equal Weight — ปลอดภัย baseline</text>

  <!-- Caption -->
  <text x="380" y="430" font-size="10" fill="#94a3b8" text-anchor="middle">Soft Martingale เพิ่ม position แบบควบคุมได้ — ไม่ระเบิดเหมือน Hard Martingale</text>
</svg>
