<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">
<rect width="760" height="420" fill="#f8fafc" rx="6"/>
<text x="380" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Donchian Channel (Range) + Keltner Channel (Step) สำหรับ Grid</text>

<!-- Axes -->
<line x1="70" y1="50" x2="70" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="70" y1="360" x2="700" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
<text x="25" y="210" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90,25,210)">ราคา (Price)</text>
<text x="385" y="395" text-anchor="middle" font-size="11" fill="#64748b">เวลา (N วันย้อนหลัง)</text>

<!-- Donchian Channel (20-day high/low) — wide band for ZONE -->
<path d="M 70,90 C 120,88 200,85 280,88 C 360,92 440,89 520,86 C 600,83 680,85 700,84"
      fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,3"/>
<path d="M 70,290 C 120,295 200,300 280,295 C 360,288 440,292 520,298 C 600,302 680,296 700,295"
      fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,3"/>

<!-- Donchian fill -->
<path d="M 70,90 C 120,88 200,85 280,88 C 360,92 440,89 520,86 C 600,83 680,85 700,84
         L 700,295 C 680,296 600,302 520,298 C 440,292 360,288 280,295 C 200,300 120,295 70,290 Z"
      fill="#7c3aed" fill-opacity="0.07"/>

<!-- Donchian labels -->
<text x="705" y="90" font-size="10" fill="#7c3aed" font-weight="700">Donchian High</text>
<text x="705" y="102" font-size="9" fill="#7c3aed">= Grid Zone บน</text>
<text x="705" y="297" font-size="10" fill="#7c3aed" font-weight="700">Donchian Low</text>
<text x="705" y="309" font-size="9" fill="#7c3aed">= Grid Zone ล่าง</text>

<!-- Keltner Channel (EMA ± kATR) — narrower band for STEP -->
<path d="M 70,160 C 120,158 200,162 280,165 C 360,168 440,163 520,160 C 600,156 680,159 700,158"
      fill="none" stroke="#06b6d4" stroke-width="2"/>
<path d="M 70,230 C 120,232 200,228 280,225 C 360,222 440,227 520,230 C 600,234 680,231 700,232"
      fill="none" stroke="#06b6d4" stroke-width="2"/>

<!-- Keltner fill -->
<path d="M 70,160 C 120,158 200,162 280,165 C 360,168 440,163 520,160 C 600,156 680,159 700,158
         L 700,232 C 680,231 600,234 520,230 C 440,227 360,222 280,225 C 200,228 120,232 70,230 Z"
      fill="#06b6d4" fill-opacity="0.10"/>

<!-- EMA middle line -->
<path d="M 70,195 C 120,195 200,195 280,195 C 360,195 440,195 520,195 C 600,195 680,195 700,195"
      fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4"/>

<!-- Keltner labels -->
<text x="705" y="160" font-size="10" fill="#06b6d4" font-weight="700">Keltner Upper</text>
<text x="705" y="172" font-size="9" fill="#0891b2">EMA + k×ATR</text>
<text x="705" y="195" font-size="10" fill="#06b6d4">EMA (mid)</text>
<text x="705" y="234" font-size="10" fill="#06b6d4" font-weight="700">Keltner Lower</text>
<text x="705" y="246" font-size="9" fill="#0891b2">EMA − k×ATR</text>

<!-- Price path -->
<polyline points="70,195 120,165 180,230 240,155 290,210 340,178 390,240 450,162 510,215 560,178 610,225 660,188 700,200"
          fill="none" stroke="#1e40af" stroke-width="2.5" stroke-linejoin="round"/>

<!-- Grid lines within Keltner (step-sized) -->
<line x1="70" y1="160" x2="700" y2="160" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.4"/>
<line x1="70" y1="175" x2="700" y2="175" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.4"/>
<line x1="70" y1="195" x2="700" y2="195" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.4"/>
<line x1="70" y1="212" x2="700" y2="212" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.4"/>
<line x1="70" y1="230" x2="700" y2="230" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.4"/>

<!-- Step annotation -->
<line x1="50" y1="160" x2="50" y2="175" stroke="#06b6d4" stroke-width="2"/>
<text x="44" y="169" text-anchor="end" font-size="9" fill="#06b6d4" font-weight="700">Step</text>
<text x="44" y="180" text-anchor="end" font-size="9" fill="#06b6d4">= ATR×k</text>

<!-- Zone annotation -->
<line x1="50" y1="90" x2="50" y2="290" stroke="#7c3aed" stroke-width="2"/>
<text x="20" y="195" text-anchor="middle" font-size="9" fill="#7c3aed" transform="rotate(-90,20,195)" font-weight="700">Zone = Donchian Range</text>

<!-- Legend -->
<rect x="80" y="370" width="12" height="3" fill="#7c3aed" rx="1"/>
<text x="98" y="376" font-size="10" fill="#0f172a">Donchian Channel (N=20 วัน) — กำหนด <strong>Zone</strong> ของ Grid</text>
<rect x="330" y="370" width="12" height="3" fill="#06b6d4" rx="1"/>
<text x="348" y="376" font-size="10" fill="#0f172a">Keltner Channel (ATR-based) — กำหนด <strong>Step Size</strong></text>

<text x="380" y="408" text-anchor="middle" font-size="11" fill="#94a3b8">Donchian = ช่วงราคา price-based (dynamic zone) · Keltner = ความผันผวน ATR-based (dynamic step)</text>
</svg>
