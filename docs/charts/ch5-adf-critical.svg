<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="680" height="260" fill="#f9fafb"/>
  <text x="340" y="22" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">ADF Critical Values — Reject H₀ ถ้า Test Stat &lt; Critical Value</text>
  <rect x="30" y="35" width="620" height="185" fill="white" stroke="#e5e7eb"/>
  <!-- Zone fills -->
  <rect x="50" y="55" width="580" height="125" fill="#f0fdf4" opacity="0.5"/>
  <!-- Critical value lines -->
  <line x1="50" y1="90" x2="630" y2="90" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="50" y1="120" x2="630" y2="120" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="50" y1="148" x2="630" y2="148" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- Labels -->
  <text x="635" y="93" font-size="11" fill="#dc2626" font-weight="700">−3.44 (1%)</text>
  <text x="635" y="123" font-size="11" fill="#d97706" font-weight="700">−2.86 (5%)</text>
  <text x="635" y="151" font-size="11" fill="#2563eb" font-weight="700">−2.57 (10%)</text>
  <!-- Zone labels -->
  <text x="340" y="78" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="700">Reject Zone — Stationary (ε กลับค่ากลาง ✓)</text>
  <text x="340" y="168" text-anchor="middle" font-size="11" fill="#374151">Fail to Reject Zone — Non-Stationary (ε drift ✗)</text>
  <!-- Example test stats -->
  <circle cx="200" cy="106" r="6" fill="#16a34a"/>
  <text x="208" y="110" font-size="11" fill="#16a34a" font-weight="700">−3.15 (pass 5%) ✓</text>
  <circle cx="200" cy="136" r="6" fill="#d97706"/>
  <text x="208" y="140" font-size="11" fill="#d97706" font-weight="700">−2.71 (borderline) ⚠</text>
  <circle cx="200" cy="168" r="6" fill="#dc2626"/>
  <text x="208" y="172" font-size="11" fill="#dc2626" font-weight="700">−1.90 (fail) ✗</text>
  <!-- Axis -->
  <line x1="50" y1="180" x2="50" y2="55" stroke="#374151" stroke-width="1"/>
  <text x="44" y="90" text-anchor="end" font-size="10" fill="#374151">−3.44</text>
  <text x="44" y="120" text-anchor="end" font-size="10" fill="#374151">−2.86</text>
  <text x="44" y="148" text-anchor="end" font-size="10" fill="#374151">−2.57</text>
  <text x="340" y="250" text-anchor="middle" font-size="11" fill="#64748b">Standard threshold: p &lt; 0.05 (test stat &lt; −2.86) → cointegrated → trade ได้</text>
</svg>
