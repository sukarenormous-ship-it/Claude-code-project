<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Sarabun',sans-serif">
  <defs>
    <marker id="arrowRight" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto">
      <path d="M0,8 L6,8 L3,0 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowExpL" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowExpR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="30" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Grid Snowball 3 แบบ + DCA Stack</text>

  <!-- ===== UPPER SECTION: 3 Snowball Panels ===== -->

  <!-- Panel 1: Simple Compound (cyan) x=30 to x=228 -->
  <rect x="30" y="48" width="198" height="180" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="129" y="65" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">Type 1: Simple Compound</text>
  <text x="129" y="79" font-size="9" fill="#64748b" text-anchor="middle">Q เพิ่มทุก 7 วัน</text>

  <!-- Growing bars bottom-aligned at y=200, heights 25,35,48,65,88,119 -->
  <!-- Bar x positions: 46,70,94,118,142,166 width=18 -->
  <rect x="46"  y="175" width="18" height="25" rx="2" fill="#06b6d4"/>
  <rect x="70"  y="165" width="18" height="35" rx="2" fill="#06b6d4"/>
  <rect x="94"  y="152" width="18" height="48" rx="2" fill="#06b6d4"/>
  <rect x="118" y="135" width="18" height="65" rx="2" fill="#06b6d4"/>
  <rect x="142" y="112" width="18" height="88" rx="2" fill="#06b6d4"/>
  <rect x="166" y="081" width="18" height="119" rx="2" fill="#0891b2"/>
  <!-- Baseline -->
  <line x1="40" y1="200" x2="192" y2="200" stroke="#94a3b8" stroke-width="1"/>
  <!-- Exponential curve overlay (dashed), connecting bar tops -->
  <polyline points="55,175 79,165 103,152 127,135 151,112 175,81"
    fill="none" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="129" y="218" font-size="9" fill="#0891b2" text-anchor="middle">compound ราบเรียบ</text>

  <!-- Panel 2: Profit-Triggered (blue) x=246 to x=514 -->
  <rect x="246" y="48" width="268" height="180" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="65" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Type 2: Profit-Triggered</text>
  <text x="380" y="79" font-size="9" fill="#64748b" text-anchor="middle">Layer ใหม่เปิดเมื่อกำไรถึง threshold</text>

  <!-- Stacked horizontal bars (layers) -->
  <!-- Layer 1 (widest, bottom): y=185-200 -->
  <rect x="268" y="182" width="222" height="18" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="379" y="195" font-size="9" fill="#1d4ed8" text-anchor="middle">Layer 1</text>
  <!-- Layer 2 (medium): y=162-177 -->
  <rect x="288" y="159" width="182" height="18" rx="3" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
  <text x="379" y="172" font-size="9" fill="#1d4ed8" text-anchor="middle">Layer 2</text>
  <!-- Layer 3 (narrower): y=139-154 -->
  <rect x="308" y="136" width="142" height="18" rx="3" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="379" y="149" font-size="9" fill="#1d4ed8" text-anchor="middle">Layer 3</text>

  <!-- Dashed arrow going up between layers -->
  <line x1="379" y1="158" x2="379" y2="107" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowUp)"/>
  <rect x="325" y="106" width="108" height="16" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.5"/>
  <text x="379" y="118" font-size="9" fill="#2563eb" text-anchor="middle">profit &gt;= $500</text>

  <text x="380" y="218" font-size="9" fill="#1d4ed8" text-anchor="middle">compound แบบ discrete (step function)</text>

  <!-- Panel 3: Zone Upgrade (violet) x=532 to x=730 -->
  <rect x="532" y="48" width="198" height="180" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="631" y="65" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">Type 3: Zone Upgrade</text>
  <text x="631" y="79" font-size="9" fill="#64748b" text-anchor="middle">กำไรขยาย zone coverage</text>

  <!-- Inner box (old zone) centered at y=148 -->
  <rect x="581" y="126" width="100" height="44" rx="4" fill="#ddd6fe" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="631" y="144" font-size="8" fill="#5b21b6" text-anchor="middle">$90k–$110k</text>
  <text x="631" y="157" font-size="7" fill="#7c3aed" text-anchor="middle">Old Zone</text>

  <!-- Outer box (new, larger zone) -->
  <rect x="557" y="108" width="148" height="80" rx="5" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="631" y="202" font-size="8" fill="#6d28d9" text-anchor="middle">$85k–$115k</text>

  <!-- Expanding arrows left and right -->
  <line x1="578" y1="148" x2="560" y2="148" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrowExpL)"/>
  <line x1="684" y1="148" x2="702" y2="148" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrowExpR)"/>

  <text x="631" y="218" font-size="9" fill="#6d28d9" text-anchor="middle">compound แบบ expanded coverage</text>

  <!-- ===== LOWER SECTION: DCA Stack Flow ===== -->

  <!-- Full-width box -->
  <rect x="30" y="237" width="700" height="153" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="380" y="259" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Grid — DCA Stack</text>

  <!-- Box 1: Trading Portfolio -->
  <rect x="50" y="275" width="165" height="62" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="132" y="297" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Trading Portfolio</text>
  <text x="132" y="314" font-size="10" fill="#166534" text-anchor="middle">Grid $45/day</text>
  <text x="132" y="328" font-size="9" fill="#15803d" text-anchor="middle">(Active)</text>

  <!-- Arrow right 1 -->
  <line x1="218" y1="306" x2="295" y2="306" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- Box 2: Split -->
  <rect x="298" y="275" width="165" height="62" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="380" y="294" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">70% Compound</text>
  <text x="380" y="311" font-size="10" fill="#166534" text-anchor="middle">30% Transfer</text>
  <text x="380" y="328" font-size="9" fill="#15803d" text-anchor="middle">(Allocate)</text>

  <!-- Arrow right 2 -->
  <line x1="466" y1="306" x2="542" y2="306" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- Box 3: Wealth Portfolio -->
  <rect x="545" y="275" width="165" height="62" rx="6" fill="#bbf7d0" stroke="#4ade80" stroke-width="1.5"/>
  <text x="627" y="294" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Wealth Portfolio</text>
  <text x="627" y="311" font-size="10" fill="#166534" text-anchor="middle">BTC accumulation</text>
  <text x="627" y="328" font-size="9" fill="#15803d" text-anchor="middle">(Passive)</text>

  <!-- Summary line at bottom of DCA box -->
  <text x="380" y="367" font-size="10" fill="#166534" text-anchor="middle">Active Grid income  →  สะสม BTC ระยะยาว</text>
  <text x="380" y="382" font-size="9" fill="#64748b" text-anchor="middle">compound สองมิติ: ทุน Trading + ทุน Wealth เพิ่มพร้อมกัน</text>

  <!-- Caption -->
  <text x="380" y="430" font-size="10" fill="#94a3b8" text-anchor="middle">กำไรจาก Grid (active) → สะสม BTC ระยะยาว (passive) = compound สองมิติ</text>
</svg>
