<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="300" fill="#f9fafb"/>
  <text x="380" y="20" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">OLS: Scatter และ Cumulative Residuals ε</text>
  <!-- Left: scatter with regression line -->
  <rect x="20" y="30" width="330" height="240" fill="white" stroke="#e5e7eb"/>
  <text x="185" y="50" text-anchor="middle" font-size="12" fill="#374151" font-weight="700">Scatter: log P_A vs log P_B</text>
  <line x1="40" y1="250" x2="330" y2="250" stroke="#374151" stroke-width="1"/>
  <line x1="40" y1="250" x2="40" y2="65" stroke="#374151" stroke-width="1"/>
  <text x="185" y="268" text-anchor="middle" font-size="10" fill="#64748b">log P_B</text>
  <line x1="50" y1="235" x2="315" y2="80" stroke="#2563eb" stroke-width="2"/>
  <circle cx="65" cy="225" r="3.5" fill="#0d9488" opacity="0.8"/>
  <circle cx="90" cy="208" r="3.5" fill="#0d9488" opacity="0.8"/>
  <circle cx="120" cy="192" r="3.5" fill="#0d9488" opacity="0.8"/>
  <circle cx="150" cy="174" r="3.5" fill="#0d9488" opacity="0.8"/>
  <circle cx="175" cy="160" r="3.5" fill="#0d9488" opacity="0.8"/>
  <circle cx="205" cy="143" r="3.5" fill="#0d9488" opacity="0.8"/>
  <circle cx="230" cy="128" r="3.5" fill="#0d9488" opacity="0.8"/>
  <circle cx="258" cy="110" r="3.5" fill="#0d9488" opacity="0.8"/>
  <circle cx="285" cy="95" r="3.5" fill="#0d9488" opacity="0.8"/>
  <circle cx="310" cy="84" r="3.5" fill="#0d9488" opacity="0.8"/>
  <circle cx="140" cy="182" r="3.5" fill="#0d9488" opacity="0.8"/>
  <circle cx="218" cy="135" r="3.5" fill="#0d9488" opacity="0.8"/>
  <text x="275" y="78" font-size="10" fill="#2563eb">β̂ slope</text>
  <!-- Right: residual time series -->
  <rect x="400" y="30" width="340" height="240" fill="white" stroke="#e5e7eb"/>
  <text x="570" y="50" text-anchor="middle" font-size="12" fill="#374151" font-weight="700">Cumulative ε_t (mean-reverting)</text>
  <line x1="420" y1="160" x2="720" y2="160" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="420" y1="250" x2="720" y2="250" stroke="#374151" stroke-width="1"/>
  <line x1="420" y1="250" x2="420" y2="65" stroke="#374151" stroke-width="1"/>
  <text x="415" y="157" font-size="10" fill="#0d9488">θ=0</text>
  <text x="570" y="268" text-anchor="middle" font-size="10" fill="#64748b">time</text>
  <polyline points="420,160 438,148 456,130 474,116 492,128 510,144 528,158 546,168 564,160 582,148 600,138 618,148 636,158 654,164 672,158 690,150 708,158 720,160"
    fill="none" stroke="#0d9488" stroke-width="2"/>
  <line x1="420" y1="120" x2="720" y2="120" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="420" y1="200" x2="720" y2="200" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="722" y="123" font-size="9" fill="#16a34a">+2σ</text>
  <text x="722" y="203" font-size="9" fill="#16a34a">−2σ</text>
  <text x="570" y="292" text-anchor="middle" font-size="11" fill="#64748b">ε วนรอบ 0 แบบ mean-revert — สิ่งที่เราจะ trade</text>
</svg>
