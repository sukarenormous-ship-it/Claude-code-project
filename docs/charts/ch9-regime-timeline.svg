<svg viewBox="0 0 760 310" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs>
  <marker id="arw4" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#374151"/>
  </marker>
</defs>
<rect x="5" y="5" width="750" height="300" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Spread Timeline: สีตาม Regime</text>

<!-- Axes -->
<line x1="55" y1="200" x2="720" y2="200" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw4)"/>
<line x1="55" y1="250" x2="55" y2="45" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arw4)"/>
<text x="725" y="203" font-size="9" fill="#6b7280">t</text>
<text x="49" y="43" text-anchor="end" font-size="9" fill="#6b7280">ε</text>

<!-- Mean (theta) line -->
<line x1="55" y1="200" x2="715" y2="200" stroke="#0d9488" stroke-width="0.8" stroke-dasharray="4,4"/>
<text x="51" y="203" text-anchor="end" font-size="8" fill="#0d9488">θ</text>

<!-- +2sigma and -2sigma bands -->
<line x1="55" y1="163" x2="715" y2="163" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2,3"/>
<line x1="55" y1="237" x2="715" y2="237" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2,3"/>
<text x="51" y="165" text-anchor="end" font-size="7" fill="#94a3b8">+2σ</text>
<text x="51" y="239" text-anchor="end" font-size="7" fill="#94a3b8">-2σ</text>

<!-- Segment 1: Normal (green) -->
<rect x="55" y="45" width="200" height="250" fill="#16a34a" opacity="0.06" rx="0"/>
<polyline points="55,200 70,192 85,182 100,192 115,202 130,200 145,190 160,181 175,191 190,200 205,192 215,184 240,195 255,200"
          fill="none" stroke="#16a34a" stroke-width="2.2"/>

<!-- Segment 2: Stressed (amber) -->
<rect x="255" y="45" width="175" height="250" fill="#f59e0b" opacity="0.08" rx="0"/>
<polyline points="255,200 265,188 275,171 285,184 300,163 315,178 330,193 345,172 360,155 375,170 390,183 405,165 420,178 430,188"
          fill="none" stroke="#d97706" stroke-width="2.2"/>

<!-- Segment 3: Broken (red) -->
<rect x="430" y="45" width="100" height="250" fill="#dc2626" opacity="0.08" rx="0"/>
<polyline points="430,188 440,202 450,220 460,238 465,252 470,242 480,262 490,248 500,258 510,243 530,232"
          fill="none" stroke="#dc2626" stroke-width="2.2"/>
<text x="480" y="285" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="700">ไม่กลับ!</text>

<!-- Segment 4: Stressed recovery (amber) -->
<rect x="530" y="45" width="80" height="250" fill="#f59e0b" opacity="0.08" rx="0"/>
<polyline points="530,232 545,220 558,207 570,196 582,187 610,189"
          fill="none" stroke="#d97706" stroke-width="2.2"/>

<!-- Segment 5: Normal again (green) -->
<rect x="610" y="45" width="105" height="250" fill="#16a34a" opacity="0.06" rx="0"/>
<polyline points="610,189 625,181 640,172 655,181 670,191 685,183 710,177"
          fill="none" stroke="#16a34a" stroke-width="2.2"/>

<!-- Regime labels at top -->
<text x="155" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">Normal</text>
<text x="342" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#d97706">Stressed</text>
<text x="480" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">Broken</text>
<text x="570" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#d97706">Stressed</text>
<text x="662" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">Normal</text>

<!-- Trade zone marker -->
<rect x="55" y="73" width="200" height="13" fill="#16a34a" opacity="0.3" rx="2"/>
<text x="155" y="83" text-anchor="middle" font-size="8" fill="#166534" font-weight="700">เทรดได้</text>
<rect x="610" y="73" width="105" height="13" fill="#16a34a" opacity="0.3" rx="2"/>
<text x="662" y="83" text-anchor="middle" font-size="8" fill="#166534" font-weight="700">เทรดได้</text>

<!-- No trade zone -->
<rect x="255" y="73" width="355" height="13" fill="#dc2626" opacity="0.2" rx="2"/>
<text x="432" y="83" text-anchor="middle" font-size="8" fill="#991b1b" font-weight="700">หยุดเทรด</text>

<!-- P(Normal) panel at bottom strip -->
<rect x="55" y="288" width="200" height="8" fill="#16a34a" opacity="0.5" rx="1"/>
<rect x="255" y="288" width="175" height="8" fill="#d97706" opacity="0.4" rx="1"/>
<rect x="430" y="288" width="100" height="8" fill="#dc2626" opacity="0.5" rx="1"/>
<rect x="530" y="288" width="80" height="8" fill="#d97706" opacity="0.4" rx="1"/>
<rect x="610" y="288" width="105" height="8" fill="#16a34a" opacity="0.5" rx="1"/>

<!-- Legend -->
<rect x="60" y="301" width="10" height="8" fill="#16a34a" opacity="0.5"/>
<text x="74" y="308" font-size="8" fill="#374151">Normal (เทรดได้)</text>
<rect x="180" y="301" width="10" height="8" fill="#f59e0b" opacity="0.5"/>
<text x="194" y="308" font-size="8" fill="#374151">Stressed (ลด size)</text>
<rect x="310" y="301" width="10" height="8" fill="#dc2626" opacity="0.5"/>
<text x="324" y="308" font-size="8" fill="#374151">Broken (หยุดเทรด)</text>
</svg>
