<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">
<rect width="760" height="420" fill="#f8fafc" rx="6"/>
<text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Bell Curve Grid Density — Dense ตรงกลาง, Sparse ที่ขอบ</text>

<!-- Y-axis -->
<line x1="80" y1="50" x2="80" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
<!-- X-axis -->
<line x1="80" y1="360" x2="700" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
<text x="22" y="210" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90,22,210)">ความหนาแน่น</text>
<text x="395" y="395" text-anchor="middle" font-size="11" fill="#64748b">ราคา (Price)</text>

<!-- Bell curve (normal distribution) -->
<path d="M 90,355 C 120,355 140,350 160,340 C 180,330 200,310 220,285 C 240,255 260,215 280,175 C 300,140 320,115 340,100 C 360,95 380,95 400,100 C 420,115 440,140 460,175 C 480,215 500,255 520,285 C 540,310 560,330 580,340 C 600,350 620,355 660,357 C 680,358 700,358 700,360"
      fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="2" stroke-linejoin="round"/>

<!-- Grid vertical lines — DENSE in center (near mean) -->
<!-- Center (mean) ≈ x=390 -->
<!-- Dense zone: x=280 to x=500 (within ±1σ) -->
<line x1="295" y1="170" x2="295" y2="360" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
<line x1="320" y1="138" x2="320" y2="360" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
<line x1="345" y1="108" x2="345" y2="360" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
<line x1="370" y1="97" x2="370" y2="360" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.9"/>
<line x1="390" y1="95" x2="390" y2="360" stroke="#06b6d4" stroke-width="3" stroke-opacity="1"/>
<text x="390" y="378" text-anchor="middle" font-size="10" fill="#0891b2" font-weight="700">μ (Mean)</text>
<line x1="410" y1="97" x2="410" y2="360" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.9"/>
<line x1="430" y1="103" x2="430" y2="360" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
<line x1="455" y1="118" x2="455" y2="360" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
<line x1="478" y1="140" x2="478" y2="360" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>
<line x1="500" y1="175" x2="500" y2="360" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8"/>

<!-- Sparse zone: left side (x=90 to x=280) -->
<line x1="110" y1="356" x2="110" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="160" y1="340" x2="160" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.6"/>
<line x1="220" y1="285" x2="220" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.7"/>

<!-- Sparse zone: right side (x=500 to x=700) -->
<line x1="560" y1="310" x2="560" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.7"/>
<line x1="620" y1="350" x2="620" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.6"/>
<line x1="670" y1="357" x2="670" y2="360" stroke="#94a3b8" stroke-width="1.5"/>

<!-- σ markers on x-axis -->
<line x1="295" y1="358" x2="295" y2="363" stroke="#94a3b8" stroke-width="1.5"/>
<text x="295" y="378" text-anchor="middle" font-size="10" fill="#64748b">-1σ</text>
<line x1="220" y1="358" x2="220" y2="363" stroke="#94a3b8" stroke-width="1.5"/>
<text x="220" y="378" text-anchor="middle" font-size="10" fill="#64748b">-2σ</text>
<line x1="485" y1="358" x2="485" y2="363" stroke="#94a3b8" stroke-width="1.5"/>
<text x="485" y="378" text-anchor="middle" font-size="10" fill="#64748b">+1σ</text>
<line x1="560" y1="358" x2="560" y2="363" stroke="#94a3b8" stroke-width="1.5"/>
<text x="560" y="378" text-anchor="middle" font-size="10" fill="#64748b">+2σ</text>

<!-- Annotation boxes -->
<rect x="285" y="55" width="210" height="32" fill="#ecfeff" rx="4" stroke="#67e8f9" stroke-width="1"/>
<text x="390" y="71" text-anchor="middle" font-size="10" fill="#0e7490" font-weight="700">Dense Zone (±1σ) — step เล็ก</text>
<text x="390" y="82" text-anchor="middle" font-size="9" fill="#0891b2">ราคาใช้เวลาในโซนนี้มาก → cashflow สูง</text>

<rect x="88" y="240" width="120" height="28" fill="#f1f5f9" rx="4" stroke="#cbd5e1" stroke-width="1"/>
<text x="148" y="256" text-anchor="middle" font-size="9" fill="#64748b" font-weight="700">Sparse Zone (-2σ)</text>
<text x="148" y="268" text-anchor="middle" font-size="9" fill="#94a3b8">step ใหญ่ — ประหยัดทุน</text>

<rect x="560" y="240" width="120" height="28" fill="#f1f5f9" rx="4" stroke="#cbd5e1" stroke-width="1"/>
<text x="620" y="256" text-anchor="middle" font-size="9" fill="#64748b" font-weight="700">Sparse Zone (+2σ)</text>
<text x="620" y="268" text-anchor="middle" font-size="9" fill="#94a3b8">ราคามาน้อย → หยาบ</text>

<!-- Step size arrows to show difference -->
<line x1="345" y1="330" x2="370" y2="330" stroke="#f59e0b" stroke-width="2" marker-end="url(#ar)"/>
<line x1="220" y1="330" x2="295" y2="330" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="257" y="325" text-anchor="middle" font-size="9" fill="#94a3b8">step ใหญ่</text>
<text x="360" y="325" text-anchor="middle" font-size="9" fill="#d97706">step เล็ก</text>

<defs>
  <marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
    <path d="M 0 0 L 6 3 L 0 6 z" fill="#f59e0b"/>
  </marker>
</defs>

<text x="380" y="410" text-anchor="middle" font-size="11" fill="#94a3b8">Bell curve density: จัดวาง order หนาแน่นในโซนที่ราคาใช้เวลามากที่สุด</text>
</svg>
