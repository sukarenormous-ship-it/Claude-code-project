<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">
<rect width="760" height="420" fill="#f8fafc" rx="6"/>
<text x="380" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Regime Detection — เมื่อไหร่เปิด/หยุด Grid</text>

<!-- State machine boxes -->
<!-- State 1: GRID ON (mean-reverting) -->
<rect x="60" y="70" width="180" height="110" fill="#f0fdf4" rx="10" stroke="#16a34a" stroke-width="2.5"/>
<text x="150" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">GRID ON</text>
<text x="150" y="112" text-anchor="middle" font-size="10" fill="#166534">mean-reverting</text>
<text x="75" y="132" font-size="9" fill="#166534">• Hurst H &lt; 0.50</text>
<text x="75" y="146" font-size="9" fill="#166534">• ADX &lt; 25</text>
<text x="75" y="160" font-size="9" fill="#166534">• BB width normal</text>
<text x="150" y="175" text-anchor="middle" font-size="10" fill="#15803d" font-weight="600">Full Deploy</text>

<!-- State 2: GRID REDUCE (caution zone) -->
<rect x="290" y="70" width="180" height="110" fill="#fffbeb" rx="10" stroke="#d97706" stroke-width="2"/>
<text x="380" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">CAUTION</text>
<text x="380" y="112" text-anchor="middle" font-size="10" fill="#92400e">borderline regime</text>
<text x="305" y="132" font-size="9" fill="#92400e">• H = 0.50–0.58</text>
<text x="305" y="146" font-size="9" fill="#92400e">• ADX = 20–30</text>
<text x="305" y="160" font-size="9" fill="#92400e">• Vol spike warning</text>
<text x="380" y="175" text-anchor="middle" font-size="10" fill="#b45309" font-weight="600">Reduce 50% size</text>

<!-- State 3: GRID OFF (trending) -->
<rect x="520" y="70" width="180" height="110" fill="#fef2f2" rx="10" stroke="#dc2626" stroke-width="2.5"/>
<text x="610" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">GRID OFF</text>
<text x="610" y="112" text-anchor="middle" font-size="10" fill="#b91c1c">trending / breakout</text>
<text x="535" y="132" font-size="9" fill="#b91c1c">• Hurst H &gt; 0.58</text>
<text x="535" y="146" font-size="9" fill="#b91c1c">• ADX &gt; 30</text>
<text x="535" y="160" font-size="9" fill="#b91c1c">• Price outside BB×2</text>
<text x="610" y="175" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="600">Pause / Cancel all</text>

<!-- Arrows between states -->
<line x1="240" y1="125" x2="288" y2="125" stroke="#d97706" stroke-width="2"/>
<polygon points="280,120 290,125 280,130" fill="#d97706"/>
<text x="264" y="116" text-anchor="middle" font-size="9" fill="#d97706">H rising</text>

<line x1="290" y1="115" x2="242" y2="115" stroke="#16a34a" stroke-width="2"/>
<polygon points="250,110 240,115 250,120" fill="#16a34a"/>
<text x="264" y="108" text-anchor="middle" font-size="9" fill="#16a34a">H drops</text>

<line x1="470" y1="125" x2="518" y2="125" stroke="#dc2626" stroke-width="2"/>
<polygon points="510,120 520,125 510,130" fill="#dc2626"/>
<text x="494" y="116" text-anchor="middle" font-size="9" fill="#dc2626">ADX spike</text>

<line x1="520" y1="115" x2="472" y2="115" stroke="#d97706" stroke-width="2"/>
<polygon points="480,110 470,115 480,120" fill="#d97706"/>
<text x="494" y="108" text-anchor="middle" font-size="9" fill="#d97706">ADX drops</text>

<!-- Self-loop GRID ON -->
<path d="M 100 70 Q 80 40 120 40 Q 160 40 160 70" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="130" y="38" text-anchor="middle" font-size="8" fill="#16a34a">H &lt; 0.45 → grid scales up</text>

<!-- Timeline chart below -->
<text x="380" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">ตัวอย่าง: Hurst Exponent Rolling 30 วัน</text>

<!-- Chart area -->
<line x1="70" y1="250" x2="70" y2="370" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="70" y1="370" x2="700" y2="370" stroke="#94a3b8" stroke-width="1.5"/>

<!-- Threshold lines -->
<line x1="70" y1="285" x2="700" y2="285" stroke="#dc2626" stroke-width="1" stroke-dasharray="5,3"/>
<text x="705" y="289" font-size="9" fill="#dc2626">H=0.58 → OFF</text>
<line x1="70" y1="320" x2="700" y2="320" stroke="#d97706" stroke-width="1" stroke-dasharray="5,3"/>
<text x="705" y="324" font-size="9" fill="#d97706">H=0.50 → CAUTION</text>

<!-- Hurst line (bouncing around) -->
<polyline points="70,335 110,328 150,310 190,290 230,275 260,265 290,278 320,300 350,320 390,340 420,330 450,310 480,300 510,315 540,305 570,290 600,278 630,265 660,260 700,275"
          fill="none" stroke="#1e40af" stroke-width="2" stroke-linejoin="round"/>

<!-- Regime coloring in chart -->
<rect x="70" y="250" width="170" height="35" fill="#f0fdf4" fill-opacity="0.5"/>
<text x="155" y="265" text-anchor="middle" font-size="8" fill="#15803d">GRID ON</text>
<rect x="240" y="250" width="90" height="35" fill="#fffbeb" fill-opacity="0.7"/>
<text x="285" y="265" text-anchor="middle" font-size="8" fill="#b45309">CAUTION</text>
<rect x="330" y="250" width="120" height="35" fill="#fef2f2" fill-opacity="0.7"/>
<text x="390" y="265" text-anchor="middle" font-size="8" fill="#991b1b">GRID OFF</text>
<rect x="450" y="250" width="250" height="35" fill="#f0fdf4" fill-opacity="0.5"/>
<text x="575" y="265" text-anchor="middle" font-size="8" fill="#15803d">GRID ON (กลับมา)</text>

<!-- Y axis labels -->
<text x="62" y="254" text-anchor="end" font-size="9" fill="#94a3b8">0.65</text>
<text x="62" y="289" text-anchor="end" font-size="9" fill="#94a3b8">0.58</text>
<text x="62" y="324" text-anchor="end" font-size="9" fill="#94a3b8">0.50</text>
<text x="62" y="374" text-anchor="end" font-size="9" fill="#94a3b8">0.40</text>

<text x="380" y="410" text-anchor="middle" font-size="11" fill="#94a3b8">H &lt; 0.50 = grid friendly (mean-reverting) · H &gt; 0.58 = หยุด grid · 0.50–0.58 = ลด size</text>
</svg>
