<svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="200" fill="#f9fafb"/>
  <text x="380" y="22" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Pipeline: Pair Selection → Transform → β (บทนี้) → ε → Diagnostics → Execution</text>
  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#374151"/>
    </marker>
  </defs>
  <!-- Steps -->
  <rect x="15" y="65" width="95" height="60" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="63" y="90" text-anchor="middle" font-size="10" fill="#374151" font-weight="700">Pair</text>
  <text x="63" y="104" text-anchor="middle" font-size="10" fill="#374151">Selection</text>
  <line x1="110" y1="95" x2="128" y2="95" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <rect x="130" y="65" width="95" height="60" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="178" y="90" text-anchor="middle" font-size="10" fill="#374151" font-weight="700">Transform</text>
  <text x="178" y="104" text-anchor="middle" font-size="10" fill="#374151">log(P_A,P_B)</text>
  <line x1="225" y1="95" x2="243" y2="95" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <!-- Beta step (highlighted) -->
  <rect x="245" y="55" width="110" height="80" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
  <text x="300" y="85" text-anchor="middle" font-size="11" fill="#0d9488" font-weight="700">Beta β</text>
  <text x="300" y="100" text-anchor="middle" font-size="10" fill="#0d9488">OLS / TLS /</text>
  <text x="300" y="114" text-anchor="middle" font-size="10" fill="#0d9488">Kalman</text>
  <text x="300" y="148" text-anchor="middle" font-size="9" fill="#0d9488">← บทนี้</text>
  <line x1="355" y1="95" x2="373" y2="95" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <rect x="375" y="65" width="95" height="60" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="423" y="90" text-anchor="middle" font-size="10" fill="#374151" font-weight="700">ε Spread</text>
  <text x="423" y="104" text-anchor="middle" font-size="10" fill="#374151">log A − β·log B</text>
  <line x1="470" y1="95" x2="488" y2="95" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <rect x="490" y="65" width="100" height="60" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="540" y="90" text-anchor="middle" font-size="10" fill="#374151" font-weight="700">Diagnostics</text>
  <text x="540" y="104" text-anchor="middle" font-size="10" fill="#374151">ADF, H, τ₁/₂</text>
  <line x1="590" y1="95" x2="608" y2="95" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <rect x="610" y="65" width="120" height="60" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="670" y="90" text-anchor="middle" font-size="10" fill="#374151" font-weight="700">Execution</text>
  <text x="670" y="104" text-anchor="middle" font-size="10" fill="#374151">z-score, sizing</text>
  <text x="380" y="185" text-anchor="middle" font-size="11" fill="#64748b">β คือหัวใจ — ถ้า β ผิด ε drift ทั้งหมด downstream ก็ผิดตาม</text>
</svg>
