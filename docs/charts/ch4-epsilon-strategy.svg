<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="280" fill="#f9fafb"/>
  <text x="380" y="20" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Kalman β → ε ≈ 0 (Funding Harvest) vs OLS β → ε Mean-Reverts (Spread Arb)</text>
  <!-- Left panel: Kalman ε flat -->
  <rect x="20" y="30" width="340" height="210" fill="white" stroke="#e5e7eb"/>
  <text x="190" y="50" text-anchor="middle" font-size="12" fill="#0d9488" font-weight="700">Kalman β_t — Funding Harvest</text>
  <line x1="40" y1="235" x2="340" y2="235" stroke="#374151" stroke-width="1"/>
  <line x1="40" y1="235" x2="40" y2="65" stroke="#374151" stroke-width="1"/>
  <line x1="40" y1="148" x2="340" y2="148" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="34" y="151" text-anchor="end" font-size="10" fill="#0d9488">0</text>
  <polyline points="40,148 65,150 90,147 115,149 140,150 165,148 190,149 215,148 240,150 265,149 290,148 315,149 340,148"
    fill="none" stroke="#0d9488" stroke-width="2.5"/>
  <text x="190" y="258" text-anchor="middle" font-size="11" fill="#0d9488">ε_t ≈ 0 — hedge สมบูรณ์</text>
  <text x="190" y="272" text-anchor="middle" font-size="10" fill="#64748b">กำไรมาจาก funding rate เท่านั้น</text>
  <!-- Right panel: OLS ε mean-reverting -->
  <rect x="400" y="30" width="340" height="210" fill="white" stroke="#e5e7eb"/>
  <text x="570" y="50" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">OLS β — Spread Arbitrage</text>
  <line x1="420" y1="235" x2="720" y2="235" stroke="#374151" stroke-width="1"/>
  <line x1="420" y1="235" x2="420" y2="65" stroke="#374151" stroke-width="1"/>
  <line x1="420" y1="148" x2="720" y2="148" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="414" y="151" text-anchor="end" font-size="10" fill="#0d9488">θ</text>
  <line x1="420" y1="108" x2="720" y2="108" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="420" y1="188" x2="720" y2="188" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
  <polyline points="420,148 445,138 470,118 495,100 520,108 545,124 570,142 595,155 620,162 645,155 670,142 695,132 720,140"
    fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Entry/exit circles -->
  <circle cx="495" cy="100" r="5" fill="#d97706" stroke="white" stroke-width="1"/>
  <circle cx="620" cy="162" r="5" fill="#d97706" stroke="white" stroke-width="1"/>
  <polygon points="570,130 577,145 563,145" fill="#16a34a"/>
  <text x="570" y="258" text-anchor="middle" font-size="11" fill="#2563eb">ε_t mean-revert รอบ θ</text>
  <text x="570" y="272" text-anchor="middle" font-size="10" fill="#64748b">กำไรจาก spread reversion</text>
</svg>
