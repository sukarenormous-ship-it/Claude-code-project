<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="760" height="300" fill="#f9fafb"/>
  <text x="380" y="18" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">Spread ε และ Z-score Signal — Entry/Exit/Hold</text>
  <!-- Top panel: Spread ε -->
  <rect x="30" y="25" width="700" height="110" fill="white" stroke="#e5e7eb"/>
  <text x="50" y="42" font-size="11" fill="#374151" font-weight="700">Spread ε_t</text>
  <line x1="50" y1="125" x2="710" y2="125" stroke="#374151" stroke-width="1"/>
  <line x1="50" y1="125" x2="50" y2="38" stroke="#374151" stroke-width="1"/>
  <line x1="50" y1="80" x2="710" y2="80" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="38" y="83" text-anchor="end" font-size="9" fill="#0d9488">θ</text>
  <line x1="50" y1="55" x2="710" y2="55" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  <line x1="50" y1="105" x2="710" y2="105" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  <text x="38" y="58" text-anchor="end" font-size="9" fill="#d97706">+2σ</text>
  <text x="38" y="108" text-anchor="end" font-size="9" fill="#d97706">−2σ</text>
  <polyline points="50,80 80,75 108,65 135,52 155,48 175,55 200,68 225,80 248,88 270,80 295,72 318,60 340,50 362,56 382,68 402,80 422,86 445,80 468,74 490,66 512,56 532,52 555,60 578,72 598,80 618,85 640,80 665,75 690,78 710,80"
    fill="none" stroke="#0d9488" stroke-width="2"/>
  <!-- Bottom panel: Z-score -->
  <rect x="30" y="148" width="700" height="120" fill="white" stroke="#e5e7eb"/>
  <text x="50" y="165" font-size="11" fill="#374151" font-weight="700">Z-score z_t = (ε−θ)/σ</text>
  <line x1="50" y1="258" x2="710" y2="258" stroke="#374151" stroke-width="1"/>
  <line x1="50" y1="258" x2="50" y2="162" stroke="#374151" stroke-width="1"/>
  <line x1="50" y1="210" x2="710" y2="210" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="38" y="213" text-anchor="end" font-size="9" fill="#0d9488">0</text>
  <line x1="50" y1="178" x2="710" y2="178" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="50" y1="242" x2="710" y2="242" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="38" y="181" text-anchor="end" font-size="9" fill="#d97706">+2</text>
  <text x="38" y="245" text-anchor="end" font-size="9" fill="#d97706">−2</text>
  <!-- Z-score path with colors -->
  <polyline points="50,210 80,205 108,192 135,174 155,170 175,180 200,196 225,210 248,218 270,210 295,200 318,182 340,168 362,176 382,192 402,210 422,216 445,210 468,203 490,192 512,178 532,170 555,182 578,196 598,210 618,218 640,210 665,202 690,206 710,210"
    fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Color-coded entry zones -->
  <circle cx="135" cy="174" r="5" fill="#dc2626"/>
  <circle cx="155" cy="170" r="5" fill="#dc2626"/>
  <circle cx="340" cy="168" r="5" fill="#dc2626"/>
  <circle cx="532" cy="170" r="5" fill="#dc2626"/>
  <circle cx="225" cy="210" r="4" fill="#16a34a"/>
  <circle cx="402" cy="210" r="4" fill="#16a34a"/>
  <circle cx="598" cy="210" r="4" fill="#16a34a"/>
  <!-- Legend -->
  <circle cx="420" cy="285" r="4" fill="#dc2626"/>
  <text x="428" y="289" font-size="10" fill="#dc2626">Entry (|z|&gt;2)</text>
  <circle cx="510" cy="285" r="4" fill="#16a34a"/>
  <text x="518" y="289" font-size="10" fill="#16a34a">Exit (|z|≈0)</text>
  <text x="190" y="289" font-size="10" fill="#64748b">Z-score ใช้ rolling 30-day window สำหรับ μ, σ</text>
</svg>
