<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun',sans-serif">
<rect width="760" height="420" fill="#f8fafc" rx="6"/>
<text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Zone Waterfall — Active / Standby / Floor</text>

<!-- Main waterfall diagram -->
<!-- Floor zone (bottom, gray) -->
<rect x="80" y="290" width="360" height="90" fill="#f1f5f9" rx="4" stroke="#94a3b8" stroke-width="1.5"/>
<text x="260" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">FLOOR ZONE</text>
<text x="260" y="340" text-anchor="middle" font-size="11" fill="#64748b">ทุนสำรอง — ถือไว้เผื่อราคาดิ่งต่ำสุด</text>
<text x="260" y="358" text-anchor="middle" font-size="11" fill="#64748b">ไม่แตะ ยกเว้นกรณี drawdown สูงสุด</text>
<text x="440" y="340" font-size="20" font-weight="700" fill="#94a3b8">~20%</text>

<!-- Standby zone (middle, light blue) -->
<rect x="80" y="190" width="360" height="90" fill="#eff6ff" rx="4" stroke="#93c5fd" stroke-width="1.5"/>
<text x="260" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">STANDBY ZONE</text>
<text x="260" y="240" text-anchor="middle" font-size="11" fill="#2563eb">ทุนสำรองที่ยังหาดอกเบี้ยได้</text>
<text x="260" y="258" text-anchor="middle" font-size="11" fill="#2563eb">เก็บไว้ใน lending / DeFi / T-bill</text>
<text x="440" y="240" font-size="20" font-weight="700" fill="#3b82f6">~30%</text>

<!-- Active zone (top, cyan) -->
<rect x="80" y="90" width="360" height="90" fill="#ecfeff" rx="4" stroke="#67e8f9" stroke-width="2"/>
<text x="260" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">ACTIVE ZONE</text>
<text x="260" y="140" text-anchor="middle" font-size="11" fill="#0891b2">ทุนที่ Deploy เป็น Grid Orders</text>
<text x="260" y="158" text-anchor="middle" font-size="11" fill="#0891b2">คือส่วนที่ "เล่น" จริงอยู่ตอนนี้</text>
<text x="440" y="140" font-size="20" font-weight="700" fill="#06b6d4">~50%</text>

<!-- Down arrows between zones -->
<line x1="260" y1="178" x2="260" y2="192" stroke="#06b6d4" stroke-width="2"/>
<polygon points="255,192 265,192 260,200" fill="#06b6d4"/>

<line x1="260" y1="278" x2="260" y2="292" stroke="#3b82f6" stroke-width="2"/>
<polygon points="255,292 265,292 260,300" fill="#3b82f6"/>

<!-- Capital flow annotation (right side) -->
<text x="510" y="60" font-size="11" fill="#0f172a" font-weight="700">การไหลของทุน</text>

<!-- Flow diagram right side -->
<rect x="500" y="90" width="200" height="40" fill="#ecfeff" rx="4" stroke="#67e8f9" stroke-width="1"/>
<text x="600" y="108" text-anchor="middle" font-size="10" fill="#0e7490">ราคา → fill order</text>
<text x="600" y="122" text-anchor="middle" font-size="10" fill="#0e7490">คืนทุน + กำไร</text>

<line x1="600" y1="130" x2="600" y2="190" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="3,3"/>
<polygon points="595,190 605,190 600,198" fill="#0891b2"/>

<rect x="500" y="190" width="200" height="40" fill="#eff6ff" rx="4" stroke="#93c5fd" stroke-width="1"/>
<text x="600" y="208" text-anchor="middle" font-size="10" fill="#1d4ed8">กำไรส่วนเกิน</text>
<text x="600" y="222" text-anchor="middle" font-size="10" fill="#1d4ed8">→ Standby รับดอกเบี้ย</text>

<line x1="600" y1="230" x2="600" y2="290" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
<polygon points="595,290 605,290 600,298" fill="#3b82f6"/>

<rect x="500" y="290" width="200" height="40" fill="#f1f5f9" rx="4" stroke="#94a3b8" stroke-width="1"/>
<text x="600" y="308" text-anchor="middle" font-size="10" fill="#475569">Floor: ไม่แตะ</text>
<text x="600" y="322" text-anchor="middle" font-size="10" fill="#475569">จนถึง give-up point</text>

<!-- Legend: total = 100% -->
<rect x="80" y="355" width="360" height="30" fill="#f8fafc" rx="4" stroke="#e2e8f0" stroke-width="1"/>
<text x="260" y="375" text-anchor="middle" font-size="11" fill="#374151">ทุนรวม = Active(50%) + Standby(30%) + Floor(20%) = 100%</text>

<!-- Caption -->
<text x="380" y="410" text-anchor="middle" font-size="11" fill="#94a3b8">ไม่ต้องวาง 100% ทีเดียว — ใช้ Active Zone ก่อน ส่วนที่เหลือหาดอกเบี้ยใน Standby</text>
</svg>
